[package]
name = "e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "End-to-end smoke tests for OceanFS — spawns the release binary and exercises it via HTTP."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
rand = "0.8"
thiserror = "2"
