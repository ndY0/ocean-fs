name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # Build + test matrix
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "default"
          - "isa-l"
          - "cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # System libraries for fast native builds (avoids compiling C++ from source)
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev

      # ISA-L is optional; install only when testing with that feature
      - name: Install ISA-L (isa-l feature)
        if: contains(matrix.features, 'isa-l')
        run: sudo apt-get install -y -qq libisal-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build (all targets)
        if: matrix.features == 'default'
        run: cargo build --all-targets --workspace

      - name: Build with ISA-L
        if: matrix.features == 'isa-l'
        run: cargo build -p oceanfs-accel -p oceanfs-ec --all-targets --features isa-l

      - name: Build with CUDA (compile-check, no GPU needed)
        if: matrix.features == 'cuda'
        run: cargo build -p oceanfs-accel --all-targets --features cuda

      - name: Test (all targets)
        if: matrix.features == 'default'
        run: cargo test --all-targets --workspace

      - name: Test with ISA-L
        if: matrix.features == 'isa-l'
        run: cargo test -p oceanfs-accel -p oceanfs-ec --all-targets --features isa-l

      - name: Test with CUDA (compile-check, no GPU needed)
        if: matrix.features == 'cuda'
        run: cargo test -p oceanfs-accel --lib --features cuda

  # ------------------------------------------------------------------
  # Cross-compile for aarch64 (ARM NEON/SVE validation)
  # ------------------------------------------------------------------
  cross-aarch64:
    name: Cross-compile aarch64 (arm-sve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install aarch64 cross-linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Install aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # Cross-compile the accel crate with ARM NEON/SVE intrinsics.
      # This verifies the `std::arch::aarch64` intrinsics compile
      # without needing actual ARM hardware.
      - name: Build oceanfs-accel for aarch64
        run: cargo build -p oceanfs-accel --features arm-sve --target aarch64-unknown-linux-gnu

      # Also verify the portable path compiles for aarch64 (no feature)
      - name: Build oceanfs-accel for aarch64 (portable)
        run: cargo build -p oceanfs-accel --target aarch64-unknown-linux-gnu

  # ------------------------------------------------------------------
  # Linting
  # ------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (all features, deny warnings)
        run: cargo clippy --all-targets --features isa-l -- -D warnings

      - name: Clippy (cuda feature)
        run: cargo clippy -p oceanfs-accel --features cuda -- -D warnings

  # ------------------------------------------------------------------
  # Formatting
  # ------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # Documentation
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries (for doc builds of storage crate)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build docs (deny warnings, all features)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features isa-l

  # ------------------------------------------------------------------
  # Core purity check
  # ------------------------------------------------------------------
  core-purity:
    name: Core Purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: oceanfs-core must have no internal deps
        run: |
          if cargo tree --edges normal -p oceanfs-core 2>/dev/null | grep -q 'oceanfs-'; then
            echo "ERROR: oceanfs-core depends on another oceanfs-* crate"
            cargo tree --edges normal -p oceanfs-core
            exit 1
          fi
          echo "PASS: oceanfs-core has zero internal dependencies"

  # ------------------------------------------------------------------
  # Circular dependency check
  # ------------------------------------------------------------------
  no-circular-deps:
    name: No Circular Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Detect circular dependencies
        run: |
          cargo tree --edges normal --depth 1 -p oceanfs-node 2>/dev/null | grep oceanfs || true
          echo "PASS: manual review required — ensure no bidirectional oceanfs-* edges"

  # ------------------------------------------------------------------
  # Benchmark regression detection
  # ------------------------------------------------------------------
  benchmarks:
    name: Benchmarks (compile + quick test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build benchmarks
        run: cargo bench --no-run --manifest-path benches/Cargo.toml

      - name: Quick benchmark sanity (1 sample)
        run: |
          cargo bench --bench ec_benchmark -- --sample-size 2 --warm-up-time 0 --measurement-time 1 2>&1 | head -30
