name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # Full workspace build + test (default features)
  # ------------------------------------------------------------------
  build:
    name: Build (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --all-targets --workspace

  test:
    name: Test (default)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --all-targets --workspace

  # ------------------------------------------------------------------
  # Feature-gated builds (isa-l, cuda)
  # ------------------------------------------------------------------
  build-isa-l:
    name: Build (isa-l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build with ISA-L
        run: cargo build -p oceanfs-accel -p oceanfs-ec --all-targets --features isa-l

  test-isa-l:
    name: Test (isa-l)
    needs: build-isa-l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test with ISA-L
        run: cargo test -p oceanfs-accel -p oceanfs-ec --all-targets --features isa-l

  build-cuda:
    name: Build (cuda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build with CUDA (no GPU needed)
        run: cargo build -p oceanfs-accel --all-targets --features cuda

  test-cuda:
    name: Test (cuda)
    needs: build-cuda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Test with CUDA (no GPU needed)
        run: cargo test -p oceanfs-accel --lib --features cuda

  # ------------------------------------------------------------------
  # Cross-compile aarch64 (ARM NEON/SVE validation)
  # ------------------------------------------------------------------
  cross-aarch64:
    name: Cross-compile (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install aarch64 target + cross-linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build with arm-sve feature
        run: cargo build -p oceanfs-accel --features arm-sve --target aarch64-unknown-linux-gnu
      - name: Build portable aarch64
        run: cargo build -p oceanfs-accel --target aarch64-unknown-linux-gnu

  # ------------------------------------------------------------------
  # Linting
  # ------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
        with:
          components: clippy
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default)
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Clippy (isa-l)
        run: cargo clippy -p oceanfs-accel --features isa-l -- -D warnings
      - name: Clippy (cuda)
        run: cargo clippy -p oceanfs-accel --features cuda -- -D warnings

  # ------------------------------------------------------------------
  # Formatting
  # ------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # Documentation
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev libisal-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (all features, deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features isa-l

  # ------------------------------------------------------------------
  # Core purity check
  # ------------------------------------------------------------------
  core-purity:
    name: Core Purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: oceanfs-core must have no internal deps
        run: |
          if cargo tree --edges normal -p oceanfs-core 2>/dev/null | grep -q 'oceanfs-'; then
            echo "ERROR: oceanfs-core depends on another oceanfs-* crate"
            cargo tree --edges normal -p oceanfs-core
            exit 1
          fi
          echo "PASS: oceanfs-core has zero internal dependencies"

  # ------------------------------------------------------------------
  # Circular dependency check
  # ------------------------------------------------------------------
  no-circular-deps:
    name: No Circular Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Detect circular dependencies
        run: |
          cargo tree --edges normal --depth 1 -p oceanfs-node 2>/dev/null | grep oceanfs || true
          echo "PASS: manual review required — ensure no bidirectional oceanfs-* edges"

  # ------------------------------------------------------------------
  # Benchmark compile check
  # ------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librocksdb-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmarks
        run: cargo bench --no-run --manifest-path benches/Cargo.toml
