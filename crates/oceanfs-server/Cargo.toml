[package]
name = "oceanfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
oceanfs-core.workspace = true
oceanfs-storage-api.workspace = true
oceanfs-routing.workspace = true
oceanfs-membership.workspace = true
oceanfs-network.workspace = true
# Optional: used for type re-exports and concrete type construction (e.g.,
# RocksDbMetadataStore, SegmentStore). Architecture §4.1 permits the server
# crate to import concrete storage types for wiring at the composition root.
# See ADR-0005 §References.
oceanfs-storage = { workspace = true, optional = true }
# Optional: durability types for admin handler scrub wiring (ADR-0009).
oceanfs-durability = { workspace = true, optional = true }
# Optional: used for EC decoding during read repair.
# When enabled, the ReadCoordinator can reconstruct missing data shards
# from available parity shards.
oceanfs-ec = { workspace = true, optional = true }
# Optional: L1 object cache, L2 metadata cache, L3 negative cache (Bloom
# filter), and prefetch engine. The S3 handler delegates to these caches
# on every GET/HEAD request — see s3_handler/handlers.rs for the cache
# cascade order.
oceanfs-cache = { workspace = true, optional = true }
# Optional: GPU-accelerated EC encoding via ISA-L, CUDA, etc.
# When enabled, the AccelDispatcher offloads encode/decode to hardware
# backends for improved throughput.
oceanfs-accel = { workspace = true, optional = true }
arc-swap.workspace = true
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
futures = "0.3"
hex = "0.4"
hmac.workspace = true
http.workspace = true
http-body-util = "0.1"
mime_guess.workspace = true
parking_lot.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true

[features]
# Default features enable the full S3 server with storage, caching, and EC.
# Disable individual features for testing or resource-constrained deployments.
default = ["storage", "cache", "ec"]
# Enables concrete storage type usage (RocksDbMetadataStore).
storage = ["dep:oceanfs-storage", "dep:oceanfs-durability"]
# Enables EC decoding in ReadCoordinator for read repair.
ec = ["dep:oceanfs-ec"]
# Enables L1/L2/L3 cache cascade and prefetch engine in S3 handler.
cache = ["dep:oceanfs-cache"]
# Enables GPU-accelerated EC encoding via hardware backends.
accel = ["dep:oceanfs-accel"]

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
