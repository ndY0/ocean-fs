[package]
name = "oceanfs-accel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = ["dep:cudarc"]
# ISA-L feature uses raw extern "C" FFI bindings to the system-installed
# libisal rather than the isal-rs crate. This avoids an extra dependency
# and gives direct control over the FFI surface. The FFI declarations
# are in isal.rs with full SAFETY documentation per coding.md §7.2.
isa-l = []
arm-sve = []

[dependencies]
oceanfs-core.workspace = true
oceanfs-ec.workspace = true
bytes.workspace = true
cudarc = { workspace = true, optional = true, features = ["cuda-12000"] }
parking_lot.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
static_assertions.workspace = true

[lints]
workspace = true
