[package]
name = "oceanfs-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
oceanfs-core.workspace = true
oceanfs-storage-api.workspace = true
oceanfs-hash.workspace = true
oceanfs-ec.workspace = true
oceanfs-accel.workspace = true
oceanfs-membership.workspace = true
oceanfs-network.workspace = true
blake3.workspace = true
async-trait = "0.1"
bytes.workspace = true
crc32fast = "1"
parking_lot.workspace = true
prost.workspace = true
num_cpus.workspace = true
rocksdb.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

rand = "0.8"

# Platform I/O optimizations
memmap2 = "0.9"
libc = "0.2"
tokio-uring = { version = "0.5", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = []
io-uring = ["dep:tokio-uring"]
sendfile = ["dep:http", "dep:http-body", "dep:http-body-util"]

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
oceanfs-routing.workspace = true
static_assertions.workspace = true
tempfile = "3"

[lints]
workspace = true
