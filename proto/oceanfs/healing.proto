syntax = "proto3";

package oceanfs.healing;

import "oceanfs/common.proto";
import "oceanfs/hinted_handoff.proto";
import "oceanfs/segment.proto";

// ---------------------------------------------------------------------------
// Healing and hinted-handoff messages and service.
// ---------------------------------------------------------------------------

// A hinted handoff request carrying data intended for a different node.
// DEPRECATED: retained for backward-compat with existing clients.
// New clients should use HintedHandoffRequest.
message HintRequest {
  oceanfs.common.NodeId intended_for = 1;
  oceanfs.common.SegmentId segment_id = 2;
  bytes data = 3;
  oceanfs.common.HlcTimestamp hlc = 4;
}

// Response to a hinted handoff delivery.
// DEPRECATED: retained for backward-compat.
message HintResponse {
  bool accepted = 1;
  oceanfs.common.SegmentId stored_segment_id = 2;
}

// Request to exchange Merkle roots for anti-entropy.
// Supports two modes:
// - Root-only exchange (include_full_tree = false): lightweight, 32 bytes per segment.
// - Full tree exchange (include_full_tree = true): the responder sends its pre-built
//   tree structure, avoiding peer-side CPU cost of reconstruction.
message MerkleRequest {
  repeated oceanfs.common.SegmentId segment_ids = 1;
  uint32 tree_depth = 2;
  oceanfs.common.NodeId node_id = 3;
  // When true, the responder serialises its pre-built Merkle tree.
  bool include_full_tree = 4;
}

// A single node in the Merkle tree for gRPC exchange.
message TreeNode {
  // Position of this node in the binary tree (root = 0).
  uint32 node_index = 1;
  // BLAKE3 hash of this node's subtree (32 bytes).
  bytes hash = 2;
  // Child node indices. [left_child_index, right_child_index] for internal
  // nodes; empty for leaf nodes.
  repeated uint32 children = 3;
}

// Response with Merkle roots and optional full tree structure.
message MerkleResponse {
  oceanfs.common.SegmentId segment_id = 1;
  bytes root_hash = 2;               // 32 bytes BLAKE3
  repeated bytes leaf_hashes = 3;    // each 32 bytes BLAKE3
  // When true, internal_nodes contains the full tree structure.
  bool full_tree_included = 4;
  // The full pre-built Merkle tree (only populated when include_full_tree = true
  // or when the server detected a root mismatch).
  repeated TreeNode internal_nodes = 5;
}

// Healing RPC service for hinted handoff, anti-entropy, and EC-based repair.
service HealingRpc {
  // Deliver a single hinted handoff to a returning node (legacy).
  rpc HintedHandoffSingle(HintRequest) returns (HintResponse);

  // Deliver batched hinted handoffs to a returning node.
  rpc HintedHandoff(oceanfs.hinted_handoff.HintedHandoffRequest)
      returns (oceanfs.hinted_handoff.HintedHandoffResponse);

  // Exchange Merkle tree hashes for anti-entropy comparison.
  rpc MerkleExchange(MerkleRequest) returns (MerkleResponse);

  // Fetch a specific shard from a peer for EC reconstruction.
  // Server-streaming: the responder sends the shard data in chunks
  // to enable overlapping data transfer with processing (perf rule 4.4).
  rpc FetchShard(FetchShardRequest) returns (stream FetchShardChunk);

  // Fetch an object's CURRENT state by key — hinted-handoff
  // materialization (see FetchHintObjectRequest). The receiver applies
  // the current state with HLC-LWW instead of replaying the hinted
  // (possibly stale or deleted) version. Server-streaming.
  rpc FetchHintObject(FetchHintObjectRequest) returns (stream FetchHintObjectChunk);

  // Push a reconstructed shard to a remote node that owns it.
  rpc PushRepairedShard(PushRepairedShardRequest) returns (PushRepairedShardResponse);

  // Announce a data pool's confirmed loss to the replica holders of its
  // affected segments (ADR-0029 §D4 fast path; g3). RF-bounded fan-out —
  // the sender targets exactly `storage_locations − self`.
  rpc AnnounceLoss(LossAnnouncement) returns (LossAck);

  // Announce a compaction segment-remap (old id → new id) to the holders
  // of the old segment so they re-point their metadata (GAP-1 closure).
  rpc AnnounceRemap(SegmentRemap) returns (RemapAck);

  // Request a node to re-replicate a segment it does not yet hold
  // (ADR-0030 target-pull; g5). The sender is the DISPATCHER (a live
  // holder that detected under-replication); the receiver is the
  // acquiring node whose pool will hold the new copy. The request is
  // routing intent only — the data moves over FetchShard.
  rpc RequestReReplication(RequestReReplicationRequest)
      returns (RequestReReplicationResponse);

  // Pull the replicated lifecycle metadata for segments the caller
  // holds locally (ADR-0035 D1/D2 — g7 wal-pool-loss recovery). A
  // holder's registry entry is the segment's seal-time metadata replica
  // (the same fields the sealed-segment push carried,
  // oceanfs.segment.PushSealedSegmentRequest). Server-streaming: one
  // entry per requested id the holder actually holds as Sealed; ids the
  // holder does not hold (or has not sealed) are simply absent from the
  // stream — the caller's local-only recompute covers them (ADR-0035 D3).
  rpc FetchSegmentLifecycleMetadata(SegmentLifecycleQuery)
      returns (stream SegmentLifecycleEntry);
}

// Request for the replicated-lifecycle metadata pull (ADR-0035 D2).
message SegmentLifecycleQuery {
  // The segment ids the recovering node found in its intact data-pool
  // `.dat` roots (and/or referenced by its objects CF).
  repeated oceanfs.common.SegmentId segment_ids = 1;
}

// One segment's replicated lifecycle metadata as held by the responder
// (ADR-0035 D1). Field semantics mirror the sealed-segment push payload
// (oceanfs.segment.PushSealedSegmentRequest) plus the registry-only
// fields the holder entry carries.
message SegmentLifecycleEntry {
  oceanfs.common.SegmentId segment_id = 1;
  // SegmentState as u8 (0 = Reserved, 1 = Sealed, 2 = Deleted). The
  // responder only streams Sealed entries.
  uint32 state = 2;
  // oceanfs_core::SizeTier as u8 (0=Inline 1=Small 2=Standard 3=Multi).
  uint32 tier = 3;
  uint32 ec_k = 4;
  uint32 ec_m = 5;
  // The seal-time BLAKE3 root over the data section (32 bytes).
  bytes merkle_root = 6;
  // The replica holder set (the registry entry's storage_locations).
  repeated oceanfs.common.NodeId storage_locations = 7;
  // ADR-0034 D5 membership — the objects contained at seal time.
  repeated oceanfs.segment.ContainedObject contained_objects = 8;
  // The data-section byte total at seal (ADR-0034 D1).
  uint64 total_bytes = 9;
  // The storage pool owning the `.dat` (ADR-0029 §D1; 0 = legacy root).
  uint32 pool_id = 10;
  // Seal timestamp (ms since epoch).
  int64 sealed_at = 11;
}

// Why a re-replication repair was requested (ADR-0029 §D6 urgency; the
// worker reports it as `oceanfs_repair_queue_depth{priority}`).
enum RepairReason {
  REPAIR_REASON_UNSPECIFIED = 0;
  // The g3 loss-announcement fast path.
  REPAIR_REASON_ANNOUNCEMENT = 1;
  // The g4 periodic reconciliation safety net.
  REPAIR_REASON_RECONCILIATION = 2;
}

// A re-replication request from a holder-side dispatcher to an
// acquiring target node (ADR-0030 Decision 2).
message RequestReReplicationRequest {
  // The segment needing an additional live copy.
  oceanfs.common.SegmentId segment_id = 1;
  // LIVE holders the target may fetch the segment data from
  // (the dispatcher filters out unavailable nodes before sending).
  repeated oceanfs.common.NodeId holders = 2;
  // Which detector drove this repair (Announcement | Reconciliation).
  RepairReason reason = 3;
  // The segment's seal-time merkle root (32 bytes), read by the
  // dispatcher from ITS OWN registry entry. The acquiring worker
  // verifies the fetched data section against it — a truncated or
  // corrupt transfer is rejected instead of being materialized as a
  // self-consistent-but-wrong copy (the same integrity check
  // `push_sealed_segment` performs on the owner side).
  bytes merkle_root = 4;
  // The segment's seal-time shape (tier + EC parameters), read by the
  // dispatcher from its own registry entry alongside the merkle root.
  // The acquiring worker registers the pulled copy with THIS shape —
  // the source's real size tier and EC geometry, not hardcoded
  // defaults (the same fidelity `push_sealed_segment` preserves on the
  // owner side). Wire encoding matches the segment-push protocol:
  // tier = oceanfs_core::SizeTier as u8 (0=Inline 1=Small 2=Standard
  // 3=Multi).
  uint32 tier = 5;
  uint32 ec_k = 6;
  uint32 ec_m = 7;
}

// Acknowledges a re-replication request. `accepted` is true when the
// target enqueued the repair (it will pull + write + stamp).
message RequestReReplicationResponse {
  bool accepted = 1;
}

// ---------------------------------------------------------------------------
// FetchShard — request a shard from a peer for EC reconstruction
// ---------------------------------------------------------------------------

// Request to fetch a single shard from a specific segment.
message FetchShardRequest {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 shard_index = 2;
  // Full-segment mode (ADR-0030 target-pull): when `offset == 0 &&
  // length == 0`, the server streams the ENTIRE data section of the
  // segment, regardless of shard_index — the re-replication fetch. In
  // the single-shard mode (offset/length > 0), the server returns the
  // requested byte range of the named shard (EC reconstruction).
  uint64 offset = 3;
  uint64 length = 4;
}

// A chunk of shard data streamed from the server.
message FetchShardChunk {
  uint32 chunk_index = 1;
  bytes data = 2;
}

// Request to fetch an object's CURRENT state from the origin node —
// hinted-handoff materialization BY KEY. The receiver asks "what is
// the current state of K?" and applies it (HLC-LWW against its local
// state). This is the correct semantics when the origin's segment data
// has been GC'd/reaped: the object no longer has the hinted version
// (deleted or superseded — the metadata is the truth), so the hint is
// resolved against the CURRENT state instead of replayed. Serving the
// stale version would resurrect a deleted object or regress a newer
// write. The sender additionally pre-checks the key locally at drain
// time and drops hints whose key no longer exists — no fetch is even
// attempted for resolved-by-deletion hints.
message FetchHintObjectRequest {
  oceanfs.common.BucketId bucket_id = 1;
  string object_key = 2;
}

// A chunk of the object's logical data, streamed from the server. The
// FIRST chunk carries the object's state (present + hlc + size); when
// the object is absent, the stream contains exactly one chunk with
// present=false (hlc = the tombstone's HLC when a tombstone exists).
message FetchHintObjectChunk {
  uint32 chunk_index = 1;
  bytes data = 2;
  bool present = 3;
  oceanfs.common.HlcTimestamp hlc = 4;
  uint64 size = 5;
  // BLAKE3 hash of the object's logical data (carried on the FIRST
  // chunk). The receiver verifies the reassembled bytes against it —
  // a stream truncated mid-way (origin restart, network hiccup) must
  // not be applied as a full version: a partial object carrying the
  // full version's HLC would win LWW and spread unrecorded data to
  // every node that fetches from the same origin.
  bytes blake3_hash = 6;
}

// ---------------------------------------------------------------------------
// PushRepairedShard — push a reconstructed shard to the owning peer
// ---------------------------------------------------------------------------

// Request to push a reconstructed shard to a peer that owns it.
message PushRepairedShardRequest {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 shard_index = 2;
  bytes data = 3;
  oceanfs.common.HlcTimestamp hlc = 4;
}

// Response acknowledging receipt of the repaired shard.
message PushRepairedShardResponse {
  bool accepted = 1;
}

// ---------------------------------------------------------------------------
// Loss announcements (ADR-0029 §D4 targeted push; g3 loss-announcement)
// ---------------------------------------------------------------------------

// A data pool's confirmed-loss announcement. The sender (the node whose
// pool died) carries the exact affected segment set — peers cannot derive
// a node's local segment→pool mapping, so the set rides the event
// (ADR-0029 §D4 correction note). Segment ids are 16 bytes; a 10k-segment
// pool is ~160 KB — bounded and rare.
message LossAnnouncement {
  // The announcing node (whose data pool died).
  oceanfs.common.NodeId origin = 1;
  // The dead pool id (config-order, ADR-0029 §D8).
  uint32 pool_id = 2;
  // The affected segment set (derive_affected_segments, g2).
  repeated oceanfs.common.SegmentId segments = 3;
}

// Acknowledges a loss announcement. `accepted` counts the announced
// segments the receiver verified it holds AND enqueued for repair
// (re-replication, g5).
message LossAck {
  uint32 accepted = 1;
}

// A compaction remap: the owner compacted `old_segment_id` into the NEW
// repacked `new_segment_id`. The receiver must re-point any object
// metadata referencing the old id to the new id — the owner's compaction
// rewrites only its own RocksDB, and without propagation replicas'
// metadata silently diverges until reads reference a segment that exists
// nowhere (GAP-1). This is the owner-authoritative fast path; the
// periodic reconciliation (g4) is the mandatory failsafe that catches
// whatever this push missed.
message SegmentRemap {
  // The compacting (owner) node.
  oceanfs.common.NodeId origin = 1;
  // The pre-compaction segment id being replaced.
  oceanfs.common.SegmentId old_segment_id = 2;
  // The repacked replacement segment id.
  oceanfs.common.SegmentId new_segment_id = 3;
  // The chunk-remap table: every live chunk repacked from the old
  // segment into the new one. The repacked byte layout is NOT
  // offset-preserving (the compactor packs live chunks contiguously),
  // so a receiver cannot re-point `old → new` keeping the same offset —
  // it must translate each chunk ref through this table.
  repeated RemappedChunk chunks = 4;
  // The object-key list of every LIVE object the owner repacked from the
  // old segment into the new one (ADR-0034 D5/2b). Each holder re-points
  // exactly these keys via point lookups — never a local objects-CF scan.
  // A key this holder does not own is a no-op; an object whose chunk is
  // absent from `chunks` (tombstoned by the compactor's dead filter) keeps
  // its old ref. Empty on a mixed-version window (an owner on an older
  // binary) degrades to "record the alias, re-point nothing" — the alias
  // + g4 reconciliation cover the divergence.
  repeated oceanfs.segment.ContainedObject objects = 5;
}

// One repacked chunk: the receiver translates every chunk ref
// `(old_segment_id, old_offset, length)` it holds into
// `(new_segment_id, new_offset, length)`.
message RemappedChunk {
  // The chunk's offset in the OLD segment's data section.
  uint64 old_offset = 1;
  // The chunk's length (unchanged by repacking).
  uint32 length = 2;
  // The chunk's offset in the NEW segment's data section.
  uint64 new_offset = 3;
}

// Acknowledges a segment remap. `applied` is true when the receiver
// verified it held the old segment (and the origin was a legitimate
// holder) and re-pointed its metadata.
message RemapAck {
  bool applied = 1;
}
