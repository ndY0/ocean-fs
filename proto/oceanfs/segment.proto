syntax = "proto3";

package oceanfs.segment;

import "oceanfs/common.proto";

// ---------------------------------------------------------------------------
// Segment-related message types.
// These are shared across storage, network, and server crates.
// ---------------------------------------------------------------------------

// Status for segment append acknowledgement.
enum AckStatus {
  OK = 0;
  FULL = 1;
  ERROR = 2;
}

// A request to append data to a segment (streaming chunk).
message SegmentAppendRequest {
  oceanfs.common.SegmentId segment_id = 1;
  oceanfs.common.ShardIndex shard_index = 2;
  uint64 offset = 3;
  bytes data = 4;
  oceanfs.common.HlcTimestamp hlc = 5;
  // Object metadata for cross-node replication.
  // When set, the receiver persists this metadata in its local store
  // so that reads from any replica can locate the object.
  string bucket_id = 6;
  string object_key = 7;
  uint64 object_size = 8;
  bytes blake3_hash = 9;
  repeated bytes chunk_segment_ids = 10;
  repeated uint64 chunk_offsets = 11;
  repeated uint32 chunk_lengths = 12;
}

// Response to an append request.
message SegmentAppendResponse {
  uint64 wal_position = 1;
  AckStatus ack = 2;
}

// A request to fetch a shard from a sealed segment.
message FetchShardRequest {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 shard_index = 2;
  uint64 offset = 3;
  uint64 length = 4;
}

// A chunk of shard data streamed back to the requester.
message ShardResponse {
  bytes data = 1;
  bytes checksum = 2;       // BLAKE3 checksum of this chunk
  uint32 chunk_index = 3;
}

// Segment metadata describing EC parameters and storage locations.
message SegmentMetadata {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 ec_k = 2;                  // data shard count
  uint32 ec_m = 3;                  // parity shard count
  bytes merkle_root = 4;            // 32 bytes BLAKE3
  repeated oceanfs.common.NodeId storage_locations = 5;
}

// Request to delete object metadata on a replica node.
message DeleteObjectRequest {
  string bucket_id = 1;
  string object_key = 2;
}

// Response to a delete request.
message DeleteObjectResponse {
  bool deleted = 1;
}
