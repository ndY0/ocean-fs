syntax = "proto3";

package oceanfs.segment;

import "oceanfs/common.proto";

// ---------------------------------------------------------------------------
// Segment-related message types.
// These are shared across storage, network, and server crates.
// ---------------------------------------------------------------------------

// Status for segment append acknowledgement.
enum AckStatus {
  OK = 0;
  FULL = 1;
  ERROR = 2;
}

// A request to append data to a segment (streaming chunk).
message SegmentAppendRequest {
  oceanfs.common.SegmentId segment_id = 1;
  oceanfs.common.ShardIndex shard_index = 2;
  uint64 offset = 3;
  bytes data = 4;
  oceanfs.common.HlcTimestamp hlc = 5;
  // Object metadata for cross-node replication.
  // When set, the receiver persists this metadata in its local store
  // so that reads from any replica can locate the object.
  string bucket_id = 6;
  string object_key = 7;
  uint64 object_size = 8;
  bytes blake3_hash = 9;
  repeated bytes chunk_segment_ids = 10;
  repeated uint64 chunk_offsets = 11;
  repeated uint32 chunk_lengths = 12;
}

// Response to an append request.
message SegmentAppendResponse {
  uint64 wal_position = 1;
  AckStatus ack = 2;
}

// A request to fetch a shard from a sealed segment.
// Single-shard mode: set segment_id, shard_index, offset, length.
// Batched mode: set segment_id and fill the shards repeated field.
// The server streams back all requested shard ranges in sequence.
message FetchShardRequest {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 shard_index = 2;
  uint64 offset = 3;
  uint64 length = 4;
  // Batched shard ranges for single-RPC-per-node fetching (Item 9).
  repeated ShardRange shards = 5;
}

// A range within a single shard to fetch.
message ShardRange {
  uint32 shard_index = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

// A chunk of shard data streamed back to the requester.
message ShardResponse {
  bytes data = 1;
  bytes checksum = 2;       // BLAKE3 checksum of this chunk
  uint32 chunk_index = 3;
}

// Segment metadata describing EC parameters and storage locations.
message SegmentMetadata {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 ec_k = 2;                  // data shard count
  uint32 ec_m = 3;                  // parity shard count
  bytes merkle_root = 4;            // 32 bytes BLAKE3
  repeated oceanfs.common.NodeId storage_locations = 5;
}

// Request to delete object metadata on a replica node.
message DeleteObjectRequest {
  string bucket_id = 1;
  string object_key = 2;
  // HLC timestamp of the delete, stamped by the originating node's
  // clock. All replicas converge on this one tombstone timestamp so
  // delete-vs-write LWW is decidable across replicas (G4/G8).
  oceanfs.common.HlcTimestamp hlc = 3;
}

// Response to a delete request.
message DeleteObjectResponse {
  bool deleted = 1;
}

// Request to fetch object metadata from a replica for read repair (4.2).
message GetObjectMetadataRequest {
  string bucket_id = 1;
  string object_key = 2;
}

// Object metadata returned by a replica for read repair comparison.
message GetObjectMetadataResponse {
  // Whether the object was found on this replica.
  bool found = 1;
  // Object size in bytes.
  uint64 size = 2;
  // BLAKE3 hash of the object data (32 bytes, empty if not present).
  bytes blake3_hash = 3;
  // HLC timestamp of this object version.
  oceanfs.common.HlcTimestamp hlc = 4;
  // Inline data (present for small objects, empty otherwise).
  bytes inline_data = 5;
  // Chunk references for segment-stored objects.
  repeated oceanfs.common.SegmentId chunk_segment_ids = 6;
  repeated uint64 chunk_offsets = 7;
  repeated uint32 chunk_lengths = 8;
  // Compression metadata per chunk (empty = all uncompressed).
  repeated uint32 chunk_logical_lengths = 9;
  repeated bool chunk_compressed = 10;
}

// Request to push corrected object metadata + data to a stale replica (4.2).
message PutObjectMetadataRequest {
  string bucket_id = 1;
  string object_key = 2;
  uint64 size = 3;
  bytes blake3_hash = 4;
  oceanfs.common.HlcTimestamp hlc = 5;
  bytes inline_data = 6;
  repeated oceanfs.common.SegmentId chunk_segment_ids = 7;
  repeated uint64 chunk_offsets = 8;
  repeated uint32 chunk_lengths = 9;
  // Compression metadata per chunk (empty = all uncompressed).
  repeated uint32 chunk_logical_lengths = 10;
  repeated bool chunk_compressed = 11;
}

// Response acknowledging the metadata write.
message PutObjectMetadataResponse {
  bool written = 1;
}

// A request to push a FULL SEALED segment's data to a replica node
// (sealed-segment-replication). Client-streaming: the first chunk carries
// the segment metadata (segment_id, tier, ec, merkle_root,
// storage_locations) plus the first slice of the data section; every
// chunk carries data. The receiver assembles the full data section,
// verifies the merkle root against it, persists it, and registers the
// segment idempotently.
message PushSealedSegmentRequest {
  oceanfs.common.SegmentId segment_id = 1;
  uint32 tier = 2;                    // oceanfs_core::SizeTier as u8
  uint32 ec_k = 3;
  uint32 ec_m = 4;
  bytes merkle_root = 5;              // 32 bytes BLAKE3 over the data section
  repeated oceanfs.common.NodeId storage_locations = 6;
  bytes data = 7;                     // slice of the segment data section
}

// Response to a sealed-segment push.
message PushSealedSegmentResponse {
  bool acked = 1;
}
