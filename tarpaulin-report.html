e: usize,\n    /// Maximum number of buffers in the pool.\n    max_buffers: usize,\n    /// Total number of buffers created (in-use + free).\n    total_created: usize,\n}\n\nimpl BufferPool {\n    /// Creates a new buffer pool.\n    ///\n    /// `chunk_size` is the size of each buffer in bytes.\n    /// `max_buffers` is the maximum number of buffers to keep in the pool.\n    pub fn new(chunk_size: usize, max_buffers: usize) -\u003e Self {\n        let free = {\n            let mut v = Vec::with_capacity(max_buffers);\n            // Pre-allocate all buffers eagerly.\n            for _ in 0..max_buffers {\n                v.push(BytesMut::with_capacity(chunk_size));\n            }\n            v\n        };\n        Self { free: Mutex::new(free), chunk_size, max_buffers, total_created: max_buffers }\n    }\n\n    /// Acquires a buffer from the pool.\n    ///\n    /// Returns an error if no free buffers are available.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error when the pool has no free buffers.\n    pub fn acquire(\u0026self) -\u003e Result\u003cBytesMut\u003e {\n        let mut free = self.free.lock();\n        free.pop().ok_or(Error::BufferPoolExhausted)\n    }\n\n    /// Releases a buffer back to the pool for reuse.\n    ///\n    /// If the pool already has `max_buffers` free entries, the buffer\n    /// is dropped instead of being stored.\n    pub fn release(\u0026self, mut buf: BytesMut) {\n        buf.clear();\n        let mut free = self.free.lock();\n        if free.len() \u003c self.max_buffers {\n            free.push(buf);\n        }\n        // Else: drop the excess buffer to avoid unbounded growth.\n    }\n\n    /// Returns the number of free buffers currently available.\n    pub fn free_count(\u0026self) -\u003e usize {\n        self.free.lock().len()\n    }\n\n    /// Returns the chunk size for buffers in this pool.\n    pub fn chunk_size(\u0026self) -\u003e usize {\n        self.chunk_size\n    }\n\n    /// Returns the maximum number of buffers in the pool.\n    pub fn max_buffers(\u0026self) -\u003e usize {\n        self.max_buffers\n    }\n\n    /// Returns the total number of buffers ever created by this pool.\n    pub fn total_created(\u0026self) -\u003e usize {\n        self.total_created\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn acquire_returns_pre_allocated_buffer() {\n        let pool = BufferPool::new(1024, 2);\n        let buf = pool.acquire().unwrap();\n        assert_eq!(buf.capacity(), 1024);\n        assert!(buf.is_empty());\n    }\n\n    #[test]\n    fn acquire_all_exhausts_pool() {\n        let pool = BufferPool::new(1024, 2);\n        let _b1 = pool.acquire().unwrap();\n        let _b2 = pool.acquire().unwrap();\n        assert!(pool.acquire().is_err());\n    }\n\n    #[test]\n    fn release_makes_buffer_available_again() {\n        let pool = BufferPool::new(1024, 2);\n        let b1 = pool.acquire().unwrap();\n        assert_eq!(pool.free_count(), 1);\n        pool.release(b1);\n        assert_eq!(pool.free_count(), 2);\n    }\n\n    #[test]\n    fn release_clears_buffer() {\n        let pool = BufferPool::new(1024, 1);\n        let mut buf = pool.acquire().unwrap();\n        buf.extend_from_slice(\u0026[1, 2, 3]);\n        pool.release(buf);\n        let reused = pool.acquire().unwrap();\n        assert!(reused.is_empty());\n    }\n\n    #[test]\n    fn release_beyond_max_drops_buffer() {\n        let pool = BufferPool::new(1024, 1);\n        let b1 = pool.acquire().unwrap();\n        // Acquire another (the pool creates one on demand? No — it was\n        // pre-allocated. Let's take the only slot, release it, acquire\n        // it again, then release a second buffer.\n        pool.release(b1);\n        let _b2 = pool.acquire().unwrap(); // pool is now empty\n                                           // Create an external buffer and release it\n        let extra = BytesMut::with_capacity(1024);\n        pool.release(extra); // pool had 0 free, now 1\n        assert_eq!(pool.free_count(), 1);\n        // Release another extra — pool should not grow beyond max\n        let extra2 = BytesMut::with_capacity(1024);\n        pool.release(extra2); // pool already has 1, max=1 → drops extra2\n        assert_eq!(pool.free_count(), 1);\n    }\n\n    #[test]\n    fn free_count_is_accurate() {\n        let pool = BufferPool::new(1024, 5);\n        assert_eq!(pool.free_count(), 5);\n        let _b = pool.acquire().unwrap();\n        assert_eq!(pool.free_count(), 4);\n    }\n\n    #[test]\n    fn chunk_size_and_max_buffers_match_config() {\n        let pool = BufferPool::new(65536, 8);\n        assert_eq!(pool.chunk_size(), 65536);\n        assert_eq!(pool.max_buffers(), 8);\n    }\n\n    #[test]\n    fn total_created_matches_max_on_init() {\n        let pool = BufferPool::new(4096, 3);\n        assert_eq!(pool.total_created(), 3);\n    }\n}\n","traces":[{"line":47,"address":[8042708,8042714,8042288],"length":1,"stats":{"Line":5}},{"line":49,"address":[7114323],"length":1,"stats":{"Line":3}},{"line":51,"address":[7114418,7114342],"length":1,"stats":{"Line":17}},{"line":52,"address":[6565831,6565643],"length":1,"stats":{"Line":19}},{"line":54,"address":[7114485],"length":1,"stats":{"Line":9}},{"line":56,"address":[6565683],"length":1,"stats":{"Line":3}},{"line":66,"address":[8042930,8042924,8042736],"length":1,"stats":{"Line":2}},{"line":67,"address":[7114755],"length":1,"stats":{"Line":2}},{"line":68,"address":[8095045,8094984],"length":1,"stats":{"Line":4}},{"line":75,"address":[8042944,8043279],"length":1,"stats":{"Line":2}},{"line":76,"address":[6566131],"length":1,"stats":{"Line":3}},{"line":77,"address":[7351024],"length":1,"stats":{"Line":3}},{"line":78,"address":[7115118,7115057],"length":1,"stats":{"Line":8}},{"line":79,"address":[7351151],"length":1,"stats":{"Line":4}},{"line":85,"address":[6565395,6565264,6565389],"length":1,"stats":{"Line":1}},{"line":86,"address":[6   /// The maximum allowed size for this tier.\n        max: u64,\n    },\n\n    /// The buffer pool is exhausted and cannot allocate a new buffer.\n    #[error(\"buffer pool exhausted\")]\n    BufferPoolExhausted,\n\n    /// An internal I/O error occurred.\n    #[error(\"I/O error: {0}\")]\n    Io(#[from] std::io::Error),\n\n    /// Invalid configuration provided to the storage engine.\n    #[error(\"invalid config: {0}\")]\n    InvalidConfig(String),\n}\n\n/// Convenience alias for `std::result::Result\u003cT, Error\u003e`.\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n\n#[cfg(test)]\nmod assertions {\n    use static_assertions::assert_impl_all;\n\n    use super::Error;\n\n    assert_impl_all!(Error: std::error::Error, Send, Sync);\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn segment_full_error_includes_segment_id() {\n        let id = oceanfs_core::SegmentId::new();\n        let err = Error::SegmentFull { segment_id: id, current_size: 1000 };\n        let msg = err.to_string();\n        assert!(msg.contains(\u0026id.to_string()));\n        assert!(msg.contains(\"1000\"));\n    }\n\n    #[test]\n    fn io_error_conversion_works() {\n        let io_err = std::io::Error::new(std::io::ErrorKind::NotFound, \"file missing\");\n        let err: Error = io_err.into();\n        assert!(matches!(err, Error::Io(_)));\n    }\n\n    #[test]\n    fn blob_too_large_reports_both_sizes() {\n        let err = Error::BlobTooLarge { size: 5000000, max: 4194304 };\n        let msg = err.to_string();\n        assert!(msg.contains(\"5000000\"));\n        assert!(msg.contains(\"4194304\"));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","gc.rs"],"content":"//! Garbage collection — tombstone processing and segment compaction.\n\n/// Configuration for garbage collection.\n#[derive(Debug, Clone)]\npub struct GcConfig {\n    /// Interval between GC cycles in seconds.\n    pub interval_sec: u64,\n    /// Tombstone TTL in seconds before reclaimable.\n    pub tombstone_ttl_sec: u64,\n    /// Liveness ratio threshold for compaction (0.0–1.0).\n    pub compact_threshold: f64,\n}\n\nimpl Default for GcConfig {\n    fn default() -\u003e Self {\n        Self { interval_sec: 3600, tombstone_ttl_sec: 259200, compact_threshold: 0.5 }\n    }\n}\n\n/// Statistics from a GC cycle.\n#[derive(Debug, Default, Clone)]\n#[allow(dead_code)]\npub struct GcStats {\n    /// Number of segments scanned.\n    pub segments_scanned: u64,\n    /// Number of segments compacted.\n    pub segments_compacted: u64,\n    /// Bytes reclaimed.\n    pub bytes_reclaimed: u64,\n}\n\n/// Garbage collector for tombstone-based deletion and segment compaction.\npub struct GarbageCollector {\n    config: GcConfig,\n}\n\nimpl GarbageCollector {\n    /// Creates a new garbage collector.\n    pub fn new(config: GcConfig) -\u003e Self {\n        Self { config }\n    }\n\n    /// Returns a reference to the configuration.\n    pub fn config(\u0026self) -\u003e \u0026GcConfig {\n        \u0026self.config\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn default_config_values() {\n        let config = GcConfig::default();\n        assert_eq!(config.interval_sec, 3600);\n        assert_eq!(config.tombstone_ttl_sec, 259200);\n    }\n}\n","traces":[{"line":15,"address":[6859536],"length":1,"stats":{"Line":1}},{"line":39,"address":[6859488],"length":1,"stats":{"Line":0}},{"line":44,"address":[6859520],"length":1,"stats":{"Line":0}}],"covered":1,"coverable":3},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","lib.rs"],"content":"//! Segment storage engine.\n//!\n//! Manages the lifecycle of segments: buffering writes in active segments,\n//! persisting to the WAL, sealing segments when full, encoding via erasure\n//! coding, storing metadata in RocksDB, and distributing shards across\n//! the cluster.\n//!\n//! # Architecture\n//!\n//! The storage engine has four main components:\n//! - **Segment buffer:** in-memory append-only `BytesMut` buffers\n//! - **WAL:** sequential write-ahead log for crash recovery\n//! - **Metadata:** RocksDB-backed object and segment metadata\n//! - **Segment store:** manages sealed segments on disk\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod anti_entropy;\nmod buffer_pool;\nmod error;\nmod gc;\npub mod metadata;\nmod scrub;\npub mod segment;\npub mod wal;\n\npub use anti_entropy::MerkleTree;\npub use buffer_pool::BufferPool;\npub use error::{Error, Result};\npub use gc::{GarbageCollector, GcConfig};\npub use metadata::{BatchOp, MetadataStore};\npub use scrub::ScrubCoordinator;\npub use segment::{\n    ActiveSegment, SealConfig, SegmentHandle, SegmentHeader, SegmentIndex, SegmentSealer,\n    SegmentShard, SegmentSplitter, TierRouter,\n};\npub use wal::{WalEntry, WalReader, WalWriter};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","metadata","cf.rs"],"content":"//! Column family names and key encoding for the metadata store.\n\n/// Column family name for object metadata.\npub(crate) const CF_OBJECTS: \u0026str = \"objects\";\n\n/// Column family name for segment metadata.\npub(crate) const CF_SEGMENTS: \u0026str = \"segments\";\n\n/// Column family name for deletion tombstones.\npub(crate) const CF_DELETIONS: \u0026str = \"deletions\";\n\n/// All column families used by the metadata store.\npub(crate) const ALL_COLUMN_FAMILIES: \u0026[\u0026str] = \u0026[CF_OBJECTS, CF_SEGMENTS, CF_DELETIONS];\n\n/// Encodes a bucket and object key into a RocksDB key.\n///\n/// Format: `{bucket_name}\\0{object_key}`\npub(crate) fn encode_object_key(bucket: \u0026str, key: \u0026str) -\u003e Vec\u003cu8\u003e {\n    let mut buf = Vec::with_capacity(bucket.len() + 1 + key.len());\n    buf.extend_from_slice(bucket.as_bytes());\n    buf.push(0);\n    buf.extend_from_slice(key.as_bytes());\n    buf\n}\n\n/// Decodes a RocksDB key back into bucket and object key components.\n#[allow(dead_code)]\npub(crate) fn decode_object_key(data: \u0026[u8]) -\u003e Option\u003c(\u0026str, \u0026str)\u003e {\n    let null_pos = data.iter().position(|\u0026b| b == 0)?;\n    let bucket = std::str::from_utf8(\u0026data[..null_pos]).ok()?;\n    let key = std::str::from_utf8(\u0026data[null_pos + 1..]).ok()?;\n    Some((bucket, key))\n}\n\n/// Encodes a segment ID into a RocksDB key.\n///\n/// Format: `segment:{uuid_bytes}`\npub(crate) fn encode_segment_key(id: \u0026oceanfs_core::SegmentId) -\u003e Vec\u003cu8\u003e {\n    let mut buf = Vec::with_capacity(24);\n    buf.extend_from_slice(b\"segment:\");\n    buf.extend_from_slice(id.as_uuid().as_bytes());\n    buf\n}\n\n/// Encodes a bucket and object key into a deletion tombstone key.\n#[allow(dead_code)]\npub(crate) fn encode_deletion_key(bucket: \u0026str, key: \u0026str) -\u003e Vec\u003cu8\u003e {\n    // Same format as object keys — deletions are looked up by the same key.\n    encode_object_key(bucket, key)\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn object_key_roundtrip() {\n        let encoded = encode_object_key(\"photos\", \"cat.jpg\");\n        let (bucket, key) = decode_object_key(\u0026encoded).unwrap();\n        assert_eq!(bucket, \"photos\");\n        assert_eq!(key, \"cat.jpg\");\n    }\n\n    #[test]\n    fn object_key_handles_empty_parts() {\n        let encoded = encode_object_key(\"\", \"\");\n        let (bucket, key) = decode_object_key(\u0026encoded).unwrap();\n        assert_eq!(bucket, \"\");\n        assert_eq!(key, \"\");\n    }\n\n    #[test]\n    fn segment_key_is_unique_per_id() {\n        let id1 = oceanfs_core::SegmentId::new();\n        let id2 = oceanfs_core::SegmentId::new();\n        assert_ne!(encode_segment_key(\u0026id1), encode_segment_key(\u0026id2));\n    }\n}\n","traces":[{"line":18,"address":[7039526,7039120,7039520],"length":1,"stats":{"Line":2}},{"line":19,"address":[7039327,7039202],"length":1,"stats":{"Line":3}},{"line":20,"address":[7967407,7967326],"length":1,"stats":{"Line":6}},{"line":21,"address":[7112495],"length":1,"stats":{"Line":3}},{"line":22,"address":[8019643],"length":1,"stats":{"Line":3}},{"line":23,"address":[7046574],"length":1,"stats":{"Line":3}},{"line":28,"address":[8018704],"length":1,"stats":{"Line":1}},{"line":29,"address":[8018763],"length":1,"stats":{"Line":3}},{"line":30,"address":[7966675],"length":1,"stats":{"Line":1}},{"line":31,"address":[8019012],"length":1,"stats":{"Line":1}},{"line":32,"address":[7967030],"length":1,"stats":{"Line":1}},{"line":38,"address":[7967779,7967568,7967785],"length":1,"stats":{"Line":2}},{"line":39,"address":[8019784],"length":1,"stats":{"Line":2}},{"line":40,"address":[7039605],"length":1,"stats":{"Line":2}},{"line":41,"address":[7967681],"length":1,"stats":{"Line":2}},{"line":42,"address":[7112820],"length":1,"stats":{"Line":2}},{"line":47,"address":[7039792],"length":1,"stats":{"Line":0}},{"line":49,"address":[7039823],"length":1,"stats":{"Line":0}}],"covered":16,"coverable":18},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","metadata","mod.rs"],"content":"//! RocksDB-backed metadata persistence.\n//!\n//! Stores object metadata, segment metadata, and deletion tombstones\n//! in three RocksDB column families. Provides strongly-typed CRUD\n//! operations with batch atomic writes and prefix-range scans.\n\nmod cf;\nmod store;\n\npub use store::{BatchOp, MetadataStore};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","metadata","store.rs"],"content":"//! RocksDB-backed metadata store with strongly-typed CRUD.\n\nuse std::sync::Arc;\n\nuse oceanfs_core::{\n    BucketId, MetadataConfig, ObjectKey, ObjectMetadata, SegmentId, SegmentMetadata, Tombstone,\n};\nuse rocksdb::{ColumnFamilyDescriptor, Options, DB};\n\nuse crate::{\n    error::{Error, Result},\n    metadata::cf,\n};\n\n/// A RocksDB-backed metadata store with three column families.\n///\n/// Manages object metadata (`objects` CF), segment metadata (`segments` CF),\n/// and deletion tombstones (`deletions` CF).\n///\n/// # Examples\n///\n/// ```ignore\n/// // Requires a running RocksDB instance; examples are in unit tests.\n/// use oceanfs_core::{MetadataConfig, ObjectKey, BucketId, Hlc};\n/// use oceanfs_storage::MetadataStore;\n/// let config = MetadataConfig::default();\n/// let store = MetadataStore::open(\u0026config).unwrap();\n/// ```\npub struct MetadataStore {\n    db: Arc\u003cDB\u003e,\n}\n\nfn io_err(e: impl std::error::Error) -\u003e std::io::Error {\n    std::io::Error::other(e.to_string())\n}\n\nimpl MetadataStore {\n    /// Opens or creates a metadata store at the given data directory.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if RocksDB cannot open the database or create\n    /// the required column families.\n    ///\n    /// # Panics\n    ///\n    /// Panics if a column family handle is missing after creation\n    /// (indicates a programming error).\n    pub fn open(config: \u0026MetadataConfig) -\u003e Result\u003cSelf\u003e {\n        std::fs::create_dir_all(\u0026config.data_dir)?;\n\n        let mut opts = Options::default();\n        opts.create_if_missing(true);\n        opts.create_missing_column_families(true);\n        opts.set_compression_type(rocksdb::DBCompressionType::Zstd);\n        opts.increase_parallelism(num_cpus::get() as i32);\n        opts.optimize_level_style_compaction(config.memtable_size);\n\n        // Configure block cache.\n        let block_cache =\n            rocksdb::Cache::new_lru_cache(config.block_cache_size);\n        let mut block_opts = rocksdb::BlockBasedOptions::default();\n        block_opts.set_block_cache(\u0026block_cache);\n\n        let cf_descriptors: Vec\u003cColumnFamilyDescriptor\u003e = cf::ALL_COLUMN_FAMILIES\n            .iter()\n            .map(|\u0026name| {\n                let mut cf_opts = Options::default();\n                cf_opts.set_compression_type(rocksdb::DBCompressionType::Zstd);\n                cf_opts.set_block_based_table_factory(\u0026block_opts);\n                ColumnFamilyDescriptor::new(name, cf_opts)\n            })\n            .collect();\n\n        let db = DB::open_cf_descriptors(\u0026opts, \u0026config.data_dir, cf_descriptors)\n            .map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(Self { db: Arc::new(db) })\n    }\n\n    // ------------------------------------------------------------------\n    // Object operations\n    // ------------------------------------------------------------------\n\n    /// Stores object metadata.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the underlying RocksDB write fails.\n    pub fn put_object(\u0026self, meta: ObjectMetadata) -\u003e Result\u003c()\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_OBJECTS)\n            .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n\n        let key = cf::encode_object_key(\"default\", meta.object_key.as_str());\n        let value = serde_json::to_vec(\u0026meta).map_err(|e| Error::Io(io_err(e)))?;\n\n        self.db.put_cf(\u0026cf, key, value).map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(())\n    }\n\n    /// Retrieves object metadata.\n    ///\n    /// Returns `None` if the object does not exist.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB read or deserialization fails.\n    pub fn get_object(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e Result\u003cOption\u003cObjectMetadata\u003e\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_OBJECTS)\n            .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n\n        let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n\n        match self.db.get_cf(\u0026cf, db_key) {\n            Ok(Some(value)) =\u003e {\n                let meta: ObjectMetadata =\n                    serde_json::from_slice(\u0026value).map_err(|e| Error::Io(io_err(e)))?;\n                Ok(Some(meta))\n            }\n            Ok(None) =\u003e Ok(None),\n            Err(e) =\u003e Err(Error::Io(io_err(e))),\n        }\n    }\n\n    /// Deletes object metadata.\n    ///\n    /// This is a soft delete — the data remains in segments until GC.\n    /// Use [`Self::put_tombstone`] to record the deletion for GC.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB delete fails.\n    pub fn delete_object(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e Result\u003c()\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_OBJECTS)\n            .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n\n        let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n\n        self.db.delete_cf(\u0026cf, db_key).map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(())\n    }\n\n    /// Lists objects whose keys start with the given prefix.\n    ///\n    /// Results are in key order. Suitable for S3 `LIST` operations.\n    ///\n    /// # Errors\n    ///\n    /// Individual entries that fail to deserialize are skipped.\n    pub fn list_objects(\u0026self, bucket: \u0026BucketId, prefix: \u0026str) -\u003e Vec\u003cResult\u003cObjectMetadata\u003e\u003e {\n        let cf = self.db.cf_handle(cf::CF_OBJECTS);\n        let Some(cf_handle) = cf else {\n            return vec![];\n        };\n        let prefix_key = cf::encode_object_key(bucket.as_str(), prefix);\n\n        let iter = self.db.iterator_cf(\n            \u0026cf_handle,\n            rocksdb::IteratorMode::From(\u0026prefix_key, rocksdb::Direction::Forward),\n        );\n\n        iter.take_while(\n            move |item| {\n                if let Ok((key, _)) = item {\n                    key.starts_with(\u0026prefix_key)\n                } else {\n                    false\n                }\n            },\n        )\n        .filter_map(|item| match item {\n            Ok((_key, value)) =\u003e match serde_json::from_slice::\u003cObjectMetadata\u003e(\u0026value) {\n                Ok(meta) =\u003e Some(Ok(meta)),\n                Err(_) =\u003e None,\n            },\n            Err(e) =\u003e Some(Err(Error::Io(io_err(e)))),\n        })\n        .collect()\n    }\n\n    // ------------------------------------------------------------------\n    // Segment operations\n    // ------------------------------------------------------------------\n\n    /// Stores segment metadata.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB write fails.\n    pub fn put_segment(\u0026self, meta: SegmentMetadata) -\u003e Result\u003c()\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_SEGMENTS)\n            .ok_or_else(|| Error::InvalidConfig(\"segments CF not found\".into()))?;\n\n        let key = cf::encode_segment_key(\u0026meta.segment_id);\n        let value = serde_json::to_vec(\u0026meta).map_err(|e| Error::Io(io_err(e)))?;\n\n        self.db.put_cf(\u0026cf, key, value).map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(())\n    }\n\n    /// Retrieves segment metadata.\n    ///\n    /// Returns `None` if the segment does not exist.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB read or deserialization fails.\n    pub fn get_segment(\u0026self, id: SegmentId) -\u003e Result\u003cOption\u003cSegmentMetadata\u003e\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_SEGMENTS)\n            .ok_or_else(|| Error::InvalidConfig(\"segments CF not found\".into()))?;\n\n        let key = cf::encode_segment_key(\u0026id);\n\n        match self.db.get_cf(\u0026cf, key) {\n            Ok(Some(value)) =\u003e {\n                let meta: SegmentMetadata =\n                    serde_json::from_slice(\u0026value).map_err(|e| Error::Io(io_err(e)))?;\n                Ok(Some(meta))\n            }\n            Ok(None) =\u003e Ok(None),\n            Err(e) =\u003e Err(Error::Io(io_err(e))),\n        }\n    }\n\n    /// Lists all segment metadata entries.\n    ///\n    /// # Errors\n    ///\n    /// Individual entries that fail to deserialize are skipped.\n    pub fn list_segments(\u0026self) -\u003e Vec\u003cResult\u003cSegmentMetadata\u003e\u003e {\n        let cf = self.db.cf_handle(cf::CF_SEGMENTS);\n        let Some(cf_handle) = cf else {\n            return vec![];\n        };\n\n        let iter = self.db.iterator_cf(\u0026cf_handle, rocksdb::IteratorMode::Start);\n\n        iter.filter_map(|item| match item {\n            Ok((_key, value)) =\u003e match serde_json::from_slice::\u003cSegmentMetadata\u003e(\u0026value) {\n                Ok(meta) =\u003e Some(Ok(meta)),\n                Err(_) =\u003e None,\n            },\n            Err(e) =\u003e Some(Err(Error::Io(io_err(e)))),\n        })\n        .collect()\n    }\n\n    // ------------------------------------------------------------------\n    // Tombstone operations\n    // ------------------------------------------------------------------\n\n    /// Records a deletion tombstone.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB write fails.\n    pub fn put_tombstone(\n        \u0026self,\n        bucket: \u0026BucketId,\n        key: \u0026ObjectKey,\n        tombstone: Tombstone,\n    ) -\u003e Result\u003c()\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_DELETIONS)\n            .ok_or_else(|| Error::InvalidConfig(\"deletions CF not found\".into()))?;\n\n        let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n        let value = serde_json::to_vec(\u0026tombstone).map_err(|e| Error::Io(io_err(e)))?;\n\n        self.db.put_cf(\u0026cf, db_key, value).map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(())\n    }\n\n    /// Checks if a deletion tombstone exists.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB read fails.\n    pub fn has_tombstone(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e Result\u003cbool\u003e {\n        let cf = self\n            .db\n            .cf_handle(cf::CF_DELETIONS)\n            .ok_or_else(|| Error::InvalidConfig(\"deletions CF not found\".into()))?;\n\n        let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n\n        match self.db.get_cf(\u0026cf, db_key) {\n            Ok(Some(_)) =\u003e Ok(true),\n            Ok(None) =\u003e Ok(false),\n            Err(e) =\u003e Err(Error::Io(io_err(e))),\n        }\n    }\n\n    // ------------------------------------------------------------------\n    // Async wrappers\n    // ------------------------------------------------------------------\n\n    /// Async version of [`Self::put_object`].\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB write fails or the blocking\n    /// task panics.\n    pub async fn put_object_async(\u0026self, meta: ObjectMetadata) -\u003e Result\u003c()\u003e {\n        let db = self.db.clone();\n        tokio::task::spawn_blocking(move || {\n            let cf = db\n                .cf_handle(cf::CF_OBJECTS)\n                .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n            let key = cf::encode_object_key(\"default\", meta.object_key.as_str());\n            let value = serde_json::to_vec(\u0026meta).map_err(|e| Error::Io(io_err(e)))?;\n            db.put_cf(\u0026cf, key, value).map_err(|e| Error::Io(io_err(e)))?;\n            Ok(())\n        })\n        .await\n        .map_err(|e| Error::Io(std::io::Error::other(e.to_string())))?\n    }\n\n    /// Async version of [`Self::get_object`].\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB read fails or the blocking\n    /// task panics.\n    pub async fn get_object_async(\n        \u0026self,\n        bucket: BucketId,\n        key: ObjectKey,\n    ) -\u003e Result\u003cOption\u003cObjectMetadata\u003e\u003e {\n        let db = self.db.clone();\n        tokio::task::spawn_blocking(move || {\n            let cf = db\n                .cf_handle(cf::CF_OBJECTS)\n                .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n            let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n            match db.get_cf(\u0026cf, db_key) {\n                Ok(Some(value)) =\u003e {\n                    let meta: ObjectMetadata =\n                        serde_json::from_slice(\u0026value).map_err(|e| Error::Io(io_err(e)))?;\n                    Ok(Some(meta))\n                }\n                Ok(None) =\u003e Ok(None),\n                Err(e) =\u003e Err(Error::Io(io_err(e))),\n            }\n        })\n        .await\n        .map_err(|e| Error::Io(std::io::Error::other(e.to_string())))?\n    }\n\n    /// Async version of [`Self::delete_object`].\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB delete fails or the blocking\n    /// task panics.\n    pub async fn delete_object_async(\u0026self, bucket: BucketId, key: ObjectKey) -\u003e Result\u003c()\u003e {\n        let db = self.db.clone();\n        tokio::task::spawn_blocking(move || {\n            let cf = db\n                .cf_handle(cf::CF_OBJECTS)\n                .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n            let db_key = cf::encode_object_key(bucket.as_str(), key.as_str());\n            db.delete_cf(\u0026cf, db_key).map_err(|e| Error::Io(io_err(e)))?;\n            Ok(())\n        })\n        .await\n        .map_err(|e| Error::Io(std::io::Error::other(e.to_string())))?\n    }\n\n    // ------------------------------------------------------------------\n    // Batch operations\n    // ------------------------------------------------------------------\n\n    /// Atomically writes a batch of metadata operations.\n    ///\n    /// All put/delete operations in the batch succeed or fail together.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the RocksDB write batch fails.\n    pub fn batch_write(\u0026self, ops: Vec\u003cBatchOp\u003e) -\u003e Result\u003c()\u003e {\n        let mut batch = rocksdb::WriteBatch::default();\n\n        for op in \u0026ops {\n            match op {\n                BatchOp::PutObject(key, value) =\u003e {\n                    let cf = self\n                        .db\n                        .cf_handle(cf::CF_OBJECTS)\n                        .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n                    let k = cf::encode_object_key(\"default\", key.as_str());\n                    let v = serde_json::to_vec(value).map_err(|e| Error::Io(io_err(e)))?;\n                    batch.put_cf(\u0026cf, k, v);\n                }\n                BatchOp::DeleteObject(bucket, key) =\u003e {\n                    let cf = self\n                        .db\n                        .cf_handle(cf::CF_OBJECTS)\n                        .ok_or_else(|| Error::InvalidConfig(\"objects CF not found\".into()))?;\n                    let k = cf::encode_object_key(bucket.as_str(), key.as_str());\n                    batch.delete_cf(\u0026cf, k);\n                }\n                BatchOp::PutTombstone(bucket, key, tombstone) =\u003e {\n                    let cf = self\n                        .db\n                        .cf_handle(cf::CF_DELETIONS)\n                        .ok_or_else(|| Error::InvalidConfig(\"deletions CF not found\".into()))?;\n                    let k = cf::encode_object_key(bucket.as_str(), key.as_str());\n                    let v = serde_json::to_vec(tombstone).map_err(|e| Error::Io(io_err(e)))?;\n                    batch.put_cf(\u0026cf, k, v);\n                }\n                BatchOp::PutSegment(meta) =\u003e {\n                    let cf = self\n                        .db\n                        .cf_handle(cf::CF_SEGMENTS)\n                        .ok_or_else(|| Error::InvalidConfig(\"segments CF not found\".into()))?;\n                    let k = cf::encode_segment_key(\u0026meta.segment_id);\n                    let v = serde_json::to_vec(meta).map_err(|e| Error::Io(io_err(e)))?;\n                    batch.put_cf(\u0026cf, k, v);\n                }\n            }\n        }\n\n        self.db.write(batch).map_err(|e| Error::Io(io_err(e)))?;\n\n        Ok(())\n    }\n}\n\n/// An operation in a batch write.\n#[derive(Debug, Clone)]\npub enum BatchOp {\n    /// Put an object metadata entry.\n    PutObject(ObjectKey, ObjectMetadata),\n    /// Delete an object.\n    DeleteObject(BucketId, ObjectKey),\n    /// Put a tombstone.\n    PutTombstone(BucketId, ObjectKey, Tombstone),\n    /// Put a segment metadata entry.\n    PutSegment(SegmentMetadata),\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::{HashOutput, Hlc, SizeTier};\n\n    use super::*;\n\n    fn test_config() -\u003e MetadataConfig {\n        let dir = tempfile::tempdir().unwrap();\n        MetadataConfig {\n            data_dir: dir.path().to_path_buf(),\n            block_cache_size: 8 * 1024 * 1024,\n            memtable_size: 8 * 1024 * 1024,\n        }\n    }\n\n    fn make_object_meta(key: \u0026str, size: u64, inline: Option\u003c\u0026[u8]\u003e) -\u003e ObjectMetadata {\n        ObjectMetadata {\n            object_key: ObjectKey::new(key),\n            size,\n            blake3_hash: Some(HashOutput::from_bytes([0u8; 32])),\n            chunks: smallvec::SmallVec::new(),\n            inline_data: inline.map(bytes::Bytes::copy_from_slice),\n            created_at: 1700000000000,\n            hlc: Hlc::new(1700000000000, 0),\n        }\n    }\n\n    #[test]\n    fn put_and_get_object_roundtrip() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        let meta = make_object_meta(\"photo.jpg\", 1024, Some(b\"inline-data\"));\n        store.put_object(meta.clone()).unwrap();\n\n        let got = store\n            .get_object(\u0026BucketId::new(\"default\"), \u0026ObjectKey::new(\"photo.jpg\"))\n            .unwrap()\n            .unwrap();\n        assert_eq!(got.object_key.as_str(), \"photo.jpg\");\n        assert_eq!(got.size, 1024);\n        assert!(got.is_inline());\n    }\n\n    #[test]\n    fn get_nonexistent_object_returns_none() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        let result = store.get_object(\u0026BucketId::new(\"default\"), \u0026ObjectKey::new(\"nope\")).unwrap();\n        assert!(result.is_none());\n    }\n\n    #[test]\n    fn delete_object_removes_it() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        let meta = make_object_meta(\"temp.txt\", 100, None);\n        store.put_object(meta).unwrap();\n        store.delete_object(\u0026BucketId::new(\"default\"), \u0026ObjectKey::new(\"temp.txt\")).unwrap();\n\n        let result =\n            store.get_object(\u0026BucketId::new(\"default\"), \u0026ObjectKey::new(\"temp.txt\")).unwrap();\n        assert!(result.is_none());\n    }\n\n    #[test]\n    fn list_objects_by_prefix() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n\n        for name in \u0026[\"a/1.txt\", \"a/2.txt\", \"b/3.txt\"] {\n            store.put_object(make_object_meta(name, 10, None)).unwrap();\n        }\n\n        let results = store.list_objects(\u0026BucketId::new(\"default\"), \"a/\");\n        let results: Vec\u003c_\u003e = results.into_iter().collect::\u003cResult\u003cVec\u003c_\u003e\u003e\u003e().unwrap();\n        assert_eq!(results.len(), 2);\n    }\n\n    #[test]\n    fn put_and_get_segment_roundtrip() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        let meta = SegmentMetadata {\n            segment_id: SegmentId::new(),\n            ec_k: 4,\n            ec_m: 2,\n            size_tier: SizeTier::Standard,\n            merkle_root: None,\n            storage_locations: smallvec::SmallVec::new(),\n            sealed_at: Some(1700000000000),\n        };\n        store.put_segment(meta.clone()).unwrap();\n\n        let got = store.get_segment(meta.segment_id).unwrap().unwrap();\n        assert_eq!(got.ec_k, 4);\n        assert_eq!(got.ec_m, 2);\n        assert!(got.is_sealed());\n    }\n\n    #[test]\n    fn tombstone_roundtrip() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        let bucket = BucketId::new(\"default\");\n        let key = ObjectKey::new(\"deleted.txt\");\n\n        store\n            .put_tombstone(\n                \u0026bucket,\n                \u0026key,\n                Tombstone { deletion_time: 1700000000000, hlc: Hlc::new(1700000000000, 1) },\n            )\n            .unwrap();\n\n        assert!(store.has_tombstone(\u0026bucket, \u0026key).unwrap());\n    }\n\n    #[test]\n    fn no_tombstone_for_nonexistent_key() {\n        let store = MetadataStore::open(\u0026test_config()).unwrap();\n        assert!(!store.has_tombstone(\u0026BucketId::new(\"default\"), \u0026ObjectKey::new(\"nope\")).unwrap());\n    }\n}\n","traces":[{"line":33,"address":[7222416,7222516,7222652,7222646,7222544],"length":1,"stats":{"Line":0}},{"line":34,"address":[6947361,6947405,6947519,6947475],"length":1,"stats":{"Line":0}},{"line":49,"address":[7963856,7965203,7965138],"length":1,"stats":{"Line":5}},{"line":50,"address":[7042966],"length":1,"stats":{"Line":7}},{"line":52,"address":[8016178],"length":1,"stats":{"Line":7}},{"line":53,"address":[6819224],"length":1,"stats":{"Lin     \u0026self.config\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn default_scrub_interval_is_7_days() {\n        let config = ScrubConfig::default();\n        assert_eq!(config.interval_sec, 604800);\n    }\n}\n","traces":[{"line":15,"address":[6805392],"length":1,"stats":{"Line":1}},{"line":45,"address":[6805344],"length":1,"stats":{"Line":0}},{"line":50,"address":[6805376],"length":1,"stats":{"Line":0}}],"covered":1,"coverable":3},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","segment","buffer.rs"],"content":"//! Active segment — in-memory append-only buffer.\n//!\n//! An `ActiveSegment` accumulates blob writes in a `BytesMut` buffer.\n//! When the buffer reaches its target size, the segment is sealed and\n//! a new active segment takes its place.\n\nuse bytes::BytesMut;\nuse oceanfs_core::{SegmentId, SegmentSizeConfig, SizeTier};\n\nuse crate::{\n    buffer_pool::BufferPool,\n    error::{Error, Result},\n};\n\n/// An in-memory segment buffer accepting append operations.\n///\n/// Backed by a `BytesMut` from the buffer pool. Tracks the current\n/// write cursor and whether the segment has reached its target size.\n///\n/// # Examples\n///\n/// ```ignore\n/// // ActiveSegment is pub(crate); examples are in unit tests.\n/// use oceanfs_core::{SegmentSizeConfig, SizeTier};\n/// use oceanfs_storage::segment::buffer::ActiveSegment;\n/// use oceanfs_storage::BufferPool;\n///\n/// let pool = BufferPool::new(65536, 4);\n/// let config = SegmentSizeConfig::default();\n/// let mut seg = ActiveSegment::new(SizeTier::Small, \u0026config, \u0026pool).unwrap();\n///\n/// let (offset, length) = seg.append(b\"hello\").unwrap();\n/// assert_eq!(offset, 0);\n/// assert_eq!(length, 5);\n/// ```\n#[allow(dead_code)]\npub struct ActiveSegment {\n    /// Unique identifier for this segment.\n    id: SegmentId,\n    /// The storage tier this segment belongs to.\n    tier: SizeTier,\n    /// Accumulated blob data.\n    buffer: BytesMut,\n    /// Current write position in the buffer.\n    cursor: u64,\n    /// Target size in bytes — segment is considered full when `cursor \u003e= target`.\n    target_size: u64,\n}\n\n#[allow(dead_code)]\nimpl ActiveSegment {\n    /// Creates a new active segment for the given tier.\n    ///\n    /// The segment acquires its backing buffer from `pool` and is\n    /// initialized with the appropriate target size for its tier.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`Error::InvalidConfig`] if the tier is `Inline`.\n    /// Returns an error if the buffer pool has no free buffers.\n    pub fn new(tier: SizeTier, config: \u0026SegmentSizeConfig, pool: \u0026BufferPool) -\u003e Result\u003cSelf\u003e {\n        let target_size = match tier {\n            SizeTier::Small =\u003e config.small_target_size,\n            SizeTier::Standard =\u003e config.default_target_size,\n            SizeTier::Multi =\u003e config.default_target_size,\n            // Inline tier does not use active segments.\n            SizeTier::Inline =\u003e {\n                return Err(Error::InvalidConfig(\n                    \"Inline tier does not use active segments\".into(),\n                ));\n            }\n            // non_exhaustive: future tiers fall through to default.\n            _ =\u003e {\n                return Err(Error::InvalidConfig(format!(\n                    \"unsupported tier for active segment: {tier:?}\"\n                )));\n            }\n        };\n\n        let buffer = pool.acquire()?;\n        // Ensure the buffer has sufficient capacity. BytesMut will\n        // grow automatically, but pre-reserving avoids reallocation.\n        let mut buffer = buffer;\n        buffer.reserve(target_size as usize);\n\n        Ok(Self { id: SegmentId::new(), tier, buffer, cursor: 0, target_size })\n    }\n\n    /// Appends data to the segment buffer.\n    ///\n    /// Returns `(offset, length)` indicating where the data was placed\n    /// within the segment.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`Error::SegmentFull`] if the segment has reached its\n    /// target size and cannot accept more data.\n    ///\n    /// # Examples\n    ///\n    /// ```ignore\n    /// // ActiveSegment is pub(crate); examples are in unit tests.\n    /// # use oceanfs_core::{SegmentSizeConfig, SizeTier};\n    /// # use oceanfs_storage::segment::buffer::ActiveSegment;\n    /// # use oceanfs_storage::BufferPool;\n    /// # let pool = BufferPool::new(65536, 4);\n    /// # let config = SegmentSizeConfig::default();\n    /// let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n    ///\n    /// let (off1, len1) = seg.append(b\"abc\").unwrap();\n    /// let (off2, len2) = seg.append(b\"def\").unwrap();\n    /// assert_eq!(off1, 0);\n    /// assert_eq!(off2, 3); // starts after first blob\n    /// ```\n    pub fn append(\u0026mut self, data: \u0026[u8]) -\u003e Result\u003c(u64, usize)\u003e {\n        if self.is_full() {\n            return Err(Error::SegmentFull { segment_id: self.id, current_size: self.cursor });\n        }\n\n        let offset = self.cursor;\n        let length = data.len();\n\n        self.buffer.extend_from_slice(data);\n        self.cursor += length as u64;\n\n        Ok((offset, length))\n    }\n\n    /// Returns `true` if the segment has reached or exceeded its target size.\n    pub fn is_full(\u0026self) -\u003e bool {\n        self.cursor \u003e= self.target_size\n    }\n\n    /// Returns the segment's unique identifier.\n    pub fn id(\u0026self) -\u003e SegmentId {\n        self.id\n    }\n\n    /// Returns the storage tier of this segment.\n    pub fn tier(\u0026self) -\u003e SizeTier {\n        self.tier\n    }\n\n    /// Returns the current size of the segment in bytes.\n    pub fn size(\u0026self) -\u003e u64 {\n        self.cursor\n    }\n\n    /// Returns the target size of the segment in bytes.\n    pub fn target_size(\u0026self) -\u003e u64 {\n        self.target_size\n    }\n\n    /// Returns a reference to the accumulated data.\n    pub fn data(\u0026self) -\u003e \u0026[u8] {\n        \u0026self.buffer\n    }\n\n    /// Consumes the segment, returning the backing buffer for pool reuse.\n    pub fn into_buffer(self) -\u003e BytesMut {\n        self.buffer\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    fn make_pool() -\u003e BufferPool {\n        BufferPool::new(65536, 4)\n    }\n\n    fn config() -\u003e SegmentSizeConfig {\n        SegmentSizeConfig::default()\n    }\n\n    #[test]\n    fn new_segment_starts_empty() {\n        let pool = make_pool();\n        let seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        assert_eq!(seg.size(), 0);\n        assert!(!seg.is_full());\n    }\n\n    #[test]\n    fn append_increments_cursor() {\n        let pool = make_pool();\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        let (off, len) = seg.append(\u0026[0u8; 100]).unwrap();\n        assert_eq!(off, 0);\n        assert_eq!(len, 100);\n        assert_eq!(seg.size(), 100);\n    }\n\n    #[test]\n    fn append_returns_sequential_offsets() {\n        let pool = make_pool();\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        let (off1, _) = seg.append(b\"aaa\").unwrap();\n        let (off2, _) = seg.append(b\"bbb\").unwrap();\n        let (off3, _) = seg.append(b\"ccc\").unwrap();\n        assert_eq!(off1, 0);\n        assert_eq!(off2, 3);\n        assert_eq!(off3, 6);\n    }\n\n    #[test]\n    fn is_full_when_cursor_exceeds_target() {\n        // Use a tiny config so we can easily fill it\n        let config = SegmentSizeConfig { default_target_size: 10, ..config() };\n        let pool = BufferPool::new(1024, 2);\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n        assert!(!seg.is_full());\n        seg.append(\u0026[0u8; 10]).unwrap();\n        assert!(seg.is_full());\n    }\n\n    #[test]\n    fn is_full_when_cursor_exceeds_target_by_more() {\n        let config = SegmentSizeConfig { default_target_size: 10, ..config() };\n        let pool = BufferPool::new(1024, 2);\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n        seg.append(\u0026[0u8; 15]).unwrap();\n        assert!(seg.is_full());\n    }\n\n    #[test]\n    fn append_on_full_segment_returns_error() {\n        let config = SegmentSizeConfig { default_target_size: 5, ..config() };\n        let pool = BufferPool::new(1024, 2);\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n        seg.append(\u0026[0u8; 5]).unwrap();\n        let result = seg.append(b\"x\");\n        assert!(result.is_err());\n        assert!(matches!(result.unwrap_err(), Error::SegmentFull { .. }));\n    }\n\n    #[test]\n    fn small_tier_uses_small_target() {\n        let config =\n            SegmentSizeConfig { small_target_size: 100, default_target_size: 1000, ..config() };\n        let pool = BufferPool::new(65536, 4);\n        let seg = ActiveSegment::new(SizeTier::Small, \u0026config, \u0026pool).unwrap();\n        assert_eq!(seg.target_size(), 100);\n    }\n\n    #[test]\n    fn standard_tier_uses_default_target() {\n        let config = SegmentSizeConfig { default_target_size: 2000, ..config() };\n        let pool = BufferPool::new(65536, 4);\n        let seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n        assert_eq!(seg.target_size(), 2000);\n    }\n\n    #[test]\n    fn inline_tier_rejected() {\n        let pool = BufferPool::new(65536, 4);\n        let result = ActiveSegment::new(SizeTier::Inline, \u0026config(), \u0026pool);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn data_returns_appended_bytes() {\n        let pool = BufferPool::new(65536, 4);\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        seg.append(b\"hello\").unwrap();\n        seg.append(b\" world\").unwrap();\n        assert_eq!(seg.data(), b\"hello world\");\n    }\n\n    #[test]\n    fn into_buffer_returns_buffer() {\n        let pool = BufferPool::new(65536, 4);\n        let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        seg.append(b\"data\").unwrap();\n        let buf = seg.into_buffer();\n        assert_eq!(\u0026buf[..], b\"data\");\n    }\n\n    #[test]\n    fn id_is_unique_per_segment() {\n        let pool = BufferPool::new(65536, 4);\n        let seg1 = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        let seg2 = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n        assert_ne!(seg1.id(), seg2.id());\n    }\n}\n","traces":[{"line":61,"address":[8093857,8093841,8092928],"length":1,"stats":{"Line":2}},{"line":62,"address":[7112776],"length":1,"stats":{"Line":2}},{"line":63,"address":[7112931],"length":1,"stats":{"Line":2}},{"line":64,"address":[7112947],"length":1,"stats":{"Line":2}},{"line":65,"address":[8040979],"length":1,"stats":{"Line":0}},{"line":68,"address":[8093058],"length":1,"stats":{"Line":1}},{"line":69,"address":[7112815],"length":1,"stats":{"Line":1}},{"line":80,"address":[8093420,8093021,8093199],"length":1,"stats":{"Line":4}},{"line":83,"address":[6960302],"length":1,"stats":{"Line":2}},{"line":84,"address":[8041334],"length":1,"stats":{"Line":2}},{"line":86,"address":[8093590],"length":1,"stats":{"Line":2}},{"line":115,"address":[7113728],"length":1,"stats":{"Line":2}},{"line":116,"address":[7120874],"length":1,"stats":{"Line":3}},{"line":117,"address":[7113887],"length":1,"stats":{"Line":2}},{"line":120,"address":[7113811],"length":1,"stats":{"Line":3}},{"line":121,"address":[7113828],"length": offset: u64,\n        checksum: [u8; 32],\n    ) -\u003e Self {\n        Self {\n            magic: SEGMENT_MAGIC,\n            version: SEGMENT_VERSION,\n            segment_id,\n            size,\n            blob_count,\n            index_offset,\n            checksum,\n        }\n    }\n\n    /// Serializes the header to bytes.\n    pub fn to_bytes(\u0026self) -\u003e Vec\u003cu8\u003e {\n        let mut buf = vec![0u8; 76];\n        buf[0..4].copy_from_slice(\u0026self.magic);\n        buf[4..6].copy_from_slice(\u0026self.version.to_le_bytes());\n        buf[6..22].copy_from_slice(self.segment_id.as_uuid().as_bytes());\n        buf[22..30].copy_from_slice(\u0026self.size.to_le_bytes());\n        buf[30..34].copy_from_slice(\u0026self.blob_count.to_le_bytes());\n        buf[34..42].copy_from_slice(\u0026self.index_offset.to_le_bytes());\n        buf[42..74].copy_from_slice(\u0026self.checksum);\n        buf[74..76].fill(0); // padding\n        buf\n    }\n\n    /// Deserializes a segment header from bytes.\n    ///\n    /// Returns `None` if the magic bytes don't match.\n    pub fn from_bytes(data: \u0026[u8]) -\u003e Option\u003cSelf\u003e {\n        if data.len() \u003c 76 {\n            return None;\n        }\n        let magic: [u8; 4] = data[0..4].try_into().ok()?;\n        if magic != SEGMENT_MAGIC {\n            return None;\n        }\n        let version = u16::from_le_bytes(data[4..6].try_into().ok()?);\n        let segment_id_bytes: [u8; 16] = data[6..22].try_into().ok()?;\n        let segment_id = SegmentId::from_uuid_bytes(segment_id_bytes);\n        let size = u64::from_le_bytes(data[22..30].try_into().ok()?);\n        let blob_count = u32::from_le_bytes(data[30..34].try_into().ok()?);\n        let index_offset = u64::from_le_bytes(data[34..42].try_into().ok()?);\n        let checksum: [u8; 32] = data[42..74].try_into().ok()?;\n\n        Some(Self { magic, version, segment_id, size, blob_count, index_offset, checksum })\n    }\n\n    /// Size of a tries: BTreeMap\u003cu64, SegmentIndexEntry\u003e,\n}\n\nimpl SegmentIndex {\n    /// Creates a new segment index from a list of entries.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if entries have overlapping or invalid offsets.\n    pub fn new(entries: Vec\u003cSegmentIndexEntry\u003e) -\u003e Result\u003cSelf\u003e {\n        let mut map = BTreeMap::new();\n        for entry in entries {\n            if map.contains_key(\u0026entry.offset) {\n                return Err(Error::InvalidConfig(format!(\n                    \"duplicate offset {} in segment index\",\n                    entry.offset\n                )));\n            }\n            map.insert(entry.offset, entry);\n        }\n        Ok(Self { entries: map })\n    }\n\n    /// Looks up an index entry by exact offset.\n    ///\n    /// Returns `None` if no blob starts at the given offset.\n    pub fn lookup(\u0026self, offset: u64) -\u003e Option\u003c\u0026SegmentIndexEntry\u003e {\n        self.entries.get(\u0026offset)\n    }\n\n    /// Returns the number of blobs indexed.\n    pub fn len(\u0026self) -\u003e usize {\n        self.entries.len()\n    }\n\n    /// Returns `true` if the index is empty.\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.entries.is_empty()\n    }\n\n    /// Serializes the index to bytes (JSON for simplicity; replace with\n    /// a compact binary format in production).\n    pub fn to_bytes(\u0026self) -\u003e Vec\u003cu8\u003e {\n        let entries: Vec\u003c\u0026SegmentIndexEntry\u003e = self.entries.values().collect();\n        serde_json::to_vec(\u0026entries).unwrap_or_default()\n    }\n\n    /// Deserializes an index from bytes.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the data is not valid JSON or contains\n    /// entries with duplicate offsets.\n    pub fn from_bytes(data: \u0026[u8]) -\u003e Result\u003cSelf\u003e {\n        let entries: Vec\u003cSegmentIndexEntry\u003e = serde_json::from_slice(data)\n            .map_err(|e| Error::Io(std::io::Error::other(e.to_string())))?;\n        Self::new(entries)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    fn entry(offset: u64, length: u32) -\u003e SegmentIndexEntry {\n        SegmentIndexEntry { offset, length, blob_key_hash: [0u8; 32] }\n    }\n\n    #[test]\n    fn lookup_returns_entry_at_offset() {\n        let index = SegmentIndex::new(vec![entry(0, 100), entry(100, 200)]).unwrap();\n        assert_eq!(index.lookup(0).unwrap().length, 100);\n        assert_eq!(index.lookup(100).unwrap().length, 200);\n    }\n\n    #[test]\n    fn lookup_returns_none_for_missing_offset() {\n        let index = SegmentIndex::new(vec![entry(0, 100)]).unwrap();\n        assert!(index.lookup(50).is_none());\n    }\n\n    #[test]\n    fn duplicate_offset_rejected() {\n        let result = SegmentIndex::new(vec![entry(0, 100), entry(0, 200)]);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn empty_index_has_len_zero() {\n        let index = SegmentIndex::new(vec![]).unwrap();\n        assert_eq!(index.len(), 0);\n        assert!(index.is_empty());\n    }\n\n    #[test]\n    fn roundtrip_serialize_deserialize() {\n        let index = SegmentIndex::new(vec![entry(0, 50), entry(50, 150), entry(200, 300)]).unwrap();\n        let bytes = index.to_bytes();\n        let restored = SegmentIndex::from_bytes(\u0026bytes).unwrap();\n        assert_eq!(restored.len(), 3);\n        assert!(restored.lookup(50).is_some());\n    }\n}\n","traces":[{"line":45,"address":[6911216,6912130],"length":1,"stats":{"Line":3}},{"line":46,"address":[6904150],"length":1,"stats":{"Line":3}},{"line":47,"address":[7899227,7899140,7899350],"length":1,"stats":{"Line":10}},{"line":48,"address":[7899420,7899610],"length":1,"stats":{"Line":4}},{"line":49,"address":[6946701,6946661],"length":1,"stats":{"Line":4}},{"line":54,"address":[7886320,7886443],"length":1,"stats":{"Line":4}},{"line":56,"address":[7886171],"length" ite`\n//! function that dispatches writes to the correct tier.\n\nuse bytes::Bytes;\nuse oceanfs_core::{ObjectKey, SizeTier};\n\nuse crate::{\n    error::Result,\n    metadata::MetadataStore,\n    segment::{\n        splitter::SegmentSplitter,\n        tier::{ChunkListBuilder, TierRouter},\n    },\n};\n\n/// Writes blobs directly to the metadata store (inline path).\n#[allow(dead_code)]\npub(crate) struct InlineWriter;\n\nimpl InlineWriter {\n    /// Stores a blob inline in metadata.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the metadata write fails.\n    #[allow(dead_code)]\n    pub(crate) fn write_inline(\n        metadata: \u0026MetadataStore,\n        key: ObjectKey,\n        data: Bytes,\n    ) -\u003e Result\u003c()\u003e {\n        let meta = oceanfs_core::ObjectMetadata {\n            object_key: key,\n            size: data.len() as u64,\n            blake3_hash: None,\n            chunks: smallvec::SmallVec::new(),\n            inline_data: Some(data),\n            created_at: std::time::SystemTime::now()\n                .duration_since(std::time::UNIX_EPOCH)\n                .unwrap_or_default()\n                .as_millis() as i64,\n            hlc: oceanfs_core::Hlc::zero(),\n        };\n        metadata.put_object(meta)\n    }\n}\n\n/// Routes a blob write to the appropriate tier.\n#[allow(dead_code)]\npub(crate) fn route_write(\n    router: \u0026TierRouter,\n    metadata: \u0026MetadataStore,\n    active: \u0026mut crate::segment::buffer::ActiveSegment,\n    key: ObjectKey,\n    data: Bytes,\n) -\u003e Result\u003csmallvec::SmallVec\u003c[oceanfs_core::ChunkRef; 4]\u003e\u003e {\n    let blob_size = data.len() as u64;\n    if blob_size == 0 {\n        return Ok(smallvec::SmallVec::new());\n    }\n\n    let tier = router.classify(blob_size);\n\n    match tier {\n        SizeTier::Inline =\u003e {\n            InlineWriter::write_inline(metadata, key, data)?;\n            Ok(smallvec::SmallVec::new())\n        }\n        SizeTier::Small | SizeTier::Standard =\u003e {\n            let segment_id = active.id();\n            let (offset, length) = active.append(\u0026data)?;\n            Ok(ChunkListBuilder::single(segment_id, offset, length as u32))\n        }\n        SizeTier::Multi =\u003e {\n            let splitter = SegmentSplitter::new(router.target_size(SizeTier::Multi));\n            let chunks = splitter.split(\u0026data);\n            let mut refs = Vec::with_capacity(chunks.len());\n            for (chunk_offset, chunk_data) in \u0026chunks {\n                let segment_id = active.id();\n                let (_offset, _length) = active.append(chunk_data)?;\n                refs.push((segment_id, *chunk_offset, chunk_data.len() as u32));\n            }\n            Ok(ChunkListBuilder::multi(refs))\n        }\n        _ =\u003e Ok(smallvec::SmallVec::new()),\n    }\n}\n","traces":[{"line":29,"address":[6973584,6974331,6974359],"length":1,"stats":{"Line":0}},{"line":36,"address":[6973666],"length":1,"stats":{"Line":0}},{"line":38,"address":[6973730],"length":1,"stats":{"Line":0}},{"line":39,"address":[6973754],"length":1,"stats":{"Line":0}},{"line":40,"address":[6973890,6973817,6973969],"length":1,"stats":{"Line":0}},{"line":44,"address":[6974014],"length":1,"stats":{"Line":0}},{"line":46,"address":[6974260],"length":1,"stats":{"Line":0}},{"line":52,"address":[6974400,6976508,6976399],"length":1,"stats":{"Line":0}},{"line":59,"address":[6974596,6974492],"length":1,"stats":{"Line":0}},{"line":60,"address":[6974604],"length":1,"stats":{"Line":0}},{"line":61,"address":[6974637,6976413],"length":1,"stats":{"Line":0}},{"line":64,"address":[6974663,6974626],"length":1,"stats":{"Line":0}},{"line":66,"address":[6974670],"length":1,"stats":{"Line":0}},{"line":68,"address":[6974728,6975080,6974888],"length":1,"stats":{"Line":0}},{"line":69,"address":[6975016],"length":1,"stats":{"Line":0}},{"line":72,"address":[6974834],"length":1,"stats":{"Line":0}},{"line":73,"address":[6975109,6975420],"  SegmentSealer {\n    config: SealConfig,\n    metadata: Arc\u003cMetadataStore\u003e,\n    wal: Arc\u003cWalWriter\u003e,\n}\n\n#[allow(dead_code)]\nimpl SegmentSealer {\n    /// Creates a new segment sealer.\n    pub fn new(\n        config: SealConfig,\n        metadata: Arc\u003cMetadataStore\u003e,\n        wal: Arc\u003cWalWriter\u003e,\n    ) -\u003e Self {\n        Self { config, metadata, wal }\n    }\n\n    /// Attempts to seal an active segment.\n    ///\n    /// `entries` are the blob index entries mapping (offset, length, hash) for\n    /// each blob stored in this segment. The caller (write path) computes the\n    /// blob key hashes.\n    ///\n    /// Returns `None` if the segment is not ready to seal (not full, not timed out,\n    /// or empty). Returns a `SegmentHandle` on successful seal.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the seal process fails (disk I/O, metadata write, etc.).\n    pub async fn try_seal(\n        \u0026self,\n        active: \u0026mut ActiveSegment,\n        elapsed_ms: u64,\n        entries: \u0026[SegmentIndexEntry],\n    ) -\u003e Result\u003cOption\u003cSegmentHandle\u003e\u003e {\n        // Don't seal empty segments.\n        if active.size() == 0 {\n            return Ok(None);\n        }\n\n        // Check seal conditions.\n        let should_seal = active.is_full() || elapsed_ms \u003e= self.config.seal_timeout_ms;\n        if !should_seal {\n            return Ok(None);\n        }\n\n        self.seal(active, entries).await.map(Some)\n    }\n\n    /// Seals an active segment unconditionally.\n    async fn seal(\n        \u0026self,\n        active: \u0026mut ActiveSegment,\n        entries: \u0026[SegmentIndexEntry],\n    ) -\u003e Result\u003cSegmentHandle\u003e {\n        let segment_id = active.id();\n        let tier = active.tier();\n        let data = active.data().to_vec();\n        let size = active.size();\n        let blob_count = entries.len() as u32;\n\n        // Build the blob index from the provided entries.\n        let index = SegmentIndex::new(entries.to_vec())?;\n\n        // Compute checksum (BLAKE3 of segment data).\n        let checksum = blake3::hash(\u0026data);\n        let checksum_bytes: [u8; 32] = *checksum.as_bytes();\n\n        // Serialize header and index.\n        let header = SegmentHeader::new(segment_id, size, blob_count, size, checksum_bytes);\n        let header_bytes = header.to_bytes();\n        let index_bytes = index.to_bytes();\n\n        // Write segment file: header + data + index.\n        let path = self.config.data_dir.join(format!(\"{segment_id}.dat\"));\n        if let Some(parent) = path.parent() {\n            tokio::fs::create_dir_all(parent).await?;\n        }\n\n        let mut file_data = Vec::with_capacity(header_bytes.len() + data.len() + index_bytes.len());\n        file_data.extend_from_slice(\u0026header_bytes);\n        file_data.extend_from_slice(\u0026data);\n        file_data.extend_from_slice(\u0026index_bytes);\n        tokio::fs::write(\u0026path, \u0026file_data).await?;\n\n        // Persist segment metadata.\n        let meta = SegmentMetadata {\n            segment_id,\n            ec_k: 0, // set during EC encoding (Phase 3)\n            ec_m: 0,\n            size_tier: tier,\n            merkle_root: None,\n            storage_locations: smallvec::SmallVec::new(),\n            sealed_at: Some(\n                std::time::SystemTime::now()\n                    .duration_since(std::time::UNIX_EPOCH)\n                    .unwrap_or_default()\n                    .as_millis() as i64,\n            ),\n        };\n        self.metadata\n            .put_segment(meta)\n            .map_err(|e| Error::Io(std::io::Error::other(format!(\"metadata write failed: {e}\"))))?;\n\n        // Truncate the WAL (entries for this segment are no longer needed).\n        let wal_pos = self.wal.global_position().await;\n        self.wal.truncate(wal_pos).await?;\n\n        Ok(SegmentHandle::new(segment_id, vec![]))\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::WalConfig;\n\n    use super::*;\n    use crate::buffer_pool::BufferPool;\n\n    async fn setup() -\u003e (SegmentSealer, ActiveSegment, Vec\u003cSegmentIndexEntry\u003e, tempfile::TempDir) {\n        let dir = tempfile::tempdir().unwrap();\n\n        let metadata = Arc::new(\n            MetadataStore::open(\u0026oceanfs_core::MetadataConfig {\n                data_dir: dir.path().join(\"meta\"),\n                block_cache_size: 1024,\n                memtable_size: 1024,\n            })\n            .unwrap(),\n        );\n\n        let wal = Arc::new(\n            WalWriter::open(\u0026WalConfig {\n                data_dir: dir.path().join(\"wal\"),\n                max_file_size_bytes: 1024 * 1024,\n                fsync_batch_timeout_ms: 5,\n            })\n            .await\n            .unwrap(),\n        );\n\n        let config = SealConfig {\n            target_size_bytes: 100,\n            seal_timeout_ms: 1000,\n            data_dir: dir.path().join(\"segments\"),\n        };\n\n        let pool = BufferPool::new(65536, 4);\n        let size_config =\n            SegmentSizeConfig { default_target_size: 100, ..SegmentSizeConfig::default() };\n        let mut active = ActiveSegment::new(SizeTier::Standard, \u0026size_config, \u0026pool).unwrap();\n\n        // Write some data so it's not empty.\n        active.append(\u0026[0u8; 50]).unwrap();\n\n        // Build an index entry covering the appended data.\n        let entries = vec![SegmentIndexEntry {\n            offset: 0,\n            length: 50,\n            blob_key_hash: [0xAB; 32],\n        }];\n\n        let sealer = SegmentSealer::new(config, metadata, wal);\n        (sealer, active, entries, dir)\n    }\n\n    #[tokio::test]\n    async fn try_seal_returns_none_when_not_full_and_not_timed_out() {\n        let (sealer, mut active, entries, _dir) = setup().await;\n        let result = sealer.try_seal(\u0026mut active, 0, \u0026entries).await.unwrap();\n        assert!(result.is_none());\n    }\n\n    #[tokio::test]\n    async fn try_seal_returns_handle_when_full() {\n        let (sealer, mut active, entries, _dir) = setup().await;\n        // Fill it up.\n        active.append(\u0026[0u8; 60]).unwrap();\n        assert!(active.is_full());\n\n        let result = sealer.try_seal(\u0026mut active, 0, \u0026entries).await.unwrap();\n        assert!(result.is_some());\n    }\n\n    #[tokio::test]\n    async fn try_seal_returns_handle_when_timed_out() {\n        let (sealer, mut active, entries, _dir) = setup().await;\n        // Not full, but timed out.\n        let result = sealer.try_seal(\u0026mut active, 2000, \u0026entries).await.unwrap();\n        assert!(result.is_some());\n    }\n\n    #[tokio::test]\n    async fn try_seal_returns_none_for_empty_segment() {\n        let dir = tempfile::tempdir().unwrap();\n        let metadata = Arc::new(\n            MetadataStore::open(\u0026oceanfs_core::MetadataConfig {\n                data_dir: dir.path().join(\"meta\"),\n                block_cache_size: 1024,\n                memtable_size: 1024,\n            })\n            .unwrap(),\n        );\n        let wal = Arc::new(\n            WalWriter::open(\u0026WalConfig {\n                data_dir: dir.path().join(\"wal\"),\n                max_file_size_bytes: 1024 * 1024,\n                fsync_batch_timeout_ms: 5,\n            })\n            .await\n            .unwrap(),\n        );\n        let config = SealConfig {\n            target_size_bytes: 100,\n            seal_timeout_ms: 1000,\n            data_dir: dir.path().join(\"segments\"),\n        };\n        let pool = BufferPool::new(65536, 4);\n        let size_config =\n            SegmentSizeConfig { default_target_size: 100, ..SegmentSizeConfig::default() };\n        let mut active = ActiveSegment::new(SizeTier::Standard, \u0026size_config, \u0026pool).unwrap();\n        let sealer = SegmentSealer::new(config, metadata, wal);\n\n        // Empty segment should not seal.\n        let result = sealer.try_seal(\u0026mut active, 2000, \u0026[]).await.unwrap();\n        assert!(result.is_none());\n    }\n}\n","traces":[{"line":49,"address":[8036256],"length":1,"stats":{"Line":1}},{"line":69,"address":[6996192],"length":1,"stats":{"Line":1}},{"line":76,"address":[6783825,6783714],"length":1,"stats":{"Line":3}},{"line":77,"address":[6790939],"length":1,"stats":{"Line":1}},{"line":81,"address":[7906980,7906924],"length":1,"stats":{"Line":2}},{"line":82,"address":[6791022],"length":1,"stats":{"Line":2}},{"line":83,"address":[7759864],"length":1,"stats":{"Line":1}},{"line":86,"address":[7760100,7759991,7759924,7759680],"length":1,"stats":{"Line":3}},{"line":90,"address":[7115408],"length":1,"stats":{"Line":1}},{"line":95,"address":[7901110],"length":1,"stats":{"Line":1}},{"line":96,"address":[7901300],"length":1,"stats":{"Line":1}},{"line":97,"address":[6755461],"length":1,"stats":{"Line":1}},{"line":98,"address":[7901528,7901434],"length":1,"stats":{"Line":3}},{"line":99,"address":[6785536],"length":1,"stats":{"Line":1}},{"line":102,"address":[7755750,7754384],"length":1,"stats":{"Line":1}},{"line":105,"address":[6785823,6785932],"length":1,"stats":{"Line":2}},{"line":106,"address":[6785951],"length":1,"stats":{"Line":1}},{"line":109,"address":[7902020],"length":1,"stats":{"Line":1}},{"line":110,"address":[6779018],"length":1,"stats":{"Line":1}},{"line":111,"address":[7902139],"length":1,"stats":{"Line":1}},{"line":114,"address":[7755058,7755176],"length":1,"stats":{"Line":2}},{"line":115,"address":[6787330,6786646,6786549],"length":1,"stats":{"Line":3}},{"line":116,"address":[7315492],"length":1,"stats":{"Line":3}},{"line":119,"address":[6780255,6779707],"length":1,"stats":{"Line":2}},{"line":120,"address":[7756511,7756385],"length":1,"stats":{"Line":4}},{"line":121,"address":[6787698],"length":1,"stats":{"Line":2}},{"line":122,"address":[7903792],"length":1,"stats":{"Line":2}},{"line":123,"address":[7982859],"length":1,"stats":{"Line":4}},{"line":132,"address":[6788440],"length":1,"stats":{"Line":2}},{"line":140,"address":[7905037,7905342,7905123,7904856],"length":1,"stats":{"Line":3}},{"line":141,"address":[7757771],"length":1,"stats":{"Line":2}},{"line":142,"address":[6784662,6789010,6784640,6789091],"length":1,"stats":{"Line":2}},{"line":145,"address":[7754032,7758232,7758032],"length":1,"stats":{"Line":1}},{"line":146,"address":[7002703],"length":1,"stats":{"Line":2}},{"line":148,"address":[6783084],"length":1,"stats":{"Line":2}}],"covered":35,"coverable":35},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","segment","shard.rs"],"content":"//! Per-core segment sharding for write concurrency.\n//!\n//! Routes incoming writes to one of N independent active segment groups\n//! by hashing the connection or request ID. This reduces lock contention\n//! on the active segment's append path by a factor of `shard_count`.\n//!\n//! Per performance guideline §2.5: sharded segment buffer per worker thread.\n\nuse oceanfs_core::{SegmentSizeConfig, SizeTier};\n\nuse crate::{buffer_pool::BufferPool, error::Result, segment::buffer::ActiveSegment};\n\n/// Routes writes to one of N active segment groups by hashing.\n///\n/// Each shard group maintains its own active segment pool, isolating\n/// concurrent writes and reducing append-lock contention.\n///\n/// # Examples\n///\n/// ```ignore\n/// // SegmentShard is pub(crate); examples are in unit tests.\n/// use oceanfs_core::{SegmentSizeConfig, SizeTier};\n/// use oceanfs_storage::BufferPool;\n/// use oceanfs_storage::segment::shard::SegmentShard;\n///\n/// let config = SegmentSizeConfig::default();\n/// let pool = BufferPool::new(65536, 8);\n/// let shard = SegmentShard::new(4, SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n///\n/// // Different connection IDs may route to different segments.\n/// let seg_a = shard.get(42);\n/// let seg_b = shard.get(99);\n/// ```\n#[allow(dead_code)]\npub struct SegmentShard {\n    /// The active segments, one per shard.\n    segments: Vec\u003cparking_lot::Mutex\u003cActiveSegment\u003e\u003e,\n    /// Number of shards.\n    shard_count: usize,\n}\n\n#[allow(dead_code)]\nimpl SegmentShard {\n    /// Creates a new `SegmentShard` with `count` independent segment groups.\n    ///\n    /// Each group is initialized with a fresh active segment from the pool.\n    ///\n    /// # Panics\n    ///\n    /// In debug builds: panics if `count` is zero.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the buffer pool cannot provide enough buffers.\n    pub fn new(\n        count: usize,\n        tier: SizeTier,\n        config: \u0026SegmentSizeConfig,\n        pool: \u0026BufferPool,\n    ) -\u003e Result\u003cSelf\u003e {\n        debug_assert!(count \u003e 0, \"shard count must be \u003e 0\");\n\n        // Pre-size the vector.\n        let mut segments = Vec::with_capacity(count);\n        for _ in 0..count {\n            let seg = ActiveSegment::new(tier, config, pool)?;\n            segments.push(parking_lot::Mutex::new(seg));\n        }\n\n        Ok(Self { segments, shard_count: count })\n    }\n\n    /// Returns a reference to the active segment for the given connection ID.\n    ///\n    /// The segment is selected by hashing the connection ID and taking\n    /// the result modulo `shard_count` for even distribution.\n    /// The returned `MutexGuard` must be dropped before calling `get` again\n    /// with a connection ID that hashes to the same shard, or a deadlock\n    /// will occur (this `Mutex` is not reentrant).\n    pub fn get(\u0026self, connection_id: u64) -\u003e parking_lot::MutexGuard\u003c'_, ActiveSegment\u003e {\n        use std::hash::{Hash, Hasher};\n        let mut hasher = std::collections::hash_map::DefaultHasher::new();\n        connection_id.hash(\u0026mut hasher);\n        let hash = hasher.finish();\n        let index = (hash as usize) % self.shard_count;\n        self.segments[index].lock()\n    }\n\n    /// Returns the number of shard groups.\n    pub fn shard_count(\u0026self) -\u003e usize {\n        self.shard_count\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    fn config() -\u003e SegmentSizeConfig {\n        SegmentSizeConfig::default()\n    }\n\n    fn pool() -\u003e BufferPool {\n        BufferPool::new(65536, 8)\n    }\n\n    #[test]\n    fn shard_routes_different_ids_to_different_segments() {\n        let shard = SegmentShard::new(4, SizeTier::Standard, \u0026config(), \u0026pool()).unwrap();\n\n        // Check that different IDs route to different indices when\n        // their mod results differ.\n        let seg0 = shard.get(0);\n        let seg3 = shard.get(3);\n        assert_ne!(seg0.id(), seg3.id());\n    }\n\n    #[test]\n    fn shard_routes_same_mod_to_same_segment() {\n        let shard = SegmentShard::new(4, SizeTier::Standard, \u0026config(), \u0026pool()).unwrap();\n        // With hash-based routing, same input produces same shard.\n        let seg0_id = {\n            let seg = shard.get(0);\n            seg.id()\n        };\n        let seg0_again = {\n            let seg = shard.get(0);\n            seg.id()\n        };\n        assert_eq!(seg0_id, seg0_again);\n    }\n\n    #[test]\n    fn shard_distributes_writes_across_groups() {\n        let shard = SegmentShard::new(4, SizeTier::Standard, \u0026config(), \u0026pool()).unwrap();\n        // With hash-based routing, not all consecutive IDs will go to\n        // different shards. Verify that various IDs are served without\n        // deadlock.\n        for conn_id in [0u64, 1, 42, 999] {\n            let _seg = shard.get(conn_id);\n        }\n    }\n\n    #[test]\n    fn shard_count_matches_config() {\n        let shard = SegmentShard::new(8, SizeTier::Standard, \u0026config(), \u0026pool()).unwrap();\n        assert_eq!(shard.shard_count(), 8);\n    }\n\n on within the original blob.\n    pub fn split\u003c'a\u003e(\u0026self, data: \u0026'a [u8]) -\u003e Vec\u003c(u64, \u0026'a [u8])\u003e {\n        let chunk_count = (data.len() as u64).div_ceil(self.chunk_size) as usize;\n        let mut chunks = Vec::with_capacity(chunk_count);\n\n        let mut offset: u64 = 0;\n        for chunk in data.chunks(self.chunk_size as usize) {\n            chunks.push((offset, chunk));\n            offset += chunk.len() as u64;\n        }\n\n        chunks\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn split_exact_chunks() {\n        let splitter = SegmentSplitter::new(10);\n        let chunks = splitter.split(\u0026[1u8; 30]);\n        assert_eq!(chunks.len(), 3);\n        assert_eq!(chunks[0], (0, \u0026[1u8; 10] as \u0026[u8]));\n        assert_eq!(chunks[1], (10, \u0026[1u8; 10] as \u0026[u8]));\n        assert_eq!(chunks[2], (20, \u0026[1u8; 10] as \u0026[u8]));\n    }\n\n    #[test]\n    fn split_uneven_last_chunk() {\n        let splitter = SegmentSplitter::new(10);\n        let chunks = splitter.split(\u0026[1u8; 25]);\n        assert_eq!(chunks.len(), 3);\n        assert_eq!(chunks[2].1.len(), 5);\n    }\n\n    #[test]\n    fn split_smaller_than_chunk() {\n        let splitter = SegmentSplitter::new(100);\n        let chunks = splitter.split(\u0026[1u8; 5]);\n        assert_eq!(chunks.len(), 1);\n        assert_eq!(chunks[0].1.len(), 5);\n        assert_eq!(chunks[0].0, 0);\n    }\n\n    #[test]\n    fn split_empty_returns_empty() {\n        let splitter = SegmentSplitter::new(10);\n        assert!(splitter.split(\u0026[]).is_empty());\n    }\n}\n","traces":[{"line":15,"address":[6764240],"length":1,"stats":{"Line":6}},{"line":23,"address":[6558732,6558192,6558738],"length":1,"stats":{"Line":2}},{"line":24,"address":[6558256],"length":1,"stats":{"Line":4}},{"line":25,"address":[6558282],"length":1,"stats":{"Line":6}},{"line":27,"address":[6558311],"length":1,"  smallvec::SmallVec\u003c[ChunkRef; 4]\u003e {\n        let mut chunks = smallvec::SmallVec::new();\n        chunks.push(ChunkRef { segment_id, offset, length });\n        chunks\n    }\n\n    pub(crate) fn multi(\n        refs: Vec\u003c(oceanfs_core::SegmentId, u64, u32)\u003e,\n    ) -\u003e smallvec::SmallVec\u003c[ChunkRef; 4]\u003e {\n        let mut chunks = smallvec::SmallVec::with_capacity(refs.len());\n        for (segment_id, offset, length) in refs {\n            chunks.push(ChunkRef { segment_id, offset, length });\n        }\n        chunks\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn router_classify_uses_config_thresholds() {\n        let config = SegmentSizeConfig::default();\n        let router = TierRouter::new(config);\n        assert_eq!(router.classify(1024), SizeTier::Inline);\n        assert_eq!(router.classify(4097), SizeTier::Small);\n        assert_eq!(router.classify(500_000), SizeTier::Standard);\n        assert_eq!(router.classify(10_000_000), SizeTier::Multi);\n    }\n\n    #[test]\n    fn is_inline_true_for_small_blobs() {\n        let router = TierRouter::new(SegmentSizeConfig::default());\n        assert!(router.is_inline(100));\n        assert!(!router.is_inline(5000));\n    }\n\n    #[test]\n    fn chunk_list_builder_single() {\n        let id = oceanfs_core::SegmentId::new();\n        let chunks = ChunkListBuilder::single(id, 0, 1024);\n        assert_eq!(chunks.len(), 1);\n        assert_eq!(chunks[0].segment_id, id);\n        assert_eq!(chunks[0].offset, 0);\n        assert_eq!(chunks[0].length, 1024);\n    }\n\n    #[test]\n    fn chunk_list_builder_multi() {\n        let id1 = oceanfs_core::SegmentId::new();\n        let id2 = oceanfs_core::SegmentId::new();\n        let chunks = ChunkListBuilder::multi(vec![(id1, 0, 100), (id2, 0, 50)]);\n        assert_eq!(chunks.len(), 2);\n    }\n}\n","traces":[{"line":13,"address":[7522480],"length":1,"stats":{"Line":10}},
