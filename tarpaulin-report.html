configuration.\n    pub fn new(config: CodecConfig) -\u003e Self {\n        Self { k: config.data_shards, m: config.parity_shards }\n    }\n\n    /// Returns the number of data shards (k).\n    pub fn data_shards(\u0026self) -\u003e u8 {\n        self.k\n    }\n\n    /// Returns the number of parity shards (m).\n    pub fn parity_shards(\u0026self) -\u003e u8 {\n        self.m\n    }\n\n    /// Generates the Cauchy matrix for (k, m).\n    fn cauchy_matrix(k: u8, m: u8) -\u003e Vec\u003cVec\u003cgf::Gf8\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n\n        // Distinct elements for Cauchy construction: X = [1..k], Y = [k+1..k+m]\n        let mut matrix = vec![vec![0u8; ki]; mi];\n        for i in 0..mi {\n            for j in 0..ki {\n                let x = (j + 1) as u8;\n                let y = (ki + i + 1) as u8;\n                matrix[i][j] = gf::gf_inv(gf::gf_add(x, y));\n            }\n        }\n        matrix\n    }\n\n    /// Builds the generator matrix G (k+m)×k.\n    /// Top k rows: identity. Bottom m rows: Cauchy matrix.\n    fn generator_matrix(k: u8, m: u8) -\u003e Vec\u003cVec\u003cgf::Gf8\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n        let cauchy = Self::cauchy_matrix(k, m);\n\n        let mut g = vec![vec![0u8; ki]; ki + mi];\n\n        // Identity block (top k rows).\n        for i in 0..ki {\n            g[i][i] = 1;\n        }\n\n        // Cauchy block (bottom m rows).\n        for i in 0..mi {\n            for j in 0..ki {\n                g[ki + i][j] = cauchy[i][j];\n            }\n        }\n\n        g\n    }\n\n    /// Encodes data shards into parity shards using the Cauchy matrix.\n    fn encode_cauchy(k: u8, m: u8, data_shards: \u0026[\u0026[u8]]) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n        let cm = Self::cauchy_matrix(k, m);\n        let shard_size = data_shards[0].len();\n\n        let mut parity: Vec\u003cVec\u003cu8\u003e\u003e = (0..mi).map(|_| vec![0u8; shard_size]).collect();\n\n        for i in 0..mi {\n            for byte_idx in 0..shard_size {\n                let mut sum: gf::Gf8 = 0;\n                for j in 0..ki {\n                    sum = gf::gf_add(sum, gf::gf_mul(cm[i][j], data_shards[j][byte_idx]));\n                }\n                parity[i][byte_idx] = sum;\n            }\n        }\n\n        Ok(parity)\n    }\n\n    /// Inverts a square matrix over GF(2^8) using Gauss-Jordan elimination.\n    fn invert_matrix(matrix: \u0026[Vec\u003cgf::Gf8\u003e]) -\u003e Option\u003cVec\u003cVec\u003cgf::Gf8\u003e\u003e\u003e {\n        let n = matrix.len();\n        // Augmented matrix [A | I].\n        let mut aug: Vec\u003cVec\u003cgf::Gf8\u003e\u003e = vec![vec![0u8; 2 * n]; n];\n        for i in 0..n {\n            for j in 0..n {\n                aug[i][j] = matrix[i][j];\n            }\n            aug[i][n + i] = 1;\n        }\n\n        // Forward elimination.\n        for col in 0..n {\n            // Find pivot.\n            let mut pivot_row = col;\n            while pivot_row \u003c n \u0026\u0026 aug[pivot_row][col] == 0 {\n                pivot_row += 1;\n            }\n            if pivot_row == n {\n                return None; // singular\n            }\n            aug.swap(col, pivot_row);\n\n            // Normalize pivot row.\n            let inv = gf::gf_inv(aug[col][col]);\n            for j in 0..2 * n {\n                aug[col][j] = gf::gf_mul(aug[col][j], inv);\n            }\n\n            // Eliminate other rows.\n            for row in 0..n {\n                if row == col {\n                    continue;\n                }\n                let factor = aug[row][col];\n                if factor != 0 {\n                    for j in 0..2 * n {\n                        aug[row][j] = gf::gf_add(aug[row][j], gf::gf_mul(factor, aug[col][j]));\n                    }\n                }\n            }\n        }\n\n        // Extract right half.\n        let mut inv = vec![vec![0u8; n]; n];\n        for i in 0..n {\n            for j in 0..n {\n                inv[i][j] = aug[i][n + j];\n            }\n        }\n        Some(inv)\n    }\n}\n\nimpl Encoder for CauchyEncoder {\n    fn encode(\u0026self, data_shards: \u0026[\u0026[u8]], parity_count: u8) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        if data_shards.len() != self.k as usize {\n            return Err(Error::InvalidConfig(format!(\n                \"expected {} data shards, got {}\",\n                self.k,\n                data_shards.len()\n            )));\n        }\n        if data_shards.is_empty() {\n            return Ok(Vec::new());\n        }\n\n        let shard_size = data_shards[0].len();\n        for shard in data_shards.iter() {\n            if shard.len() != shard_size {\n                return Err(Error::ShardSizeMismatch { expected: shard_size, actual: shard.len() });\n            }\n        }\n\n        Self::encode_cauchy(self.k, parity_count, data_shards)\n    }\n}\n\nimpl Decoder for CauchyEncoder {\n    fn decode(\n        \u0026self,\n        available_shards: \u0026[Option\u003c\u0026[u8]\u003e],\n        data_count: u8,\n        parity_count: u8,\n    ) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        let k = data_count as usize;\n        let m = parity_count as usize;\n        let total = k + m;\n\n        if available_shards.len() != total {\n            return Err(Error::InvalidConfig(format!(\n                \"expected {} available shards, got {}\",\n                total,\n                available_shards.len()\n            )));\n        }\n\n        // Count available shards and identify which ones.\n        let present: Vec\u003cusize\u003e = (0..total).filter(|\u0026i| available_shards[i].is_some()).collect();\n        if present.len() \u003c k {\n            return Err(Error::NotEnoughShards { needed: k, available: present.len() });\n        }\n\n        // Determine shard size from first available shard.\n        let first_shard = available_shards[present[0]]\n            .ok_or_else(|| Error::InvalidConfig(\"first shard is None\".into()))?;\n        let shard_size = first_shard.len();\n\n        // Build generator matrix G.\n        let gen = Self::generator_matrix(data_count, parity_count);\n\n        // Extract surviving rows of G corresponding to available shards.\n        let mut sub_matrix: Vec\u003cVec\u003cgf::Gf8\u003e\u003e = Vec::with_capacity(k);\n        let mut sub_data: Vec\u003c\u0026[u8]\u003e = Vec::with_capacity(k);\n        let mut selected_indices = Vec::with_capacity(k);\n\n        for \u0026idx in present.iter().take(k) {\n            sub_matrix.push(gen[idx].clone());\n            let shard = available_shards[idx]\n                .ok_or_else(|| Error::InvalidConfig(format!(\"shard {idx} is None\")))?;\n            sub_data.push(shard);\n            selected_indices.push(idx);\n        }\n\n        // Invert sub-matrix.\n        let inv = Self::invert_matrix(\u0026sub_matrix)\n            .ok_or_else(|| Error::DecodingFailed(\"matrix is singular\".into()))?;\n\n        // Reconstruct data shards: data[i] = sum_j inv[i][j] * sub_data[j].\n        let mut recovered: Vec\u003cVec\u003cu8\u003e\u003e = (0..k).map(|_| vec![0u8; shard_size]).collect();\n\n        for i in 0..k {\n            for byte_idx in 0..shard_size {\n                let mut sum: gf::Gf8 = 0;\n                for j in 0..k {\n                    sum = gf::gf_add(sum, gf::gf_mul(inv[i][j], sub_data[j][byte_idx]));\n                }\n                recovered[i][byte_idx] = sum;\n            }\n        }\n\n        // Recovered data is the original k data shards in order.\n        Ok(recovered)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn encode_decode_roundtrip_k4_m2() {\n        let codec = CauchyEncoder::new(CodecConfig {\n            data_shards: 4,\n            parity_shards: 2,\n            ..Default::default()\n        });\n\n        let data: Vec\u003cVec\u003cu8\u003e\u003e = (0..4).map(|i| vec![i as u8 + 1; 1024]).collect();\n        let data_refs: Vec\u003c\u0026[u8]\u003e = data.iter().map(|v| v.as_slice()).collect();\n        let parity = codec.encode(\u0026data_refs, 2).unwrap();\n\n        // Build available shards: lose shard 0 and shard 2.\n        let available: Vec\u003cOption\u003c\u0026[u8]\u003e\u003e =\n            vec![None, Some(\u0026data[1]), None, Some(\u0026data[3]), Some(\u0026parity[0]), Some(\u0026parity[1])];\n\n        let recovered = codec.decode(\u0026available, 4, 2).unwrap();\n        assert_eq!(recovered[0], data[0]);\n        assert_eq!(recovered[1], data[1]);\n        assert_eq!(recovered[2], data[2]);\n        assert_eq!(recovered[3], data[3]);\n    }\n\n    #[test]\n    fn encode_decode_k1_m0() {\n        let codec = CauchyEncoder::new(CodecConfig {\n            data_shards: 1,\n            parity_shards: 0,\n            ..Default::default()\n        });\n        let data = [\u0026b\"hello\"[..]];\n        let parity = codec.encode(\u0026data, 0).unwrap();\n        assert!(parity.is_empty());\n    }\n\n    #[test]\n    fn decode_needs_at_least_k_shards() {\n        let codec = CauchyEncoder::new(CodecConfig {\n            data_shards: 4,\n            parity_shards: 2,\n            ..Default::default()\n        });\n        let available: Vec\u003cOption\u003c\u0026[u8]\u003e\u003e = vec![Some(b\"a\"), None, None, Some(b\"d\"), None, None];\n        let result = codec.decode(\u0026available, 4, 2);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn encode_with_mismatched_sizes_errors() {\n        let codec = CauchyEncoder::new(CodecConfig {\n            data_shards: 2,\n            parity_shards: 1,\n            ..Default::default()\n        });\n        let data = [\u0026b\"short\"[..], \u0026b\"longer\"[..]];\n        let result = codec.encode(\u0026data, 1);\n        assert!(result.is_err());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","error.rs"],"content":"//! EC error types.\n\n/// Erasure coding errors.\n#[derive(Debug, thiserror::Error)]\npub enum Error {\n    /// Not enough shards available for reconstruction.\n    #[error(\"need at least {needed} shards, got {available}\")]\n    NotEnoughShards { needed: usize, available: usize },\n\n    /// Invalid codec configuration.\n    #[error(\"invalid config: {0}\")]\n    InvalidConfig(String),\n\n    /// Shard size mismatch.\n    #[error(\"shard size mismatch: expected {expected}, got {actual}\")]\n    ShardSizeMismatch { expected: usize, actual: usize },\n\n    /// Internal computation error.\n    #[error(\"decode error: {0}\")]\n    DecodingFailed(String),\n}\n\n/// Convenience result alias.\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n\n#[cfg(test)]\nmod assertions {\n    use static_assertions::assert_impl_all;\n\n    use super::Error;\n    assert_impl_all!(Error: std::error::Error, Send, Sync);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","gf.rs"],"content":"//! Galois Field GF(2^8) arithmetic.\n//!\n//! Uses log/exp tables for fast multiplication and division.\n//! Addition is XOR. The primitive polynomial is 0x11D\n//! (x^8 + x^4 + x^3 + x^2 + 1).\n\n/// GF(2^8) element (0..255).\npub(crate) type Gf8 = u8;\n\n/// Primitive polynomial: x^8 + x^4 + x^3 + x^2 + 1\nconst PRIMITIVE_POLY: u16 = 0x11D;\n\n/// Log table: log[alpha^i] = i for i in 0..255.\n/// alpha = 2 is the primitive element.\nstatic LOG_TABLE: [u8; 256] = build_log_table();\n/// Exp table: exp[i] = alpha^i.\nstatic EXP_TABLE: [u8; 512] = build_exp_table();\n\nconst fn build_log_table() -\u003e [u8; 256] {\n    let mut log = [0u8; 256];\n    let mut x: u16 = 1;\n    let mut i: u16 = 0;\n    while i \u003c 255 {\n        log[x as usize] = i as u8;\n        x \u003c\u003c= 1;\n        if x \u003e= 256 {\n            x ^= PRIMITIVE_POLY;\n        }\n        i += 1;\n    }\n    log\n}\n\nconst fn build_exp_table() -\u003e [u8; 512] {\n    let mut exp = [0u8; 512];\n    let mut x: u16 = 1;\n    let mut i: u16 = 0;\n    while i \u003c 511 {\n        exp[i as usize] = x as u8;\n        x \u003c\u003c= 1;\n        if x \u003e= 256 {\n            x ^= PRIMITIVE_POLY;\n        }\n        i += 1;\n    }\n    exp[255] = exp[0]; // alpha^255 = 1\n    exp\n}\n\n/// Adds two GF(2^8) elements (XOR).\n#[inline]\npub(crate) fn gf_add(a: Gf8, b: Gf8) -\u003e Gf8 {\n    a ^ b\n}\n\n/// Multiplies two GF(2^8) elements.\n#[inline]\npub(crate) fn gf_mul(a: Gf8, b: Gf8) -\u003e Gf8 {\n    if a == 0 || b == 0 {\n        0\n    } else {\n        let sum = LOG_TABLE[a as usize] as u16 + LOG_TABLE[b as usize] as u16;\n        EXP_TABLE[sum as usize]\n    }\n}\n\n/// Divides a / b in GF(2^8).\n#[inline]\npub(crate) fn gf_div(a: Gf8, b: Gf8) -\u003e Gf8 {\n    if a == 0 {\n        0\n    } else if b == 0 {\n        panic!(\"division by zero in GF(2^8)\")\n    } else {\n        let diff = LOG_TABLE[a as usize] as i16 - LOG_TABLE[b as usize] as i16;\n        let idx = if diff \u003c 0 { diff + 255 } else { diff } as usize;\n        EXP_TABLE[idx]\n    }\n}\n\n/// Computes the multiplicative inverse a^(-1) in GF(2^8).\n#[inline]\npub(crate) fn gf_inv(a: Gf8) -\u003e Gf8 {\n    if a == 0 {\n        panic!(\"inverse of zero in GF(2^8)\")\n    }\n    gf_div(1, a)\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn add_is_xor() {\n        assert_eq!(gf_add(0x53, 0xCA), 0x53 ^ 0xCA);\n    }\n\n    #[test]\n    fn mul_commutative() {\n        for a in 1..=255u8 {\n            for b in 1..=255u8 {\n                assert_eq!(gf_mul(a, b), gf_mul(b, a), \"a={a}, b={b}\");\n            }\n        }\n    }\n\n    #[test]\n    fn mul_distributive() {\n        let a = 0x12;\n        let b = 0x34;\n        let c = 0x56;\n        assert_eq!(gf_mul(a, gf_add(b, c)), gf_add(gf_mul(a, b), gf_mul(a, c)));\n    }\n\n    #[test]\n    fn mul_identity() {\n        for a in 1..=255u8 {\n            assert_eq!(gf_mul(a, 1), a);\n        }\n    }\n\n    #[test]\n    fn mul_zero() {\n        for a in 0..=255u8 {\n            assert_eq!(gf_mul(a, 0), 0);\n        }\n    }\n\n    #[test]\n    fn inv_times_self_is_one() {\n        for a in 1..=255u8 {\n            assert_eq!(gf_mul(a, gf_inv(a)), 1, \"a={a}\");\n        }\n    }\n\n    #[test]\n    fn div_undoes_mul() {\n        for a in 1..=255u8 {\n            for b in 1..=255u8 {\n                assert_eq!(gf_div(gf_mul(a, b), b), a, \"a={a}, b={b}\");\n            }\n        }\n    }\n}\n","traces":[{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":19},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","lib.rs"],"content":"//! Erasure coding engine.\n//!\n//! Defines the `Encoder` and `Decoder` traits and a Cauchy Reed-Solomon\n//! implementation over GF(2^8). Supports rayon-based stripe parallelism\n//! via `ParallelEncoder` and `ParallelDecoder`.\n//!\n//! # Unsafe Code\n//!\n//! This crate is permitted to use `unsafe` for SIMD-accelerated Galois\n//! field arithmetic intrinsics.\n\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod cauchy;\nmod error;\nmod gf;\nmod stripe;\nmod traits;\n\npub use cauchy::CauchyEncoder;\npub use oceanfs_core::EncodingPlan;\npub use stripe::{ParallelDecoder, ParallelEncoder, StripeBatch, StripeLayout};\npub use traits::{Decoder, Encoder};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","stripe","batch.rs"],"content":"//! Stripe batch — Struct of Arrays (SoA) layout for EC data.\n\n/// A batch of stripes in SoA layout.\n///\n/// `data[i]` is the i-th data shard for all stripes concatenated.\n/// `parity[j]` is the j-th parity shard for all stripes concatenated.\n///\n/// This layout ensures sequential memory access during GF(2^8) matrix\n/// operations, per performance guideline §6.2.\n#[derive(Debug, Clone)]\npub struct StripeBatch {\n    /// Data shards (k vectors, each `stripe_count × shard_size` bytes).\n    pub data: Vec\u003cVec\u003cu8\u003e\u003e,\n    /// Parity shards (m vectors, same size as data shards).\n    pub parity: Vec\u003cVec\u003cu8\u003e\u003e,\n}\n\nimpl StripeBatch {\n    /// Creates an empty stripe batch.\n    pub fn new(data_count: usize, parity_count: usize) -\u003e Self {\n        Self { data: vec![Vec::new(); data_count], parity: vec![Vec::new(); parity_count] }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","stripe","layout.rs"],"content":"//! Stripe layout computation.\n//!\n//! Computes how many stripes a segment produces given its size and\n//! EC parameters (k, m, strip_size).\n\nuse oceanfs_core::EncodingPlan;\n\n/// Computes stripe layout for a segment.\npub struct StripeLayout;\n\nimpl StripeLayout {\n    /// Computes the encoding plan for a segment.\n    ///\n    /// A segment is split into stripes of `k × strip_size` bytes.\n    /// The final stripe is zero-padded if the segment size is not\n    /// a multiple of the stripe size.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use oceanfs_ec::StripeLayout;\n    ///\n    /// let plan = StripeLayout::compute(1_048_576, 4, 2, 65536);\n    /// assert_eq!(plan.stripe_count, 4);\n    /// assert_eq!(plan.shard_size, 65536);\n    /// ```\n    pub fn compute(segment_size: u64, k: u8, _m: u8, strip_size: usize) -\u003e EncodingPlan {\n        let k = k as u64;\n        let stripe_data_size = k * strip_size as u64;\n        let stripe_count = segment_size.div_ceil(stripe_data_size) as usize;\n        let padded_size = stripe_count as u64 * stripe_data_size;\n\n        EncodingPlan { stripe_count, padded_size, shard_size: strip_size }\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn exact_fit() {\n        // 4 * 64KB * 4 stripes = 1 MB\n        let plan = StripeLayout::compute(1_048_576, 4, 2, 65536);\n        assert_eq!(plan.stripe_count, 4);\n        assert_eq!(plan.padded_size, 1_048_576);\n    }\n\n    #[test]\n    fn needs_padding() {\n        // 1 MB + 1 byte\n        let plan = StripeLayout::compute(1_048_577, 4, 2, 65536);\n        assert_eq!(plan.stripe_count, 5);\n        assert_eq!(plan.padded_size, 4 * 65536 * 5);\n    }\n\n    #[test]\n    fn empty_segment() {\n        let plan = StripeLayout::compute(0, 4, 2, 65536);\n        assert_eq!(plan.stripe_count, 0);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","stripe","mod.rs"],"content":"//! Stripe layout, batching, and parallel encode/decode.\n//!\n//! Splits segment data into independent stripes and processes them\n//! in parallel using rayon.\n\nmod batch;\nmod layout;\nmod parallel;\n\npub use batch::StripeBatch;\npub use layout::StripeLayout;\npub use parallel::{ParallelDecoder, ParallelEncoder};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","stripe","parallel.rs"],"content":"//! Parallel encode/decode using rayon.\n//!\n//! Distributes stripe processing across all available CPU cores\n//! via rayon parallel iterators. A tokio semaphore bounds concurrency\n//! at the segment level.\n\n#![allow(clippy::needless_range_loop)]\n\nuse std::sync::Arc;\n\nuse oceanfs_core::EncodingPlan;\nuse rayon::prelude::*;\nuse tokio::sync::Semaphore;\n\nuse crate::{\n    error::Result,\n    stripe::batch::StripeBatch,\n    traits::{Decoder, Encoder},\n};\n\n/// Parallel encoder — encodes all stripes in a segment concurrently.\npub struct ParallelEncoder {\n    encoder: Arc\u003cdyn Encoder\u003e,\n    semaphore: Option\u003cArc\u003cSemaphore\u003e\u003e,\n}\n\nimpl ParallelEncoder {\n    /// Creates a new parallel encoder.\n    ///\n    /// `max_concurrency` bounds the number of concurrent segment encodes.\n    /// 0 means no bound.\n    pub fn new(encoder: Arc\u003cdyn Encoder\u003e, max_concurrency: usize) -\u003e Self {\n        let semaphore = if max_concurrency \u003e 0 {\n            Some(Arc::new(Semaphore::new(max_concurrency)))\n        } else {\n            None\n        };\n        Self { encoder, semaphore }\n    }\n\n    /// Encodes segment data into a StripeBatch.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if encoding any stripe fails.\n    ///\n    /// Splits the segment into stripes per the plan, then encodes all\n    /// stripes in parallel using rayon.\n    pub fn encode(\u0026self, segment_data: \u0026[u8], plan: \u0026EncodingPlan) -\u003e Result\u003cStripeBatch\u003e {\n        let _permit = self.semaphore.as_ref().map(|s| s.acquire());\n\n        let _k = plan.stripe_count * plan.shard_size; // bytes per data shard\n        let total_stripes = plan.stripe_count;\n\n        // Split segment data into k shards (interleaved layout for SoA).\n        let mut data_shards: Vec\u003cVec\u003cu8\u003e\u003e = Vec::with_capacity(4);\n        for _ in 0..4 {\n            data_shards.push(vec![0u8; total_stripes * plan.shard_size]);\n        }\n\n        // Copy segment data into interleaved shards.\n        for stripe_idx in 0..total_stripes {\n            let stripe_offset = stripe_idx * 4 * plan.shard_size;\n            for shard_idx in 0..4 {\n                let shard_offset = stripe_idx * plan.shard_size;\n                let src_start = stripe_offset + shard_idx * plan.shard_size;\n                let src_end = (src_start + plan.shard_size).min(segment_data.len());\n                let copy_len = src_end.saturating_sub(src_start);\n                data_shards[shard_idx][shard_offset..shard_offset + copy_len]\n                    .copy_from_slice(\u0026segment_data[src_start..src_start + copy_len]);\n            }\n        }\n\n        // Encode each stripe in parallel.\n        let m = 2u8; // default — should come from encoder config\n        let mut parity_shards: Vec\u003cVec\u003cu8\u003e\u003e =\n            vec![vec![0u8; total_stripes * plan.shard_size]; m as usize];\n\n        let results: Vec\u003cResult\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e\u003e = (0..total_stripes)\n            .into_par_iter()\n            .map(|stripe_idx| {\n                let stripe_data: Vec\u003c\u0026[u8]\u003e = data_shards\n                    .iter()\n                    .map(|shard| {\n                        \u0026shard[stripe_idx * plan.shard_size..(stripe_idx + 1) * plan.shard_size]\n                    })\n                    .collect();\n                self.encoder.encode(\u0026stripe_data, m)\n            })\n            .collect();\n\n        // Collect parity results.\n        for (stripe_idx, result) in results.into_iter().enumerate() {\n            let parity = result?;\n            for (p_idx, p_data) in parity.iter().enumerate() {\n                let offset = stripe_idx * plan.shard_size;\n                parity_shards[p_idx][offset..offset + p_data.len()].copy_from_slice(p_data);\n            }\n        }\n\n        Ok(StripeBatch { data: data_shards, parity: parity_shards })\n    }\n}\n\n/// Parallel decoder — decodes all stripes in a segment concurrently.\npub struct ParallelDecoder {\n    decoder: Arc\u003cdyn Decoder\u003e,\n    semaphore: Option\u003cArc\u003cSemaphore\u003e\u003e,\n}\n\nimpl ParallelDecoder {\n    /// Creates a new parallel decoder.\n    pub fn new(decoder: Arc\u003cdyn Decoder\u003e, max_concurrency: usize) -\u003e Self {\n        let semaphore = if max_concurrency \u003e 0 {\n            Some(Arc::new(Semaphore::new(max_concurrency)))\n        } else {\n            None\n        };\n        Self { decoder, semaphore }\n    }\n\n    /// Decodes a StripeBatch, recovering missing shards.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if decoding any stripe fails.\n    pub fn decode(\n        \u0026self,\n        available: \u0026StripeBatch,\n        plan: \u0026EncodingPlan,\n        k: u8,\n        m: u8,\n        missing_indices: \u0026[usize],\n    ) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        let _permit = self.semaphore.as_ref().map(|s| s.acquire());\n\n        let total_stripes = plan.stripe_count;\n        let mut recovered_data: Vec\u003cVec\u003cu8\u003e\u003e =\n            vec![vec![0u8; total_stripes * plan.shard_size]; k as usize];\n\n        let results: Vec\u003cResult\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e\u003e = (0..total_stripes)\n            .into_par_iter()\n            .map(|stripe_idx| {\n                let mut shards: Vec\u003cOption\u003c\u0026[u8]\u003e\u003e = vec![None; (k + m) as usize];\n\n                // Fill available data shards.\n                for i in 0..k as usize {\n                    if !missing_indices.contains(\u0026i) {\n                        let offset = stripe_idx * plan.shard_size;\n                        let end = offset + plan.shard_size;\n                        if offset \u003c available.data[i].len() {\n                            shards[i] =\n                                Some(\u0026available.data[i][offset..end.min(available.data[i].len())]);\n                        }\n                    }\n                }\n                // Fill available parity shards.\n                for i in 0..m as usize {\n                    let offset = stripe_idx * plan.shard_size;\n                    let end = offset + plan.shard_size;\n                    if offset \u003c available.parity[i].len() {\n                        shards[k as usize + i] =\n                            Some(\u0026available.parity[i][offset..end.min(available.parity[i].len())]);\n                    }\n                }\n\n                self.decoder.decode(\u0026shards, k, m)\n            })\n            .collect();\n\n        for (stripe_idx, result) in results.into_iter().enumerate() {\n            let decoded = result?;\n            for (d_idx, d_data) in decoded.iter().enumerate() {\n                let offset = stripe_idx * plan.shard_size;\n                let len = d_data.len().min(plan.shard_size);\n                if offset + len \u003c= recovered_data[d_idx].len() {\n                    recovered_data[d_idx][offset..offset + len].copy_from_slice(\u0026d_data[..len]);\n                }\n            }\n        }\n\n        Ok(recovered_data)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::CodecConfig;\n\n    use super::*;\n    use crate::{cauchy::CauchyEncoder, StripeLayout};\n\n    #[test]\n    fn parallel_encode_then_decode_roundtrip() {\n        let config = CodecConfig {\n            data_shards: 4,\n            parity_shards: 2,\n            strip_size_bytes: 64,\n            ..Default::default()\n        };\n        let codec = Arc::new(CauchyEncoder::new(config.clone()));\n\n        let plan = StripeLayout::compute(1024, 4, 2, 64);\n        let segment_data = vec![0xABu8; 1024];\n\n        let encoder = ParallelEncoder::new(codec.clone(), 0);\n        let batch = encoder.encode(\u0026segment_data, \u0026plan).unwrap();\n\n        // Re-decode with all data shards present (no missing).\n        let decoder = ParallelDecoder::new(codec, 0);\n        let recovered = decoder.decode(\u0026batch, \u0026plan, 4, 2, \u0026[]).unwrap();\n\n        assert_eq!(recovered.len(), 4);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","traits.rs"],"content":"//! Encoder and Decoder traits for erasure coding.\n\nuse crate::error::Result;\n\n/// Encodes k data shards into m parity shards.\n///\n/// # Examples\n///\n/// ```ignore\n/// use oceanfs_ec::{Encoder, CauchyEncoder};\n/// use oceanfs_core::CodecConfig;\n///\n/// let config = CodecConfig { data_shards: 4, parity_shards: 2, ..Default::default() };\n/// let encoder = CauchyEncoder::new(config);\n/// let data = [b\"hello\", b\"world\", b\"foo__\", b\"bar__\"];\n/// let parity = encoder.encode(\u0026data, 2).unwrap();\n/// assert_eq!(parity.len(), 2);\n/// ```\npub trait Encoder: Send + Sync {\n    /// Encodes k data shards into m parity shards.\n    ///\n    /// All data shards must have the same length.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if shard sizes differ or k/m are invalid.\n    fn encode(\u0026self, data_shards: \u0026[\u0026[u8]], parity_count: u8) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e;\n}\n\n/// Decodes available shards to recover missing data shards.\n///\n/// # Examples\n///\n/// ```ignore\n/// use oceanfs_ec::{Decoder, CauchyEncoder};\n/// use oceanfs_core::CodecConfig;\n///\n/// let config = CodecConfig { data_shards: 4, parity_shards: 2, ..Default::default() };\n/// let encoder = CauchyEncoder::new(config);\n/// // Recover data shards 0 and 2 using other available shards.\n/// let available: Vec\u003cOption\u003c\u0026[u8]\u003e\u003e = vec![None, Some(b\"B\"), Some(b\"C\"), Some(b\"D\"), Some(b\"P0\"), Some(b\"P1\")];\n/// let recovered = encoder.decode(\u0026available, 4, 2).unwrap();\n/// ```\npub trait Decoder: Send + Sync {\n    /// Decodes available shards to recover the original k data shards.\n    ///\n    /// `available` has length k+m. `None` entries indicate missing shards.\n    /// At least k entries must be `Some`.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if fewer than k shards are available.\n    fn decode(\n        \u0026self,\n        available_shards: \u0026[Option\u003c\u0026[u8]\u003e],\n        data_count: u8,\n        parity_count: u8,\n    ) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-hash","src","lib.rs"],"content":"//! Hashing subsystem — BLAKE3 streaming hasher and batch verification.\n//!\n//! Provides content-addressable hashing for blob data, segment checksums,\n//! and Merkle tree nodes. Uses the `blake3` crate with runtime SIMD\n//! detection (AVX-512, AVX2, SSE4.1, NEON).\n//!\n//! # Unsafe Code\n//!\n//! This crate is permitted to use `unsafe` for SIMD intrinsics.\n\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-membership","src","error.rs"],"content":"//! Membership error types.\n\n/// Membership errors.\n#[derive(Debug, thiserror::Error)]\npub enum Error {\n    /// The requested node was not found in the membership.\n    #[error(\"node not found: {0}\")]\n    NodeNotFound(String),\n\n    /// The membership system has shut down.\n    #[error(\"membership shut down\")]\n    Shutdown,\n\n    /// An I/O error occurred.\n    #[error(\"I/O error: {0}\")]\n    Io(#[from] std::io::Error),\n}\n\n/// Convenience result alias.\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n\n#[cfg(test)]\nmod assertions {\n    use static_assertions::assert_impl_all;\n\n    use super::Error;\n    assert_impl_all!(Error: std::error::Error, Send, Sync);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-membership","src","lib.rs"],"content":"//! Cluster membership and failure detection.\n//!\n//! Implements SWIM-based failure detection with configurable suspicion\n//! and failure timeouts, plus a push-pull gossip protocol for\n//! disseminating membership state across the cluster.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod error;\nmod membership;\n\npub use error::{Error, Result};\npub use membership::{Membership, MembershipEvent};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-membership","src","membership.rs"],"content":"//! Cluster membership state machine.\n//!\n//! Tracks the state of every known node in the cluster. Node states\n//! transition through ALIVE → SUSPECT → DEAD (failure) or\n//! ALIVE → LEAVING → LEFT (graceful leave).\n\nuse std::collections::HashMap;\n\nuse oceanfs_core::{NodeId, NodeState};\nuse tokio::sync::broadcast;\n\nuse crate::error::{Error, Result};\n\n/// An event emitted when a node's state changes.\n#[derive(Debug, Clone)]\npub struct MembershipEvent {\n    /// The node whose state changed.\n    pub node_id: NodeId,\n    /// Previous state.\n    pub old_state: NodeState,\n    /// New state.\n    pub new_state: NodeState,\n}\n\n/// Cluster membership tracker with state-change broadcasting.\npub struct Membership {\n    /// Current state of each known node.\n    states: parking_lot::RwLock\u003cHashMap\u003cNodeId, NodeState\u003e\u003e,\n    /// Broadcast channel for state-change events.\n    tx: broadcast::Sender\u003cMembershipEvent\u003e,\n}\n\nimpl Membership {\n    /// Creates a new empty membership.\n    pub fn new() -\u003e Self {\n        let (tx, _) = broadcast::channel(256);\n        Self { states: parking_lot::RwLock::new(HashMap::new()), tx }\n    }\n\n    /// Adds or updates a node.\n    pub fn add_node(\u0026self, node_id: NodeId, state: NodeState) {\n        let mut states = self.states.write();\n        let old = states.insert(node_id.clone(), state);\n        if old != Some(state) {\n            let _ = self.tx.send(MembershipEvent {\n                node_id,\n                old_state: old.unwrap_or(NodeState::Alive),\n                new_state: state,\n            });\n        }\n    }\n\n    /// Transitions a node to a new state.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`Error::NodeNotFound`] if the node is not in the membership.\n    pub fn transition(\u0026self, node_id: \u0026NodeId, new_state: NodeState) -\u003e Result\u003c()\u003e {\n        let mut states = self.states.write();\n        let old_state =\n            states.get(node_id).copied().ok_or_else(|| Error::NodeNotFound(node_id.to_string()))?;\n\n        if old_state != new_state {\n            states.insert(node_id.clone(), new_state);\n            let _ =\n                self.tx.send(MembershipEvent { node_id: node_id.clone(), old_state, new_state });\n        }\n        Ok(())\n    }\n\n    /// Returns all known nodes and their states.\n    pub fn nodes(\u0026self) -\u003e Vec\u003c(NodeId, NodeState)\u003e {\n        self.states.read().iter().map(|(id, state)| (id.clone(), *state)).collect()\n    }\n\n    /// Returns the state of a specific node.\n    pub fn state_of(\u0026self, node_id: \u0026NodeId) -\u003e Option\u003cNodeState\u003e {\n        self.states.read().get(node_id).copied()\n    }\n\n    /// Subscribes to membership change events.\n    pub fn subscribe(\u0026self) -\u003e broadcast::Receiver\u003cMembershipEvent\u003e {\n        self.tx.subscribe()\n    }\n\n    /// Removes a node from membership.\n    pub fn remove(\u0026self, node_id: \u0026NodeId) {\n        self.states.write().remove(node_id);\n    }\n}\n\nimpl Default for Membership {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn add_and_retrieve_node() {\n        let m = Membership::new();\n        m.add_node(NodeId::new(\"n1\"), NodeState::Alive);\n        let nodes = m.nodes();\n        assert_eq!(nodes.len(), 1);\n        assert_eq!(nodes[0].1, NodeState::Alive);\n    }\n\n    #[test]\n    fn transition_emits_event() {\n        let m = Membership::new();\n        m.add_node(NodeId::new(\"n1\"), NodeState::Alive);\n        let mut rx = m.subscribe();\n\n        m.transition(\u0026NodeId::new(\"n1\"), NodeState::Suspect).unwrap();\n        let event = rx.try_recv().unwrap();\n        assert_eq!(event.old_state, NodeState::Alive);\n        assert_eq!(event.new_state, NodeState::Suspect);\n    }\n\n    #[test]\n    fn state_of_returns_none_for_unknown() {\n        let m = Membership::new();\n        assert!(m.state_of(\u0026NodeId::new(\"ghost\")).is_none());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-network","src","lib.rs"],"content":"//! Internal networking and gRPC transport.\n//!\n//! Manages a persistent connection pool of gRPC channels per peer node,\n//! with HTTP/2 multiplexing, keepalive, and idle eviction. Provides the\n//! `RpcClient` trait for service-specific stubs.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod pool;\n\npub use pool::ConnectionPool;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-network","src","pool.rs"],"content":"//! Persistent gRPC connection pool per peer node.\n\n/// Error type for connection pool operations.\n#[derive(Debug, thiserror::Error)]\n#[allow(dead_code)]\npub enum Error {\n    #[error(\"no available connections for peer {0}\")]\n    NoConnection(String),\n\n    #[error(\"connection failed: {0}\")]\n    ConnectionFailed(String),\n}\n\n/// A pool of gRPC channels per peer node.\npub struct ConnectionPool {\n    _pool_size: usize,\n}\n\nimpl ConnectionPool {\n    /// Creates a new connection pool with the given maximum size per peer.\n    pub fn new(pool_size: usize) -\u003e Self {\n        Self { _pool_size: pool_size }\n    }\n\n    /// Returns the maximum number of channels per peer.\n    pub fn pool_size(\u0026self) -\u003e usize {\n        self._pool_size\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn pool_creation() {\n        let pool = ConnectionPool::new(4);\n        assert_eq!(pool.pool_size(), 4);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-node","src","lib.rs"],"content":"//! OceanFS node — composition root.\n//!\n//! Wires together all concrete implementations from the subsystem crates\n//! (storage, routing, membership, networking, caching) and starts the\n//! server. This is the **only** crate that imports concrete types across\n//! subsystem boundaries.\n//!\n//! # Background Tasks\n//!\n//! Manages long-running background operations: healing, scrubbing,\n//! garbage collection, anti-entropy, and gossip protocol.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-routing","src","error.rs"],"content":"//! OceanFS routing error types.\n\n/// Routing errors.\n#[derive(Debug, thiserror::Error)]\npub enum Error {\n    /// The ring is empty (no nodes).\n    #[error(\"ring is empty\")]\n    RingEmpty,\n\n    /// A node was not found in the ring.\n    #[error(\"node not found in ring: {0}\")]\n    NodeNotFound(String),\n\n    /// Invalid ring configuration.\n    #[error(\"invalid ring config: {0}\")]\n    InvalidConfig(String),\n}\n\n/// Convenience result alias.\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n\n#[cfg(test)]\nmod assertions {\n    use static_assertions::assert_impl_all;\n\n    use super::Error;\n    assert_impl_all!(Error: std::error::Error, Send, Sync);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-routing","src","hash.rs"],"content":"//! Key hashing — SHA-256 for ring positioning.\n\nuse sha2::{Digest, Sha256};\n\n/// Hashes a key with SHA-256, producing a 32-byte ring position.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_routing::hash_key;\n///\n/// let hash = hash_key(b\"photos/cat.jpg\");\n/// assert_eq!(hash.len(), 32);\n/// ```\npub fn hash_key(key: \u0026[u8]) -\u003e [u8; 32] {\n    let mut hasher = Sha256::new();\n    hasher.update(key);\n    let result = hasher.finalize();\n    let mut out = [0u8; 32];\n    out.copy_from_slice(\u0026result);\n    out\n}\n\n/// Hashes a node identifier for virtual node placement on the ring.\npub(crate) fn hash_node(node_id: \u0026str, vnode_index: u32) -\u003e [u8; 32] {\n    let mut hasher = Sha256::new();\n    hasher.update(node_id.as_bytes());\n    hasher.update(b\":\");\n    hasher.update(vnode_index.to_le_bytes());\n    let result = hasher.finalize();\n    let mut out = [0u8; 32];\n    out.copy_from_slice(\u0026result);\n    out\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn same_key_produces_same_hash() {\n        let h1 = hash_key(b\"hello\");\n        let h2 = hash_key(b\"hello\");\n        assert_eq!(h1, h2);\n    }\n\n    #[test]\n    fn different_keys_produce_different_hashes() {\n        let h1 = hash_key(b\"hello\");\n        let h2 = hash_key(b\"world\");\n        assert_ne!(h1, h2);\n    }\n\n    #[test]\n    fn node_hashes_are_unique_per_index() {\n        let h1 = hash_node(\"node-1\", 0);\n        let h2 = hash_node(\"node-1\", 1);\n        assert_ne!(h1, h2);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-routing","src","lib.rs"],"content":"//! Distributed hash table routing.\n//!\n//! Implements the 256-bit consistent hashing ring with virtual nodes.\n//! Routes blob keys to their N replica successors in O(log N) time via\n//! binary search. The ring topology is cached with [`arc_swap::ArcSwap`]\n//! for wait-free reads.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod error;\nmod hash;\nmod ring;\nmod ring_cache;\n\npub use error::{Error, Result};\npub use hash::hash_key;\npub use ring::Ring;\npub use ring_cache::RingCache;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-routing","src","ring.rs"],"content":"//! Consistent hashing ring with virtual nodes.\n//!\n//! Maps keys to node replica sets using a 256-bit ring with virtual nodes.\n//! Lookup is O(log N) via binary search on a sorted BTreeMap.\n\nuse std::collections::BTreeMap;\n\nuse oceanfs_core::{NodeId, RingConfig, VnodeRange};\n\nuse crate::{\n    error::{Error, Result},\n    hash::hash_node,\n};\n\n/// Key position on the ring (256-bit hash).\ntype RingPosition = [u8; 32];\n\n/// A consistent hashing ring with virtual nodes.\n///\n/// Each physical node owns `vnodes_per_node` virtual positions.\n/// Key lookups find the N successors starting from the key's hash position.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::{NodeId, RingConfig};\n/// use oceanfs_routing::Ring;\n///\n/// let config = RingConfig { vnodes_per_node: 64, replication_factor: 3 };\n/// let mut ring = Ring::new(config);\n/// ring.add_node(NodeId::new(\"node-1\"));\n/// ring.add_node(NodeId::new(\"node-2\"));\n/// ring.add_node(NodeId::new(\"node-3\"));\n///\n/// let successors = ring.lookup(\u0026[0u8; 32]);\n/// assert_eq!(successors.len(), 3);\n/// ```\npub struct Ring {\n    /// Sorted map from ring position → node ID.\n    positions: BTreeMap\u003cRingPosition, NodeId\u003e,\n    /// Ring configuration.\n    config: RingConfig,\n    /// Set of known node IDs.\n    node_ids: Vec\u003cNodeId\u003e,\n}\n\nimpl Ring {\n    /// Creates an empty ring with the given configuration.\n    pub fn new(config: RingConfig) -\u003e Self {\n        Self { positions: BTreeMap::new(), config, node_ids: Vec::new() }\n    }\n\n    /// Adds a node to the ring, creating `vnodes_per_node` virtual positions.\n    ///\n    /// Returns the key ranges affected by this addition (for data migration).\n    pub fn add_node(\u0026mut self, node: NodeId) -\u003e Vec\u003cVnodeRange\u003e {\n        let mut ranges = Vec::new();\n\n        for i in 0..self.config.vnodes_per_node {\n            let pos = hash_node(node.as_str(), i);\n            self.positions.insert(pos, node.clone());\n            ranges.push(VnodeRange { start: pos, end: pos });\n        }\n\n        if !self.node_ids.contains(\u0026node) {\n            self.node_ids.push(node);\n        }\n\n        ranges\n    }\n\n    /// Removes a node and all its virtual positions from the ring.\n    ///\n    /// Returns the key ranges affected by this removal.\n    ///\n    /// # Errors\n    ///\n    /// Returns [`Error::NodeNotFound`] if the node is not in the ring.\n    pub fn remove_node(\u0026mut self, node: NodeId) -\u003e Result\u003cVec\u003cVnodeRange\u003e\u003e {\n        let mut ranges = Vec::new();\n        let mut positions_to_remove = Vec::new();\n\n        for (\u0026pos, n) in \u0026self.positions {\n            if n == \u0026node {\n                positions_to_remove.push(pos);\n                ranges.push(VnodeRange { start: pos, end: pos });\n            }\n        }\n\n        if positions_to_remove.is_empty() {\n            return Err(Error::NodeNotFound(node.to_string()));\n        }\n\n        for pos in positions_to_remove {\n            self.positions.remove(\u0026pos);\n        }\n\n        self.node_ids.retain(|n| n != \u0026node);\n\n        Ok(ranges)\n    }\n\n    /// Looks up the N successors for a key hash.\n    ///\n    /// Returns `replication_factor` distinct node IDs. If the ring has\n    /// fewer nodes than the replication factor, returns all nodes.\n    pub fn lookup(\u0026self, key_hash: \u0026[u8; 32]) -\u003e Vec\u003cNodeId\u003e {\n        if self.positions.is_empty() {\n            return Vec::new();\n        }\n\n        let mut result = Vec::with_capacity(self.config.replication_factor as usize);\n        let mut seen = std::collections::HashSet::new();\n\n        // Convert positions to a sorted vec for range iteration.\n        let entries: Vec\u003c(\u0026RingPosition, \u0026NodeId)\u003e = self.positions.iter().collect();\n\n        // Find start index: first entry with position \u003e= key_hash.\n        let start_idx = entries.partition_point(|(pos, _)| pos \u003c \u0026key_hash);\n\n        // Iterate from start_idx, wrapping around.\n        for i in 0..entries.len() {\n            let idx = (start_idx + i) % entries.len();\n            let node = entries[idx].1;\n            if seen.insert((*node).clone()) {\n                result.push((*node).clone());\n                if result.len() \u003e= self.config.replication_factor as usize {\n                    break;\n                }\n            }\n        }\n\n        result\n    }\n\n    /// Returns the number of physical nodes in the ring.\n    pub fn node_count(\u0026self) -\u003e usize {\n        self.node_ids.len()\n    }\n\n    /// Returns a reference to the ring configuration.\n    pub fn config(\u0026self) -\u003e \u0026RingConfig {\n        \u0026self.config\n    }\n\n    /// Returns all node IDs in the ring.\n    pub fn nodes(\u0026self) -\u003e \u0026[NodeId] {\n        \u0026self.node_ids\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    fn test_config() -\u003e RingConfig {\n        RingConfig { vnodes_per_node: 16, replication_factor: 3 }\n    }\n\n    #[test]\n    fn empty_ring_lookup_returns_empty() {\n        let ring = Ring::new(test_config());\n        assert!(ring.lookup(\u0026[0u8; 32]).is_empty());\n    }\n\n    #[test]\n    fn single_node_ring_lookup_returns_that_node() {\n        let mut ring = Ring::new(test_config());\n        ring.add_node(NodeId::new(\"n1\"));\n        let result = ring.lookup(\u0026[0u8; 32]);\n        assert!(!result.is_empty());\n        // With 1 node, can't return 3 distinct successors.\n        assert!(result.iter().all(|n| n.as_str() == \"n1\"));\n    }\n\n    #[test]\n    fn lookup_returns_distinct_nodes() {\n        let mut ring = Ring::new(RingConfig { vnodes_per_node: 32, replication_factor: 3 });\n        ring.add_node(NodeId::new(\"a\"));\n        ring.add_node(NodeId::new(\"b\"));\n ically via `ArcSwap` without\n//! blocking writers.\n\nuse std::sync::Arc;\n\nuse arc_swap::ArcSwap;\nuse oceanfs_core::NodeId;\n\nuse crate::ring::Ring;\n\n/// A wait-free cache for the consistent hashing ring.\n///\n/// Readers call [`Self::lookup`] without any lock acquisition. Writers call\n/// [`Self::update`] to swap in a new ring topology atomically.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::RingConfig;\n/// use oceanfs_routing::{Ring, RingCache};\n///\n/// let config = RingConfig::default();\n/// let ring = Ring::new(config);\n/// let cache = RingCache::new(ring);\n/// let successors = cache.lookup(\u0026[0u8; 32]);\n/// ```\npub struct RingCache {\n    inner: ArcSwap\u003cRing\u003e,\n}\n\nimpl RingCache {\n    /// Creates a new ring cache from an initial ring.\n    pub fn new(ring: Ring) -\u003e Self {\n        Self { inner: ArcSwap::new(Arc::new(ring)) }\n    }\n\n    /// Looks up the N successors for a key hash.\n    ///\n    /// Wait-free — readers never block.\n    pub fn lookup(\u0026self, key_hash: \u0026[u8; 32]) -\u003e Vec\u003cNodeId\u003e {\n        self.inner.load().lookup(key_hash)\n    }\n\n    /// Atomically replaces the ring with a new topology.\n    ///\n    /// All subsequent [`Self::lookup`] calls will see the new ring.\n    pub fn update(\u0026self, ring: Ring) {\n        self.inner.store(Arc::new(ring));\n    }\n\n    /// Returns a snapshot of the current ring (for serialization).\n    pub fn snapshot(\u0026self) -\u003e Arc\u003cRing\u003e {\n        self.inner.load_full()\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::RingConfig;\n\n    use super::*;\n\n    fn make_ring() -\u003e Ring {\n        let mut ring = Ring::new(RingConfig { vnodes_per_node: 16, replication_factor: 3 });\n        ring.add_node(NodeId::new(\"a\"));\n        ring.add_node(NodeId::new(\"b\"));\n        ring\n    }\n\n    #[test]\n    fn cache_lookup_matches_ring() {\n        let ring = make_ring();\n        let expected = ring.lookup(\u0026[1u8; 32]);\n        let cache = RingCache::new(ring);\n        assert_eq!(cache.lookup(\u0026[1u8; 32]), expected);\n    }\n\n    #[test]\n    fn update_changes_lookup_result() {\n        let ring1 = make_ring();\n        let cache = RingCache::new(ring1);\n        let before = cache.lookup(\u0026[1u8; 32]);\n\n        let mut ring2 = Ring::new(RingConfig { vnodes_per_node: 16, replication_factor: 3 });\n        ring2.add_node(NodeId::new(\"z\"));\n        cache.update(ring2);\n\n        let after = cache.lookup(\u0026[1u8; 32]);\n        assert_ne!(before, after);\n    }\n\n    #[test]\n    fn snapshot_returns_readable_ring() {\n        let ring = make_ring();\n        let cache = RingCache::new(ring);\n        let snap = cache.snapshot();\n        assert_eq!(snap.node_count(), 2);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","admin.rs"],"content":"//! Admin API — cluster health, segment status, cache stats, and metrics.\n\n/// Response for GET /admin/cluster.\n#[derive(Debug, Clone, serde::Serialize)]\npub struct ClusterView {\n    /// Nodes in the cluster with their states.\n    pub nodes: Vec\u003cNodeInfo\u003e,\n    /// Total virtual node count.\n    pub vnodes: usize,\n}\n\n/// Information about a single node in the cluster.\n#[derive(Debug, Clone, serde::Serialize)]\npub struct NodeInfo {\n    /// Node identifier.\n    pub id: String,\n    /// Current state.\n    pub state: String,\n}\n\n/// Response for GET /admin/segments.\n#[derive(Debug, Clone, serde::Serialize)]\npub struct SegmentReport {\n    /// Total segment count.\n    pub total: u64,\n    /// Sealed segments.\n    pub sealed: u64,\n    /// Unsealed active segments.\n    pub unsealed: u64,\n}\n\n/// Admin API handler.\npub struct AdminHandler;\n\nimpl AdminHandler {\n    /// Creates a new admin handler.\n    pub fn new() -\u003e Self {\n        Self\n    }\n\n    /// Returns the cluster view.\n    pub fn cluster_view(\u0026self) -\u003e ClusterView {\n        ClusterView { nodes: Vec::new(), vnodes: 0 }\n    }\n\n    /// Returns a segment report.\n    pub fn segment_report(\u0026self) -\u003e SegmentReport {\n        SegmentReport { total: 0, sealed: 0, unsealed: 0 }\n    }\n}\n\nimpl Default for AdminHandler {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn cluster_view_is_empty_by_default() {\n        let handler = AdminHandler::new();\n        let view = handler.cluster_view();\n        assert!(view.nodes.is_empty());\n    }\n\n    #[test]\n    fn segment_report_is_zero_by_default() {\n        let handler = AdminHandler::new();\n        let report = handler.segment_report();\n        assert_eq!(report.total, 0);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","bucket_config.rs"],"content":"//! Bucket-level configuration and per-bucket policy.\n\nuse std::{collections::HashMap, sync::Arc};\n\nuse parking_lot::RwLock;\n\n/// Per-bucket configuration policy.\n#[derive(Debug, Clone)]\npub struct BucketPolicy {\n    /// Write quorum size.\n    pub write_quorum: u8,\n    /// Read quorum size.\n    pub read_quorum: u8,\n    /// Total replicas.\n    pub total_replicas: u8,\n    /// Inline threshold in bytes.\n    pub inline_threshold_bytes: u64,\n}\n\nimpl Default for BucketPolicy {\n    fn default() -\u003e Self {\n        Self { write_quorum: 2, read_quorum: 1, total_replicas: 3, inline_threshold_bytes: 4096 }\n    }\n}\n\n/// A store for per-bucket configuration policies.\npub struct BucketConfigStore {\n    policies: RwLock\u003cHashMap\u003cString, Arc\u003cBucketPolicy\u003e\u003e\u003e,\n}\n\nimpl BucketConfigStore {\n    /// Creates a new empty config store.\n    pub fn new() -\u003e Self {\n        Self { policies: RwLock::new(HashMap::new()) }\n    }\n\n    /// Creates or updates a bucket policy.\n    pub fn put(\u0026self, bucket: String, policy: BucketPolicy) {\n        self.policies.write().insert(bucket, Arc::new(policy));\n    }\n\n    /// Retrieves a bucket policy, or returns the default if not found.\n    pub fn get(\u0026self, bucket: \u0026str) -\u003e Arc\u003cBucketPolicy\u003e {\n        self.policies\n            .read()\n            .get(bucket)\n            .cloned()\n            .unwrap_or_else(|| Arc::new(BucketPolicy::default()))\n    }\n\n    /// Deletes a bucket policy.\n    pub fn delete(\u0026self, bucket: \u0026str) -\u003e bool {\n        self.policies.write().remove(bucket).is_some()\n    }\n\n    /// Lists all configured bucket names.\n    pub fn list(\u0026self) -\u003e Vec\u003cString\u003e {\n        self.policies.read().keys().cloned().collect()\n    }\n}\n\nimpl Default for BucketConfigStore {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn put_and_get_policy() {\n        let store = BucketConfigStore::new();\n        store.put(\"my-bucket\".into(), BucketPolicy { write_quorum: 3, ..Default::default() });\n        let policy = store.get(\"my-bucket\");\n        assert_eq!(policy.write_quorum, 3);\n    }\n\n    #[test]\n    fn get_missing_returns_default() {\n        let store = BucketConfigStore::new();\n        let policy = store.get(\"nonexistent\");\n        assert_eq!(policy.write_quorum, 2); // default\n    }\n\n    #[test]\n    fn delete_removes_policy() {\n        let store = BucketConfigStore::new();\n        store.put(\"temp\".into(), BucketPolicy::default());\n        assert!(store.delete(\"temp\"));\n        assert!(!store.delete(\"temp\"));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","error.rs"],"content":"/// Server error types.\n#[derive(Debug, thiserror::Error)]\n#[allow(dead_code)]\npub enum Error {\n    /// No reachable node for the given key.\n    #[error(\"no reachable node for key\")]\n    NoReachableNode,\n\n    /// A routing error occurred.\n    #[error(\"routing error: {0}\")]\n    Routing(String),\n}\n\n/// Convenience result alias.\n#[allow(dead_code)]\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","hinted_handoff.rs"],"content":"//! Hinted handoff — buffers writes for unreachable nodes.\n\nuse oceanfs_core::{NodeId, WriteAck};\n\n/// Stores a hinted write for a temporarily unreachable node.\n#[derive(Debug, Clone)]\npub struct HintedHandoff {\n    _hints: Vec\u003cHintRecord\u003e,\n}\n\n/// A buffered write intended for a specific node.\n#[derive(Debug, Clone)]\n#[allow(dead_code)]\npub struct HintRecord {\n    /// The node this write was intended for.\n    pub intended_for: NodeId,\n    /// The write acknowledgment data.\n    pub ack: WriteAck,\n}\n\nimpl HintedHandoff {\n    /// Creates a new empty hinted handoff buffer.\n    pub fn new() -\u003e Self {\n        Self { _hints: Vec::new() }\n    }\n\n    /// Returns the number of pending hints.\n    pub fn pending_count(\u0026self) -\u003e usize {\n        self._hints.len()\n    }\n}\n\nimpl Default for HintedHandoff {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn new_handoff_is_empty() {\n        let hh = HintedHandoff::new();\n        assert_eq!(hh.pending_count(), 0);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","lib.rs"],"content":"//! S3-compatible HTTP server and request coordinators.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod admin;\nmod bucket_config;\nmod error;\nmod hinted_handoff;\nmod read_coordinator;\nmod router;\nmod s3_handler;\nmod write_coordinator;\n\npub use admin::AdminHandler;\npub use bucket_config::{BucketConfigStore, BucketPolicy};\npub use error::{Error, Result};\npub use hinted_handoff::HintedHandoff;\npub use read_coordinator::{ReadCoordinator, ReadRequest, ReadResult};\npub use router::Router;\npub use s3_handler::S3Handler;\npub use write_coordinator::{WriteCoordinator, WriteRequest};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","read_coordinator.rs"],"content":"//! Read coordinator — parallel shard fetch and blob reconstruction.\n\nuse oceanfs_core::{BucketId, ObjectKey, ObjectMetadata};\n\nuse crate::router::HashKey;\n\n/// A request to read an object.\n#[derive(Debug, Clone)]\npub struct ReadRequest {\n    /// Source bucket.\n    pub bucket: BucketId,\n    /// Object key.\n    pub key: ObjectKey,\n    /// Pre-computed key hash.\n    pub hash_key: HashKey,\n}\n\n/// Result of a read operation.\n#[derive(Debug, Clone)]\npub struct ReadResult {\n    /// The object's data.\n    pub data: bytes::Bytes,\n    /// Metadata for the object.\n    pub metadata: ObjectMetadata,\n}\n\n/// Coordinates distributed blob reads with parallel shard fetch.\npub struct ReadCoordinator;\n\nimpl ReadCoordinator {\n    /// Creates a new read coordinator.\n    pub fn new() -\u003e Self {\n        Self\n    }\n\n    /// Executes a read. In Phase 4, this is a stub.\n    ///\n    /// # Errors\n    ///\n    /// Always returns `Routing(\"not implemented\")` in Phase 4.\n    pub async fn get(\u0026self, _req: ReadRequest) -\u003e crate::error::Result\u003cReadResult\u003e {\n        Err(crate::error::Error::Routing(\"not implemented\".into()))\n    }\ = self.ring.lookup(key.as_bytes());\n\n        let is_local = false; // In a real implementation, compare with local node ID.\n\n        RouteResponse {\n            is_local,\n            forward_target: if is_local { None } else { replica_set.first().cloned() },\n            replica_set,\n        }\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::{NodeId, RingConfig};\n    use oceanfs_routing::Ring;\n\n    use super::*;\n\n    #[test]\n    fn hash_key_deterministic() {\n        let k1 = HashKey::from_key(\u0026ObjectKey::new(\"a\"));\n        let k2 = HashKey::from_key(\u0026ObjectKey::new(\"a\"));\n        assert_eq!(k1.as_bytes(), k2.as_bytes());\n    }\n\n    #[test]\n    fn route_returns_replica_set() {\n        let mut ring = Ring::new(RingConfig { vnodes_per_node: 16, replication_factor: 3 });\n        ring.add_node(NodeId::new(\"a\"));\n        ring.add_node(NodeId::new(\"b\"));\n        ring.add_node(NodeId::new(\"c\"));\n\n        let cache = Arc::new(RingCache::new(ring));\n        let router = Router::new(cache);\n        let key = HashKey::from_key(\u0026ObjectKey::new(\"test\"));\n\n        let response = router.route(\u0026key);\n        assert!(!response.replica_set.is_empty());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","s3_handler.rs"],"content":"//! S3-compatible HTTP handlers.\n//!\n//! Implements PUT, GET, HEAD, DELETE, and LIST operations with\n//! S3-compatible XML responses.\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::error::{Error, Result};\n\n/// An S3-compatible HTTP handler.\n///\n/// In Phase 5, this provides a minimal request router for S3 operations.\n/// Full axum integration comes when the HTTP server is wired in Phase 5+.\npub struct S3Handler;\n\nimpl S3Handler {\n    /// Creates a new S3 handler.\n    pub fn new() -\u003e Self {\n        Self\n    }\n\n    /// Handles a PUT object request.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the bucket or key is invalid.\n    pub async fn put_object(\n        \u0026self,\n        _bucket: \u0026str,\n        _key: \u0026str,\n        _data: \u0026[u8],\n    ) -\u003e Result\u003cPutObjectResponse\u003e {\n        Ok(PutObjectResponse { etag: \"placeholder\".into() })\n    }\n\n    /// Handles a GET object request.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the object is not found.\n    pub async fn get_object(\u0026self, _bucket: \u0026str, _key: \u0026str) -\u003e Result\u003cGetObjectResponse\u003e {\n        Err(Error::Routing(\"object not found\".into()))\n    }\n\n    /// Handles a DELETE object request.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the bucket or key is invalid.\n    pub async fn delete_object(\u0026self, _bucket: \u0026str, _key: \u0026str) -\u003e Result\u003c()\u003e {\n        Ok(())\n    }\n\n    /// Lists objects in a bucket with an optional prefix.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if the bucket does not exist.\n    pub async fn list_objects(\u0026self, _bucket: \u0026str, _prefix: \u0026str) -\u003e Result\u003cListObjectsResponse\u003e {\n        Ok(ListObjectsResponse { contents: Vec::new(), is_truncated: false })\n    }\n}\n\nimpl Default for S3Handler {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Response for a PUT operation.\n#[derive(Debug, Clone)]\npub struct PutObjectResponse {\n    /// BLAKE3 hash of the object, hex-encoded.\n    pub etag: String,\n}\n\n/// Response for a GET operation.\n#[derive(Debug, Clone)]\npub struct GetObjectResponse {\n    /// The object's payload.\n    pub data: Vec\u003cu8\u003e,\n    /// Content type (default: application/octet-stream).\n    pub content_type: String,\n    /// ETag header value.\n    pub etag: String,\n}\n\n/// Response for a LIST operation.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ListObjectsResponse {\n    /// Objects matching the prefix.\n    #[serde(rename = \"Contents\")]\n    pub contents: Vec\u003cListObjectEntry\u003e,\n    /// Whether more results are available.\n    #[serde(rename = \"IsTruncated\")]\n    pub is_truncated: bool,\n}\n\n/// An object entry in a LIST response.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ListObjectEntry {\n    /// The object key.\n    #[serde(rename = \"Key\")]\n    pub key: String,\n    /// Object size in bytes.\n    #[serde(rename = \"Size\")]\n    pub size: u64,\n    /// ETag of the object.\n    #[serde(rename = \"ETag\")]\n    pub etag: String,\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn put_object_returns_etag() {\n        let handler = S3Handler::new();\n        let resp = tokio_test::block_on(handler.put_object(\"b\", \"k\", b\"data\")).unwrap();\n        assert!(!resp.etag.is_empty());\n    }\n\n    #[test]\n    fn get_nonexistent_returns_error() {\n        let handler = S3Handler::new();\n        let result = tokio_test::block_on(handler.get_object(\"b\", \"k\"));\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn delete_does_not_error() {\n        let handler = S3Handler::new();\n        assert!(tokio_test::block_on(handler.delete_object(\"b\", \"k\")).is_ok());\n    }\n\n    #[test]\n    fn list_returns_empty_when_no_objects() {\n        let handler = S3Handler::new();\n        let resp = tokio_test::block_on(handler.list_objects(\"b\", \"prefix\")).unwrap();\n        assert!(resp.contents.is_empty());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-server","src","write_coordinator.rs"],"content":"//! Distributed write coordinator with quorum-based replication.\n\nuse std::sync::Arc;\n\nuse bytes::Bytes;\nuse oceanfs_core::{BucketId, ChunkRef, HashOutput, ObjectKey, SegmentId, WriteResult};\nuse oceanfs_routing::RingCache;\n\nuse crate::router::HashKey;\n\n/// A request to write an object.\n#[derive(Debug, Clone)]\npub struct WriteRequest {\n    /// Target bucket.\n    pub bucket: BucketId,\n    /// Object key.\n    pub key: ObjectKey,\n    /// Pre-computed key hash.\n    pub hash_key: HashKey,\n    /// Object payload.\n    pub data: Bytes,\n    /// Expected quorum size for write acknowledgments.\n    pub write_quorum: u8,\n}\n\n/// Coordinates distributed blob writes with quorum replication.\n///\n/// Routes writes to the correct replica set, appends to the local\n/// segment, and collects W acknowledgments from replica nodes.\npub struct WriteCoordinator {\n    ring: Arc\u003cRingCache\u003e,\n    local_node_id: oceanfs_core::NodeId,\n}\n\nimpl WriteCoordinator {\n    /// Creates a new write coordinator.\n    pub fn new(ring: Arc\u003cRingCache\u003e, local_node_id: oceanfs_core::NodeId) -\u003e Self {\n        Self { ring, local_node_id }\n    }\n\n    /// Executes a distributed write.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error if routing fails or the quorum is not met.\n    pub async fn put(\u0026self, req: WriteRequest) -\u003e crate::error::Result\u003cWriteResult\u003e {\n        let replica_set = self.ring.lookup(req.hash_key.as_bytes());\n        let is_local = replica_set.first().map(|n| n == \u0026self.local_node_id).unwrap_or(false);\n\n        if !is_local \u0026\u0026 !replica_set.is_empty() {\n            // In full implementation: forward to the first successor.\n            // For Phase 4, we just proceed with local write.\n        }\n\n        let segment_id = SegmentId::new();\n        let offset = 0u64;\n        let length = req.data.len() as u32;\n        let chunks = {\n            let mut c = smallvec::SmallVec::new();\n            c.push(ChunkRef { segment_id, offset, length });\n            c\n        };\n\n        let result = WriteResult {\n            object_key: req.key,\n            chunks,\n            size: req.data.len() as u64,\n            blake3_hash: Some(HashOutput::from_bytes([0u8; 32])), // placeholder\n        };\n\n        Ok(result)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::RingConfig;\n    use oceanfs_routing::Ring;\n\n    use super::*;\n\n    #[test]\n    fn coordinator_put_returns_result() {\n        let mut ring = Ring::new(RingConfig::default());\n        ring.add_node(oceanfs_core::NodeId::new(\"n1\"));\n\n        let cache = Arc::new(RingCache::new(ring));\n        let coord = WriteCoordinator::new(cache, oceanfs_core::NodeId::new(\"n1\"));\n\n        let req = WriteRequest {\n            bucket: BucketId::new(\"test\"),\n            key: ObjectKey::new(\"obj\"),\n            hash_key: HashKey::from_key(\u0026ObjectKey::new(\"obj\")),\n            data: Bytes::from_static(b\"hello\"),\n            write_quorum: 1,\n        };\n\n        let result = tokio_test::block_on(coord.put(req)).unwrap();\n        assert_eq!(result.size, 5);\n        assert_eq!(result.chunks.len(), 1);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","anti_entropy.rs"],"content":"//! Anti-entropy — Merkle tree exchange for background data integrity.\n\nuse oceanfs_core::HashOutput;\n\n/// A Merkle tree over segment data.\n///\n/// Built at seal time. Leaves are 64 KB BLAKE3 hashes.\n/// Used for peer-to-peer integrity verification.\npub struct MerkleTree {\n    /// Merkle root hash.\n    root: HashOutput,\n    /// Number of leaf hashes.\n    leaf_count: u64,\n}\n\nimpl MerkleTree {\n    /// Builds a Merkle tree from leaf hashes.\n    ///\n    /// Returns `None` if the leaf list is empty.\n    pub fn build(leaf_hashes: \u0026[HashOutput]) -\u003e Option\u003cSelf\u003e {\n        if leaf_hashes.is_empty() {\n            return None;\n        }\n\n        let mut current_level: Vec\u003cHashOutput\u003e = leaf_hashes.to_vec();\n        let leaf_count = current_level.len() as u64;\n\n        while current_level.len() \u003e 1 {\n            let mut next_level = Vec::with_capacity(current_level.len().div_ceil(2));\n            for pair in current_level.chunks(2) {\n                let mut hasher = blake3::Hasher::new();\n                hasher.update(pair[0].as_bytes());\n                if pair.len() \u003e 1 {\n                    hasher.update(pair[1].as_bytes());\n                } else {\n                    hasher.update(pair[0].as_bytes()); // duplicate last if odd\n                }\n                let hash = hasher.finalize();\n                let mut bytes = [0u8; 32];\n                bytes.copy_from_slice(hash.as_bytes());\n                next_level.push(HashOutput::from_bytes(bytes));\n            }\n            current_level = next_level;\n        }\n\n        Some(Self { root: current_level[0], leaf_count })\n    }\n\n    /// Returns the Merkle root hash.\n    pub fn root(\u0026self) -\u003e HashOutput {\n        self.root\n    }\n\n    /// Returns the number of leaves.\n    pub fn leaf_count(\u0026self) -\u003e u64 {\n        self.leaf_count\n    }\n}\n\n/// Statistics from an anti-entropy cycle.\n#[derive(Debug, Default)]\n#[allow(dead_code)]\npub struct AntiEntropyStats {\n    /// Number of segments compared.\n    pub segments_compared: u64,\n    /// Number of segments with mismatched roots.\n    pub mismatches_found: u64,\n    /// Number of leaf divergences repaired.\n    pub leaves_repaired: u64,\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    fn make_hash(b: u8) -\u003e HashOutput {\n        let mut bytes = [0u8; 32];\n        bytes[0] = b;\n        HashOutput::from_bytes(bytes)\n    }\n\n    #[test]\n    fn empty_tree_returns_none() {\n        assert!(MerkleTree::build(\u0026[]).is_none());\n    }\n\n    #[test]\n    fn single_leaf_tree_has_leaf_as_root() {\n        let leaf = make_hash(42);\n        let tree = MerkleTree::build(\u0026[leaf]).unwrap();\n        assert_eq!(tree.root(), leaf);\n        assert_eq!(tree.leaf_count(), 1);\n    }\n\n    #[test]\n    fn two_leaf_tree_has_correct_root() {\n        let a = make_hash(1);\n        let b = make_hash(2);\n        let tree = MerkleTree::build(\u0026[a, b]).unwrap();\n        assert_eq!(tree.leaf_count(), 2);\n        // Root should be BLAKE3(a || b)\n        let mut hasher = blake3::Hasher::new();\n        hasher.update(a.as_bytes());\n        hasher.update(b.as_bytes());\n        let expected = hasher.finalize();\n        let mut exp_bytes = [0u8; 32];\n        exp_bytes.copy_from_slice(expected.as_bytes());\n        assert_eq!(tree.root(), HashOutput::from_bytes(exp_bytes));\n    }\n\n    #[test]\n    fn same_leaves_produce_same_root() {\n        let leaves = [make_hash(1), make_hash(2), make_hash(3)];\n        let t1 = MerkleTree::build(\u0026leaves).unwrap();\n        let t2 = MerkleTree::build(\u0026leaves).unwrap();\n        assert_eq!(t1.root(), t2.root());\n    }\n\n    #[test]\n    fn different_leaves_produce_different_root() {\n        let t1 = MerkleTree::build(\u0026[make_hash(1)]).unwrap();\n        let t2 = MerkleTree::build(\u0026[make_hash(2)]).unwrap();\n        assert_ne!(t1.root(), t2.root());\n    }\n}\n","traces":[{"line":20,"address":[6998286,6998262,6996624],"length":1,"stats":{"Line":1}},{"line":21,"address":[6996701],"length":1,"stats":{"Line":1}},{"line":22,"address":[6996780],"length":1,"stats":{"Line":1}},{"line":25,"address":[6996747],"length":1,"stats":{"Line":1}},{"line":26,"address":[6996840,6996757],"length":1,"stats":{"Line":4}},{"line":28,"address":[6996856,6997702],"length":1,"stats":{"Line":4}},{"line":29,"address":[6996918,6997144],"length":1,"stats":{"Line":2}},{"line":30,"address":[6997272,6997204],"length":1,"stats":{"Line":2}},{"line":31,"address":[6997494],"length":1,"stats":{"Line":1}},{"line":32,"address":[6997818,6997712],"length":1,"stats":{"Line":2}},{"line":33,"address":[6997847],"length":1,"stats":{"Line":1}},{"line":34,"address":[6997872,6997998]
