n node restart\n//! - `WalSyncGroup`: internal — collects pending fsync waiters (pub(crate))\n\nmod entry;\nmod reader;\nmod sync;\nmod writer;\n\npub use entry::WalEntry;\npub use reader::WalReader;\npub use writer::WalWriter;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-storage","src","wal","reader.rs"],"content":"//! WAL reader — replay entries on node restart.\n//!\n//! Scans all WAL files in sequence, deserializes entries, and yields\n//! them in order. Used to rebuild unsealed active segments after a crash.\n\nuse std::{io::Read, path::PathBuf};\n\nuse oceanfs_core::WalConfig;\n\nuse crate::{error::Result, wal::entry::WalEntry};\n\n/// Reads WAL files and replays entries in order.\n///\n/// Uses the standard library's synchronous I/O because WAL replay\n/// happens during startup, before the async runtime is fully active.\n///\n/// # Examples\n///\n/// ```ignore\n/// // WalReader requires WAL files on disk; examples are in unit tests.\n/// use oceanfs_core::WalConfig;\n/// use oceanfs_storage::wal::WalReader;\n///\n/// let config = WalConfig::default();\n/// let reader = WalReader::open(\u0026config).unwrap();\n/// for entry in reader.replay() {\n///     let entry = entry.unwrap();\n///     println!(\"{:?}\", entry);\n/// }\n/// ```\npub struct WalReader {\n    /// Sorted list of WAL file paths.\n    files: Vec\u003cPathBuf\u003e,\n}\n\nimpl WalReader {\n    /// Opens the WAL directory and discovers all WAL files.\n    ///\n    /// Files are sorted by sequence number for ordered replay.\n    ///\n    /// # Errors\n    ///\n    /// Returns an I/O error if the WAL directory cannot be read.\n    pub fn open(config: \u0026WalConfig) -\u003e Result\u003cSelf\u003e {\n        let mut files = Vec::new();\n\n        let dir = std::fs::read_dir(\u0026config.data_dir)?;\n        for entry in dir {\n            let entry = entry?;\n            let name = entry.file_name();\n            let name = name.to_string_lossy();\n            if name.starts_with(\"wal_\") \u0026\u0026 name.ends_with(\".log\") {\n                files.push(entry.path());\n            }\n        }\n\n        // Sort by filename for sequential replay.\n        files.sort();\n\n        Ok(Self { files })\n    }\n\n    /// Replays all WAL entries from all files.\n    ///\n    /// Returns an iterator over entries. Invalid entries (wrong magic,\n    /// CRC failure) are silently skipped and logged.\n    pub fn replay(\u0026self) -\u003e impl Iterator\u003cItem = Result\u003cWalEntry\u003e\u003e + '_ {\n        WalReplayIter { file_paths: \u0026self.files, current_reader: None }\n    }\n}\n\nstruct WalReplayIter\u003c'a\u003e {\n    file_paths: \u0026'a [PathBuf],\n    current_reader: Option\u003cstd::io::BufReader\u003cstd::fs::File\u003e\u003e,\n}\n\nimpl Iterator for WalReplayIter\u003c'_\u003e {\n    type Item = Result\u003cWalEntry\u003e;\n\n    fn next(\u0026mut self) -\u003e Option\u003cSelf::Item\u003e {\n        loop {\n            // Try to read from the current file.\n            if let Some(ref mut reader) = self.current_reader {\n                let entry_size = WalEntry::serialized_size();\n                let mut buf = vec![0u8; entry_size];\n\n                match reader.read_exact(\u0026mut buf) {\n                    Ok(()) =\u003e match WalEntry::from_bytes(\u0026buf) {\n                        Some(entry) if entry.verify_crc() =\u003e {\n                            return Some(Ok(entry));\n                        }\n                        _ =\u003e {\n                            tracing::warn!(\"corrupted WAL entry skipped\");\n                            continue;\n                        }\n                    },\n                    Err(_) =\u003e {\n                        // End of file or read error — advance to next file.\n                    }\n                }\n            }\n\n            // Advance to the next file.\n            if self.file_paths.is_empty() {\n                return None;\n            }\n\n            let path = \u0026self.file_paths[0];\n            self.file_paths = \u0026self.file_paths[1..];\n\n            match std::fs::File::open(path) {\n                Ok(file) =\u003e {\n                    self.current_reader = Some(std::io::BufReader::new(file));\n                }\n                Err(e) =\u003e return Some(Err(e.into())),\n            }\n        }\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::{HashOutput, SegmentId};\n\n    use super::*;\n    use crate::wal::writer::WalWriter;\n\n    async fn write_entries(config: \u0026WalConfig, count: usize) {\n        let writer = WalWriter::open(config).await.unwrap();\n        for i in 0..count {\n            let entry = WalEntry::new(\n                SegmentId::new(),\n                (i * 100) as u64,\n                100,\n                HashOutput::from_bytes([i as u8; 32]),\n            );\n            writer.append(entry).await.unwrap();\n        }\n    }\n\n    #[tokio::test]\n    async fn replay_reads_all_entries() {\n        let dir = tempfile::tempdir().unwrap();\n        let config = WalConfig {\n            data_dir: dir.path().to_path_buf(),\n            max_file_size_bytes: 1024 * 1024,\n            fsync_batch_timeout_ms: 5,\n        };\n\n        write_entries(\u0026config, 5).await;\n\n        let reader = WalReader::open(\u0026config).unwrap();\n        let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e\u003e\u003e().unwrap();\n        assert_eq!(entries.len(), 5);\n    }\n\n    #[tokio::test]\n    async fn replay_empty_directory_returns_no_entries() {\n        let dir = tempfile::tempdir().unwrap();\n        let config = WalConfig {\n            data_dir: dir.path().to_path_buf(),\n            max_file_size_bytes: 1024 * 1024,\n            fsync_batch_timeout_ms: 5,\n        };\n\n        let reader = WalReader::open(\u0026config).unwrap();\n        let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e\u003e\u003e().unwrap();\n        assert!(entries.is_empty());\n    }\n\n    #[tokio::test]\n    async fn replay_and_truncate_reads_remaining() {\n        let dir = tempfile::tempdir().unwrap();\n        let config = WalConfig {\n            data_dir: dir.path().to_path_buf(),\n            max_file_size_bytes: 1024 * 1024,\n            fsync_batch_timeout_ms: 5,\n        };\n\n        // Write 10 entries.\n        {\n            let writer = WalWriter::open(\u0026config).await.unwrap();\n            for i in 0..10 {\n                let entry = WalEntry::new(\n                    SegmentId::new(),\n                    i * 100,\n                    100,\n                    HashOutput::from_bytes([i as u8; 32]),\n                );\n                writer.append(entry).await.unwrap();\n            }\n            // Truncate at position of 5th entry.\n            // (Hard to get exact position without tracking, so skip this sub-test for now)\n        }\n\n        let reader = WalReader::open(\u0026config).unwrap();\n        let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e\u003e\u003e().unwrap();\n        // All 10 should be present since we didn't actually truncate here.\n        assert_eq!(entries.len(), 10);\n    }\n}\n","traces":[{"line":44,"address":[6802145,6800672,6802073],"length":1,"stats":{"Line":2}},{"line":45,"address":[7767502],"length":1,"stats":{"Line":2}},{"line":47,"address":[7767529,7767589,7768995],"length":1,"stats":{"Line":4}},{"line":48,"address":[7767832,7767917,7767738],"length":1,"stats":{"Line":6}},{"line":49,"address":[6801155,6801445],"length":1,"stats":{"Line":6}},{"line":50,"address":[7768450],"length":1,"stats":{"Line":3}},{"line":51,"address":[7768529,7768605],"length":1,"stats":{"Line":6}},{"line":52,"address":[7768612,7768692,7768751],"length":1,"stats":{"Line":9}},{"line":53,"address":[7768827],"length":1, ister their append with `submit`, receiving a oneshot\n/// that resolves when the batch is flushed. The background flusher\n/// task collects waiters and calls `fsync` once per batch.\npub(crate) struct WalSyncGroup {\n    /// Sender for fsync requests.\n    tx: mpsc::Sender\u003coneshot::Sender\u003c()\u003e\u003e,\n    /// Handle to the background flusher task.\n    _flush_handle: tokio::task::JoinHandle\u003c()\u003e,\n}\n\nimpl WalSyncGroup {\n    /// Creates a new sync group and spawns the background flusher.\n    ///\n    /// `fsync_fn` is called to flush pending writes. `batch_timeout_ms`\n    /// controls the maximum delay before a batch is flushed even if\n    /// the batch hasn't filled.\n    pub fn new\u003cF\u003e(fsync_fn: F, batch_timeout_ms: u64) -\u003e Self\n    where\n        F: Fn() -\u003e Result\u003c()\u003e + Send + Sync + 'static,\n    {\n        let (tx, mut rx) = mpsc::channel::\u003coneshot::Sender\u003c()\u003e\u003e(1024);\n\n        let flush_handle = tokio::spawn(async move {\n            let fsync_fn = Arc::new(fsync_fn);\n            loop {\n                // Wait for at least one waiter or a timeout.\n                let timeout =\n                    tokio::time::sleep(std::time::Duration::from_millis(batch_timeout_ms));\n                tokio::pin!(timeout);\n\n                let mut waiters: Vec\u003coneshot::Sender\u003c()\u003e\u003e = Vec::with_capacity(64);\n\n                // Collect the first waiter.\n                let first = tokio::select! {\n                    msg = rx.recv() =\u003e msg,\n                    _ = \u0026mut timeout =\u003e {\n                        // Timeout with no waiters — just loop.\n                        continue;\n                    }\n                };\n\n                match first {\n                    Some(waiter) =\u003e waiters.push(waiter),\n                    None =\u003e break, // channel closed\n                }\n\n                // Drain any additional waiters without blocking.\n                while let Ok(waiter) = rx.try_recv() {\n                    waiters.push(waiter);\n                    if waiters.len() \u003e= 64 {\n                        break;\n                    }\n                }\n\n                // Perform the fsync.\n                if let Err(e) = fsync_fn() {\n                    tracing::error!(?e, \"WAL fsync failed\");\n                }\n\n                // Wake all waiters.\n                for waiter in waiters {\n                    let _ = waiter.send(());\n                }\n            }\n        });\n\n        Self { tx, _flush_handle: flush_handle }\n    }\n\n    /// Submits an fsync request.\n    ///\n    /// Returns a oneshot receiver that resolves when this entry has been\n    /// flushed to disk (along with all other entries in the same batch).\n    pub async fn submit(\u0026self) -\u003e Result\u003coneshot::Receiver\u003c()\u003e\u003e {\n        let (tx, rx) = oneshot::channel();\n        self.tx.send(tx).await.map_err(|_| {\n            crate::error::Error::Io(std::io::Error::new(\n                std::io::ErrorKind::BrokenPipe,\n                \"WAL sync group shut down\",\n            ))\n        })?;\n        Ok(rx)\n    }\n}\n\nimpl Drop for WalSyncGroup {\n    fn drop(\u0026mut self) {\n        // The channel will be closed, causing the flusher task to exit.\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use std::sync::atomic::{AtomicU32, Ordering};\n\n    use super::*;\n\n    #[tokio::test]\n    async fn group_commit_flushes_batch() {\n        let flush_count = Arc::new(AtomicU32::new(0));\n        let fc = flush_count.clone();\n\n        let group = WalSyncGroup::new(\n            move || {\n                fc.fetch_add(1, Ordering::SeqCst);\n                Ok(())\n            },\n            50, // 50ms timeout\n        );\n\n        // Submit 3 entries in quick succession.\n        let rx1 = group.submit().await.unwrap();\n        let rx2 = group.submit().await.unwrap();\n        let rx3 = group.submit().await.unwrap();\n\n        // All should resolve within the batch timeout.\n        tokio::time::timeout(std::time::Duration::from_secs(2), rx1).await.unwrap().unwrap();\n        tokio::time::timeout(std::time::Duration::from_secs(2), rx2).await.unwrap().unwrap();\n        tokio::time::timeout(std::time::Duration::from_secs(2), rx3).await.unwrap().unwrap();\n\n        // One or more fsyncs should have occurred.\n        assert!(flush_count.load(Ordering::SeqCst) \u003e= 1);\n    }\n\n    #[tokio::test]\n    async fn timeout_flushes_empty_batch() {\n        let flush_count = Arc::new(AtomicU32::new(0));\n        let fc = flush_count.clone();\n\n        let group = WalSyncGroup::new(\n            move || {\n                fc.fetch_add(1, Ordering::SeqCst);\n                Ok(())\n            },\n            10, // short timeout\n        );\n\n        // Submit one entry.\n        let rx = group.submit().await.unwrap();\n        rx.await.unwrap();\n\n        drop(group);\n    }\n}\n","traces":[{"line":31,"address":[8098160,8098452,8098436],"length":1,"stats":{"Line":6}},{"line":35,"address":[8045668],"length":1,"stats":{"Line":9}},{"line":37,"address":[7191615,7191983,7198496,7198628,7192415,7198777,7200551,7191496,7195728,7192184,7192523,7192384,7196460,7198527,7192290,7195471,7195579,7192672,7195440,7191864,7194446,7193404,7197502,7199509],"length":1,"stats":{"Line":22}},{"line":38,"address":[8098726,8098576],"length":1,"stats":{"Line":9}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[7200850,7197801,7192640,7194745,7195696,7198745],"length":1,"stats":{"Line":10}},{"line":43,"address":[8100968,8101155],"length":1,"stats":{"Line":10}},{"line":45,"address":[7120630],"length":1,"stats":{"Line":6}},{"line":48,"address":[8099249,8098803,8101189,8099115,8101277,8101741,8098646],"length":1,"stats":{"Line":35}},{"line":49,"address":[ esult},\n    wal::{entry::WalEntry, sync::WalSyncGroup},\n};\n\n/// An append-only sequential WAL writer.\n///\n/// # Examples\n///\n/// ```ignore\n/// // WalWriter requires tokio runtime; examples are in unit tests.\n/// use oceanfs_core::{SegmentId, HashOutput, WalConfig};\n/// use oceanfs_storage::wal::{WalWriter, WalEntry};\n///\n/// # #[tokio::main]\n/// # async fn main() {\n/// let config = WalConfig::default();\n/// let writer = WalWriter::open(\u0026config).await.unwrap();\n/// let entry = WalEntry::new(SegmentId::new(), 0, 100, HashOutput::from_bytes([0u8; 32]));\n/// let _position = writer.append(entry).await.unwrap();\n/// # }\n/// ```\npub struct WalWriter {\n    /// WAL configuration.\n    config: WalConfig,\n    /// Current WAL file handle.\n    file: Mutex\u003cstd::fs::File\u003e,\n    /// Current file sequence number.\n    file_seq: Mutex\u003cu64\u003e,\n    /// Current byte position within the current file.\n    position: Mutex\u003cu64\u003e,\n    /// Group-commit coordinator.\n    sync_group: WalSyncGroup,\n    /// Global WAL position counter (monotonically increasing across files).\n    global_position: Mutex\u003cu64\u003e,\n}\n\nimpl WalWriter {\n    /// Opens the WAL for appending.\n    ///\n    /// Creates the WAL directory if it doesn't exist. Resumes from the\n    /// last WAL file if one exists.\n    ///\n    /// # Errors\n    ///\n    /// Returns an I/O error if the WAL directory cannot be created or\n    /// the WAL files cannot be opened.\n    pub async fn open(config: \u0026WalConfig) -\u003e Result\u003cSelf\u003e {\n        tokio::fs::create_dir_all(\u0026config.data_dir).await?;\n\n        // Find the highest existing WAL file number.\n        let (file_seq, file, existing_size) = Self::find_latest_file(config).await?;\n\n        let writer = Self {\n            config: config.clone(),\n            file: Mutex::new(file),\n            file_seq: Mutex::new(file_seq),\n            position: Mutex::new(existing_size),\n            global_position: Mutex::new(existing_size),\n            sync_group: Self::create_sync_group(config),\n        };\n\n        Ok(writer)\n    }\n\n    /// Appends an entry to the WAL.\n    ///\n    /// Returns the global WAL position of the entry.\n    ///\n    /// # Errors\n    ///\n    /// Returns an I/O error if the write fails or the sync group shuts down.\n    pub async fn append(\u0026self, entry: WalEntry) -\u003e Result\u003cu64\u003e {\n        let data = entry.to_bytes();\n        let entry_size = data.len() as u64;\n\n        // Check if we need to rotate the file.\n        {\n            let pos = *self.position.lock().await;\n            if pos + entry_size \u003e self.config.max_file_size_bytes {\n                self.rotate().await?;\n            }\n        }\n\n        // Write the entry.\n        let global_pos = {\n            let mut file = self.file.lock().await;\n            let mut pos = self.position.lock().await;\n\n            file.write_all(\u0026data)?;\n            // Sync data but NOT metadata (the directory sync happens in group commit).\n            file.flush()?;\n\n            let written_pos = *pos;\n            *pos += entry_size;\n            written_pos\n        };\n\n        // Update global position.\n        {\n            let mut gp = self.global_position.lock().await;\n            let current = *gp;\n            *gp += entry_size;\n            current\n        };\n\n        // Register with group commit for batched fsync.\n        let rx = self.sync_group.submit().await?;\n        rx.await.map_err(|_| {\n            Error::Io(std::io::Error::new(std::io::ErrorKind::BrokenPipe, \"WAL sync group dropped\"))\n        })?;\n\n        Ok(global_pos)\n    }\n\n    /// Truncates the WAL at the given position.\n    ///\n    /// Entries at or after `position` are discarded. Used after segment\n    /// sealing to reclaim WAL space.\n    ///\n    /// # Errors\n    ///\n    /// Returns an I/O error if the truncation fails.\n    pub async fn truncate(\u0026self, position: u64) -\u003e Result\u003c()\u003e {\n        let mut file = self.file.lock().await;\n        file.set_len(position)?;\n        file.seek(SeekFrom::Start(position))?;\n        file.flush()?;\n\n        let mut pos = self.position.lock().await;\n        *pos = position;\n\n        Ok(())\n    }\n\n    /// Force-syncs the current WAL file to disk.\n    ///\n    /// # Errors\n    ///\n    /// Returns an I/O error if the fsync fails.\n    pub async fn sync(\u0026self) -\u003e Result\u003c()\u003e {\n        let file = self.file.lock().await;\n        file.sync_all()?;\n        Ok(())\n    }\n\n    /// Returns the current global WAL position.\n    pub async fn global_position(\u0026self) -\u003e u64 {\n        *self.global_position.lock().await\n    }\n\n    /// Rotates to a new WAL file.\n    async fn rotate(\u0026self) -\u003e Result\u003c()\u003e {\n        let mut file = self.file.lock().await;\n        let mut seq = self.file_seq.lock().await;\n        let mut pos = self.position.lock().await;\n\n        // Sync and close the current file.\n        file.sync_all()?;\n\n        // Open the next file.\n        *seq += 1;\n        let path = Self::wal_file_path(\u0026self.config.data_dir, *seq);\n        *file = std::fs::OpenOptions::new().create(true).append(true).open(\u0026path)?;\n        *pos = 0;\n\n        Ok(())\n    }\n\n    fn wal_file_path(dir: \u0026Path, seq: u64) -\u003e PathBuf {\n        dir.join(format!(\"wal_{seq:08}.log\"))\n    }\n\n    async fn find_latest_file(config: \u0026WalConfig) -\u003e Result\u003c(u64, std::fs::File, u64)\u003e {\n        let mut max_seq = 0u64;\n        let mut entries = tokio::fs::read_dir(\u0026config.data_dir).await?;\n\n        while let Some(entry) = entries.next_entry().await? {\n            let name = entry.file_name();\n            let name = name.to_string_lossy();\n            if name.starts_with(\"wal_\") \u0026\u0026 name.ends_with(\".log\") {\n                if let Some(seq_str) =\n                    name.strip_prefix(\"wal_\").and_then(|s| s.strip_suffix(\".log\"))\n                {\n                    if let Ok(seq) = seq_str.parse::\u003cu64\u003e() {\n                        max_seq = max_seq.max(seq);\n                    }\n                }\n            }\n        }\n\n        let path = Self::wal_file_path(\u0026config.data_dir, max_seq);\n        let file = if path.exists() {\n            std::fs::OpenOptions::new().append(true).open(\u0026path)?\n        } else {\n            std::fs::OpenOptions::new().create(true).append(true).open(\u0026path)?\n        };\n\n        let existing_size = file.metadata()?.len();\n\n        Ok((max_seq, file, existing_size))\n    }\n\n    fn create_sync_group(config: \u0026WalConfig) -\u003e WalSyncGroup {\n        // For now, the sync group just ensures data is flushed.\n        // In a real implementation, this would call fsync/fdatasync.\n        WalSyncGroup::new(\n            || {\n                // No-op for in-memory tests; real fsync happens in append's flush().\n                Ok(())\n            },\n            config.fsync_batch_timeout_ms,\n        )\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::{HashOutput, SegmentId};\n\n    use super::*;\n\n    async fn test_config() -\u003e WalConfig {\n        let dir = tempfile::tempdir().unwrap();\n        WalConfig {\n            data_dir: dir.path().to_path_buf(),\n            max_file_size_bytes: 1024 * 1024, // 1 MB\n            fsync_batch_timeout_ms: 10,\n        }\n    }\n\n    fn make_entry(offset: u64, length: u32) -\u003e WalEntry {\n        WalEntry::new(SegmentId::new(), offset, length, HashOutput::from_bytes([0u8; 32]))\n    }\n\n    #[tokio::test]\n    async fn append_increments_position() {\n        let config = test_config().await;\n        let writer = WalWriter::open(\u0026config).await.unwrap();\n\n        let pos1 = writer.append(make_entry(0, 100)).await.unwrap();\n        let pos2 = writer.append(make_entry(100, 200)).await.unwrap();\n\n        assert!(pos2 \u003e pos1);\n    }\n\n    #[tokio::test]\n    async fn truncate_resets_position() {\n        let config = test_config().await;\n        let writer = WalWriter::open(\u0026config).await.unwrap();\n\n        let pos1 = writer.append(make_entry(0, 100)).await.unwrap();\n        writer.truncate(pos1).await.unwrap();\n\n        // Position should be back at pos1.\n        let pos2 = writer.append(make_entry(0, 50)).await.unwrap();\n        assert_eq!(pos1, pos2); // Re-writing at same position\n    }\n\n    #[tokio::test]\n    async fn sync_does_not_error() {\n        let config = test_config().await;\n        let writer = WalWriter::open(\u0026config).await.unwrap();\n        writer.append(make_entry(0, 1)).await.unwrap();\n        writer.sync().await.unwrap();\n    }\n}\n","traces":[{"line":64,"address":[7173283,7173105,7173145,7173014,7173755,7172976,7173171],"length":1,"stats":{"Line":21}},{"line":65,"address":[8147626,8147730,8148124,8147498,8147551],"length":1,"stats":{"Line":14}},{"line":68,"address":[7052381,7052810,7053940,7052958],"length":1,"stats":{"Line":7}},{"line":71,"address":[8148655],"length":1,"stats":{"Line":4}},{"line":72,"address":[7174299],"length":1,"stats":{"Line":6}},{"line":73,"address":[7168930],"length":1,"stats":{"Line":5}},{"line":74,"address":[7169002],"length":1,"stats":{"Line":6}},{"line":75,"address":[7174489],"length":1,"stats":{"Line":4}},{"line":76,"address":[7169064],"length":1,"stats":{"Line":5}},{"line":79,"address":[7169265],"length":1,"stats":{"Line":4}},{"line":89,"address":[7175899,7175632,7176012,7175983,7175920,7175835,7176901,7175962,7175679,7175878,7175941,7176283],"length":1,"stats":{"Line":16}},{"line":90,"address":[7175814],"length":1,"stats":{"Line":3}},{"line":91,"address":[7176062,7176152],"length":1,"stats":{"Line":6}},{"line":95,"address":[7170409,7170703,7170861],"length":1,"stats":{"Line":3}},{"line":96,"address":[7056332,7 aStore::open(\u0026config).expect(\"failed to open MetadataStore\")\n}\n\n// ---------------------------------------------------------------------------\n// Object CRUD\n// ---------------------------------------------------------------------------\n\n#[test]\nfn put_and_get_object_roundtrip() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let meta = ObjectMetadata {\n        object_key: test_key(\"photo.jpg\"),\n        size: 1024,\n        blake3_hash: None,\n        chunks: smallvec::SmallVec::new(),\n        inline_data: Some(bytes::Bytes::from_static(b\"fake-image-data\")),\n        created_at: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n\n    store.put_object(meta.clone()).expect(\"put_object failed\");\n\n    let fetched = store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"photo.jpg\"))\n        .expect(\"get_object failed\")\n        .expect(\"object not found\");\n\n    assert_eq!(fetched.object_key.as_str(), \"photo.jpg\");\n    assert_eq!(fetched.size, 1024);\n    assert!(fetched.inline_data.is_some());\n    assert_eq!(fetched.inline_data.as_deref(), Some(\u0026b\"fake-image-data\"[..]));\n}\n\n#[test]\nfn get_nonexistent_object_returns_none() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let result = store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"no-such-key\"))\n        .expect(\"get_object failed\");\n    assert!(result.is_none());\n}\n\n#[test]\nfn delete_object_removes_it() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let meta = ObjectMetadata {\n        object_key: test_key(\"tmp.dat\"),\n        size: 64,\n        blake3_hash: None,\n        chunks: smallvec::SmallVec::new(),\n        inline_data: Some(bytes::Bytes::from_static(b\"tmp\")),\n        created_at: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n    store.put_object(meta).unwrap();\n\n    // Confirm it exists.\n    assert!(store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"tmp.dat\"))\n        .unwrap()\n        .is_some());\n\n    store\n        .delete_object(\u0026test_bucket(), \u0026test_key(\"tmp.dat\"))\n        .unwrap();\n\n    // Confirm it is gone.\n    assert!(store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"tmp.dat\"))\n        .unwrap()\n        .is_none());\n}\n\n// ---------------------------------------------------------------------------\n// Segment metadata CRUD\n// ---------------------------------------------------------------------------\n\n#[test]\nfn put_and_get_segment_roundtrip() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let seg_id = SegmentId::new();\n    let meta = SegmentMetadata {\n        segment_id: seg_id,\n        ec_k: 4,\n        ec_m: 2,\n        size_tier: SizeTier::Standard,\n        merkle_root: None,\n        storage_locations: smallvec::SmallVec::new(),\n        sealed_at: Some(1_700_000_000_000),\n    };\n\n    store.put_segment(meta).expect(\"put_segment failed\");\n\n    let fetched = store\n        .get_segment(seg_id)\n        .expect(\"get_segment failed\")\n        .expect(\"segment not found\");\n\n    assert_eq!(fetched.segment_id.as_uuid(), seg_id.as_uuid());\n    assert_eq!(fetched.ec_k, 4);\n    assert_eq!(fetched.ec_m, 2);\n    assert!(fetched.is_sealed());\n}\n\n#[test]\nfn get_nonexistent_segment_returns_none() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let result = store.get_segment(SegmentId::new()).unwrap();\n    assert!(result.is_none());\n}\n\n// ---------------------------------------------------------------------------\n// Tombstone CRUD\n// ---------------------------------------------------------------------------\n\n#[test]\nfn tombstone_roundtrip() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let tombstone = Tombstone {\n        deletion_time: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n\n    store\n        .put_tombstone(\u0026test_bucket(), \u0026test_key(\"deleted-key\"), tombstone)\n        .unwrap();\n\n    assert!(store\n        .has_tombstone(\u0026test_bucket(), \u0026test_key(\"deleted-key\"))\n        .unwrap());\n}\n\n#[test]\nfn no_tombstone_for_nonexistent_key() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    assert!(!store\n        .has_tombstone(\u0026test_bucket(), \u0026test_key(\"alive-key\"))\n        .unwrap());\n}\n\n// ---------------------------------------------------------------------------\n// List objects with prefix\n// ---------------------------------------------------------------------------\n\n#[test]\nfn list_objects_by_prefix() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    // Insert several objects with different prefixes.\n    for name in \u0026[\"a/1.txt\", \"a/2.txt\", \"b/1.txt\"] {\n        let meta = ObjectMetadata {\n            object_key: ObjectKey::new(*name),\n            size: 10,\n            blake3_hash: None,\n            chunks: smallvec::SmallVec::new(),\n            inline_data: Some(bytes::Bytes::from_static(b\"x\")),\n            created_at: 1_700_000_000_000,\n            hlc: Hlc::zero(),\n        };\n        store.put_object(meta).unwrap();\n    }\n\n    // List with prefix \"a/\"\n    let results = store.list_objects(\u0026test_bucket(), \"a/\");\n    let count = results.iter().filter(|r| r.is_ok()).count();\n    assert_eq!(count, 2, \"expected 2 objects with prefix 'a/'\");\n\n    // List with prefix \"b/\"\n    let results = store.list_objects(\u0026test_bucket(), \"b/\");\n    let count = results.iter().filter(|r| r.is_ok()).count();\n    assert_eq!(count, 1, \"expected 1 object with prefix 'b/'\");\n}\n\n// ---------------------------------------------------------------------------\n// Inline blob round-trip\n// ---------------------------------------------------------------------------\n\n#[test]\nfn inline_blob_roundtrip_across_crud() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let payload = bytes::Bytes::from(vec![0xAB; 4096]); // exactly at inline threshold\n    let meta = ObjectMetadata {\n        object_key: test_key(\"inline-blob\"),\n        size: 4096,\n        blake3_hash: None,\n        chunks: smallvec::SmallVec::new(),\n        inline_data: Some(payload.clone()),\n        created_at: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n    assert!(meta.is_inline());\n    assert!(!meta.is_segment_stored());\n\n    store.put_object(meta).unwrap();\n\n    let fetched = store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"inline-blob\"))\n        .unwrap()\n        .expect(\"object not found\");\n\n    assert!(fetched.is_inline());\n    assert_eq!(fetched.inline_data.as_deref(), Some(\u0026payload[..]));\n}\n\n// ---------------------------------------------------------------------------\n// Chunk-referenced object round-trip\n// ---------------------------------------------------------------------------\n\n#[test]\nfn chunk_stored_object_roundtrip() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let seg_id = SegmentId::new();\n    let mut chunks = smallvec::SmallVec::new();\n    chunks.push(ChunkRef {\n        segment_id: seg_id,\n        offset: 0,\n        length: 500,\n    });\n\n    let meta = ObjectMetadata {\n        object_key: test_key(\"chunked-blob\"),\n        size: 500,\n        blake3_hash: None,\n        chunks,\n        inline_data: None,\n        created_at: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n    assert!(!meta.is_inline());\n    assert!(meta.is_segment_stored());\n\n    store.put_object(meta).unwrap();\n\n    let fetched = store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"chunked-blob\"))\n        .unwrap()\n        .expect(\"object not found\");\n\n    assert!(!fetched.is_inline());\n    assert!(fetched.is_segment_stored());\n    assert_eq!(fetched.chunks.len(), 1);\n    assert_eq!(fetched.chunks[0].segment_id.as_uuid(), seg_id.as_uuid());\n    assert_eq!(fetched.chunks[0].offset, 0);\n    assert_eq!(fetched.chunks[0].length, 500);\n}\n\n// ---------------------------------------------------------------------------\n// Batch atomic writes\n// ---------------------------------------------------------------------------\n\n#[test]\nfn batch_write_atomicity() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    let meta = ObjectMetadata {\n        object_key: test_key(\"batch-obj\"),\n        size: 32,\n        blake3_hash: None,\n        chunks: smallvec::SmallVec::new(),\n        inline_data: Some(bytes::Bytes::from_static(b\"batch-data\")),\n        created_at: 1_700_000_000_000,\n        hlc: Hlc::zero(),\n    };\n\n    let tombstone = Tombstone {\n        deletion_time: 1_700_000_001_000,\n        hlc: Hlc::zero(),\n    };\n\n    let ops = vec![\n        BatchOp::PutObject(test_key(\"batch-obj\"), meta),\n        BatchOp::PutTombstone(test_bucket(), test_key(\"batch-obj\"), tombstone),\n    ];\n\n    store.batch_write(ops).expect(\"batch_write failed\");\n\n    // Object should exist.\n    assert!(store\n        .get_object(\u0026test_bucket(), \u0026test_key(\"batch-obj\"))\n        .unwrap()\n        .is_some());\n\n    // Tombstone should exist.\n    assert!(store\n        .has_tombstone(\u0026test_bucket(), \u0026test_key(\"batch-obj\"))\n        .unwrap());\n}\n\n#[test]\nfn batch_write_no_ops_is_noop() {\n    let dir = tempfile::tempdir().unwrap();\n    let store = make_store(\u0026dir);\n\n    // Empty batch should succeed.\n    store.batch_write(vec![]).expect(\"empty batch should succeed\");\n}\n","traces":[{"line":1,"address":[6598477,6598464],"length":1,"stats":{"Line":2}},{"line":21,"address":[6598432],"leng tIndex serialization/deserialization and lookup\n//! - SegmentHeader serialization/deserialization\n//!\n//! Covers `segment-buffer-inline` and `segment-sealing-index` features.\n\n#![allow(clippy::unwrap_used)]\n#![allow(clippy::expect_used)]\n\nuse oceanfs_core::{SegmentId, SegmentIndexEntry, SegmentSizeConfig, SizeTier};\nuse oceanfs_storage::{ActiveSegment, BufferPool, SegmentHeader, SegmentIndex};\n\nfn config() -\u003e SegmentSizeConfig {\n    SegmentSizeConfig::default()\n}\n\nfn pool() -\u003e BufferPool {\n    BufferPool::new(65536, 8)\n}\n\n// ---------------------------------------------------------------------------\n// ActiveSegment tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn active_segment_append_returns_sequential_offsets() {\n    let pool = pool();\n    let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n\n    // Append blobs of various sizes, verifying offset accounting.\n    let sizes: \u0026[usize] = \u0026[1, 4096, 65536, 262144, 1_048_576];\n    let mut expected_offset: u64 = 0;\n\n    for \u0026size in sizes {\n        let data = vec![0xAB; size];\n        let (offset, length) = seg.append(\u0026data).unwrap();\n        assert_eq!(offset, expected_offset, \"offset mismatch for size {size}\");\n        assert_eq!(length, size, \"length mismatch for size {size}\");\n        expected_offset += size as u64;\n    }\n\n    assert_eq!(seg.size(), expected_offset);\n}\n\n#[test]\nfn active_segment_is_full_after_target_reached() {\n    let config = SegmentSizeConfig {\n        default_target_size: 1000,\n        ..SegmentSizeConfig::default()\n    };\n    let pool = BufferPool::new(2048, 2);\n    let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n\n    assert!(!seg.is_full());\n    seg.append(\u0026[0u8; 1000]).unwrap();\n    assert!(seg.is_full());\n}\n\n#[test]\nfn active_segment_rejects_append_when_full() {\n    let config = SegmentSizeConfig {\n        default_target_size: 5,\n        ..SegmentSizeConfig::default()\n    };\n    let pool = BufferPool::new(1024, 2);\n    let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config, \u0026pool).unwrap();\n\n    seg.append(\u0026[0u8; 5]).unwrap();\n    let result = seg.append(b\"x\");\n    assert!(result.is_err());\n}\n\n#[test]\nfn active_segment_data_returns_appended_bytes() {\n    let pool = pool();\n    let mut seg = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n\n    seg.append(b\"hello\").unwrap();\n    seg.append(b\" world\").unwrap();\n\n    assert_eq!(seg.data(), b\"hello world\");\n}\n\n#[test]\nfn active_segment_id_is_unique() {\n    let pool = pool();\n    let seg1 = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n    let seg2 = ActiveSegment::new(SizeTier::Standard, \u0026config(), \u0026pool).unwrap();\n\n    assert_ne!(seg1.id().as_uuid(), seg2.id().as_uuid());\n}\n\n#[test]\nfn active_segment_tier_is_stored() {\n    let pool = pool();\n    let seg = ActiveSegment::new(SizeTier::Small, \u0026config(), \u0026pool).unwrap();\n    assert_eq!(seg.tier(), SizeTier::Small);\n}\n\n// ---------------------------------------------------------------------------\n// BufferPool tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn buffer_pool_acquire_release() {\n    let pool = BufferPool::new(4096, 4);\n\n    let buf1 = pool.acquire().unwrap();\n    let _buf2 = pool.acquire().unwrap();\n    let _buf3 = pool.acquire().unwrap();\n    let _buf4 = pool.acquire().unwrap();\n\n    // Release and re-acquire.\n    pool.release(buf1);\n\n    // Should be able to acquire again.\n    let _buf5 = pool.acquire().unwrap();\n}\n\n#[test]\nfn buffer_pool_exhaustion() {\n    let pool = BufferPool::new(1024, 2);\n\n    // Acquire all buffers.\n    let _a = pool.acquire().unwrap();\n    let _b = pool.acquire().unwrap();\n\n    // Pool is exhausted.\n    let result = pool.acquire();\n    assert!(result.is_err());\n}\n\n// ---------------------------------------------------------------------------\n// SegmentIndex tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn segment_index_new_with_entries() {\n    let entries = vec![\n        SegmentIndexEntry {\n            offset: 0,\n            length: 100,\n            blob_key_hash: [1u8; 32],\n        },\n        SegmentIndexEntry {\n            offset: 100,\n            length: 200,\n            blob_key_hash: [2u8; 32],\n        },\n    ];\n\n    let index = SegmentIndex::new(entries).unwrap();\n    assert_eq!(index.len(), 2);\n}\n\n#[test]\nfn segment_index_lookup_correct_entry() {\n    let entries = vec![\n        SegmentIndexEntry {\n            offset: 0,\n            length: 500,\n            blob_key_hash: [0xAA; 32],\n        },\n        SegmentIndexEntry {\n            offset: 500,\n            length: 300,\n            blob_key_hash: [0xBB; 32],\n        },\n        SegmentIndexEntry {\n            offset: 800,\n            length: 200,\n            blob_key_hash: [0xCC; 32],\n        },\n    ];\n\n    let index = SegmentIndex::new(entries).unwrap();\n\n    let entry = index.lookup(0).expect(\"should find entry at offset 0\");\n    assert_eq!(entry.length, 500);\n\n    let entry = index.lookup(500).expect(\"should find entry at offset 500\");\n    assert_eq!(entry.length, 300);\n\n    let entry = index.lookup(800).expect(\"should find entry at offset 800\");\n    assert_eq!(entry.length, 200);\n\n    // Missing offset.\n    assert!(index.lookup(999).is_none());\n}\n\n#[test]\nfn segment_index_serialization_roundtrip() {\n    let entries = vec![\n        SegmentIndexEntry {\n            offset: 0,\n            length: 256,\n            blob_key_hash: [0x11; 32],\n        },\n        SegmentIndexEntry {\n            offset: 256,\n            length: 512,\n            blob_key_hash: [0x22; 32],\n        },\n    ];\n\n    let index = SegmentIndex::new(entries).unwrap();\n    let bytes = index.to_bytes();\n    let restored = SegmentIndex::from_bytes(\u0026bytes).unwrap();\n\n    assert_eq!(restored.len(), 2);\n    assert_eq!(restored.lookup(0).unwrap().length, 256);\n    assert_eq!(restored.lookup(256).unwrap().length, 512);\n}\n\n#[test]\nfn segment_index_duplicate_offset_rejected() {\n    let entries = vec![\n        SegmentIndexEntry {\n            offset: 100,\n            length: 50,\n            blob_key_hash: [0u8; 32],\n        },\n        SegmentIndexEntry {\n            offset: 100,  // duplicate\n            length: 75,\n            blob_key_hash: [1u8; 32],\n        },\n    ];\n\n    let result = SegmentIndex::new(entries);\n    assert!(result.is_err());\n}\n\n#[test]\nfn segment_index_empty_has_len_zero() {\n    let index = SegmentIndex::new(vec![]).unwrap();\n    assert_eq!(index.len(), 0);\n    assert!(index.lookup(0).is_none());\n}\n\n// ---------------------------------------------------------------------------\n// SegmentHeader tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn segment_header_serialization_roundtrip() {\n    let seg_id = SegmentId::new();\n    let checksum = [0x42; 32];\n\n    let header = SegmentHeader::new(seg_id, 1024, 3, 1024, checksum);\n    let bytes = header.to_bytes();\n    let restored = SegmentHeader::from_bytes(\u0026bytes).unwrap();\n\n    assert_eq!(restored.segment_id.as_uuid(), seg_id.as_uuid());\n    assert_eq!(restored.size, 1024);\n    assert_eq!(restored.blob_count, 3);\n    assert_eq!(restored.checksum, checksum);\n}\n","traces":[{"line":1,"address":[6262640,6262653],"length":1,"stats":{"Line":2}},{"line":18,"address":[6262704],"length":1,"stats":{"Line":4}},{"line":19,"address":[6262712],"length":1,"stats":{"Line":4}},{"line":20,"address":[6262722],"length":1,"stats":{"Line":4}},{"line":22,"address":[6262672],"length":1,"stats":{"Line":4}},{"line":23, ---------------------------\n// TierRouter::classify — boundary tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn classify_zero_bytes_is_error() {\n    // 0-byte blobs are rejected by the size config (asserts blob_size \u003e 0).\n    // The write path handles empty data before classification.\n    let config = SegmentSizeConfig::default();\n    let result = std::panic::catch_unwind(|| {\n        let _ = config.classify(0);\n    });\n    assert!(result.is_err(), \"0-byte size should be rejected\");\n}\n\n#[test]\nfn classify_at_inline_threshold() {\n    // Default: inline_threshold_bytes = 4096\n    assert_eq!(classify(4096), SizeTier::Inline);\n}\n\n#[test]\nfn classify_just_above_inline_threshold() {\n    // 4097 \u003e 4096 → Small tier.\n    assert_eq!(classify(4097), SizeTier::Small);\n}\n\n#[test]\nfn classify_at_small_threshold() {\n    // Default: segment_small_threshold_bytes = 262144 (256 KB)\n    assert_eq!(classify(262144), SizeTier::Small);\n}\n\n#[test]\nfn classify_just_above_small_threshold() {\n    // 262145 \u003e 256 KB → Standard tier.\n    assert_eq!(classify(262145), SizeTier::Standard);\n}\n\n#[test]\nfn classify_at_standard_threshold() {\n    // Default: default_target_size = 4194304 (4 MB)\n    assert_eq!(classify(4_194_304), SizeTier::Standard);\n}\n\n#[test]\nfn classify_just_above_standard_threshold() {\n    // \u003e 4 MB → Multi tier.\n    assert_eq!(classify(4_194_305), SizeTier::Multi);\n}\n\n#[test]\nfn classify_typical_1kb_blob() {\n    assert_eq!(classify(1024), SizeTier::Inline);\n}\n\n#[test]\nfn classify_typical_64kb_blob() {\n    // 64 KB is between inline (4 KB) and small (256 KB).\n    assert_eq!(classify(65536), SizeTier::Small);\n}\n\n#[test]\nfn classify_typical_1mb_blob() {\n    // 1 MB is between small (256 KB) and standard (4 MB).\n    assert_eq!(classify(1_048_576), SizeTier::Standard);\n}\n\n#[test]\nfn classify_typical_10mb_blob() {\n    // 10 MB \u003e 4 MB → Multi.\n    assert_eq!(classify(10_485_760), SizeTier::Multi);\n}\n\n// ---------------------------------------------------------------------------\n// TierRouter::is_inline\n// ---------------------------------------------------------------------------\n\n#[test]\nfn is_inline_true_for_small_blobs() {\n    let router = TierRouter::new(default_config());\n    assert!(router.is_inline(1));\n    assert!(router.is_inline(4096));\n    assert!(!router.is_inline(4097));\n    assert!(!router.is_inline(1_048_576));\n}\n\n// ---------------------------------------------------------------------------\n// TierRouter with custom config\n// ---------------------------------------------------------------------------\n\n#[test]\nfn custom_thresholds_are_respected() {\n    let config = SegmentSizeConfig {\n        inline_threshold_bytes: 1024,\n        small_threshold_bytes: 10_000,\n        small_target_size: 5_000,\n        default_target_size: 100_000,\n    };\n\n    let router = TierRouter::new(config);\n\n    assert_eq!(router.classify(512), SizeTier::Inline);\n    assert_eq!(router.classify(1024), SizeTier::Inline);\n    assert_eq!(router.classify(1025), SizeTier::Small);\n    assert_eq!(router.classify(10_000), SizeTier::Small);\n    assert_eq!(router.classify(10_001), SizeTier::Standard);\n    assert_eq!(router.classify(100_000), SizeTier::Standard);\n    assert_eq!(router.classify(100_001), SizeTier::Multi);\n}\n\n// ---------------------------------------------------------------------------\n// TierRouter::target_size\n// ---------------------------------------------------------------------------\n\n#[test]\nfn target_size_per_tier() {\n    let config = SegmentSizeConfig {\n        small_target_size: 65536,\n        default_target_size: 4_194_304,\n        ..SegmentSizeConfig::default()\n    };\n    let router = TierRouter::new(config);\n\n    assert_eq!(router.target_size(SizeTier::Inline), 0);\n    assert_eq!(router.target_size(SizeTier::Small), 65536);\n    assert_eq!(router.target_size(SizeTier::Standard), 4_194_304);\n    assert_eq!(router.target_size(SizeTier::Multi), 4_194_304);\n}\n\n// ---------------------------------------------------------------------------\n// SegmentSplitter tests\n// ---------------------------------------------------------------------------\n\n#[test]\nfn split_exact_chunks() {\n    let splitter = SegmentSplitter::new(10);\n    let data = [1u8; 30];\n    let chunks = splitter.split(\u0026data);\n\n    assert_eq!(chunks.len(), 3);\n    assert_eq!(chunks[0].0, 0);\n    assert_eq!(chunks[0].1.len(), 10);\n    assert_eq!(chunks[1].0, 10);\n    assert_eq!(chunks[1].1.len(), 10);\n    assert_eq!(chunks[2].0, 20);\n    assert_eq!(chunks[2].1.len(), 10);\n}\n\n#[test]\nfn split_uneven_last_chunk() {\n    let splitter = SegmentSplitter::new(10);\n    let data = [1u8; 25];\n    let chunks = splitter.split(\u0026data);\n\n    assert_eq!(chunks.len(), 3);\n    assert_eq!(chunks[0].1.len(), 10);\n    assert_eq!(chunks[1].1.len(), 10);\n    assert_eq!(chunks[2].1.len(), 5);\n}\n\n#[test]\nfn split_smaller_than_chunk() {\n    let splitter = SegmentSplitter::new(1_000_000);\n    let data = [1u8; 5];\n    let chunks = splitter.split(\u0026data);\n\n    assert_eq!(chunks.len(), 1);\n    assert_eq!(chunks[0].0, 0);\n    assert_eq!(chunks[0].1.len(), 5);\n}\n\n#[test]\nfn split_empty_returns_empty() {\n    let splitter = SegmentSplitter::new(100);\n    let chunks = splitter.split(\u0026[]);\n    assert!(chunks.is_empty());\n}\n\n#[test]\nfn split_large_blob_boundary() {\n    // 4 MB default target → one blob = one chunk\n    let splitter = SegmentSplitter::new(4_194_304);\n    let data = vec![0u8; 4_194_304]; // exactly 4 MB\n    let chunks = splitter.split(\u0026data);\n    assert_eq!(chunks.len(), 1);\n\n    // 4 MB + 1 byte → two chunks\n    let data2 = vec![0u8; 4_194_305];\n    let chunks2 = splitter.split(\u0026data2);\n    assert_eq!(chunks2.len(), 2);\n    assert_eq!(chunks2[0].1.len(), 4_194_304);\n    assert_eq!(chunks2[1].1.len(), 1);\n}\n\n#[test]\nfn split_10mb_into_chunks() {\n    let splitter = SegmentSplitter::new(4_194_304); // 4 MB chunks\n    let data = vec![0u8; 10_485_760]; // 10 MB\n    let chunks = splitter.split(\u0026data);\n\n    assert_eq!(chunks.len(), 3); // 4 MB + 4 MB + 2 MB\n    assert_eq!(chunks[0].0, 0);\n    assert_eq!(chunks[0].1.len(), 4_194_304);\n    assert_eq!(chunks[1].0, 4_194_304);\n    assert_eq!(chunks[1].1.len(), 4_194_304);\n    assert_eq!(chunks[2].0, 8_388_608);\n    assert_eq!(chunks[2].1.len(), 2_097_152);\n}\n","traces":[{"line":1,"address":[6262621,6262608],"length":1,"stats":{"Line":2}},{"line":17,"address":[6262576],"length":1,"stats":{"Line":8}},{"line":18,"address":[6262584],"length":1,"stats":{"Line":8}},{"line":19,"address":[6262594],"length":1,"stats":{"Line":8}},{"line":22,"address":[6262640],"length":1,"stats":{"Line":8}},{"line":23,"address":[6262654],"length":1,"stats":{"Line":8}},{"line":24,"address":[6262685],"length":1,"stats":{"Line":8}},{"line":25,"address":[6262696],"length":1,"stats":{"Line":2}},{"line":32,"address":[6268666,6268480,6268660],"length":1,"stats":{"Line":3}},{"line":35,"address":[6268484],"length":1,"stats":{"Line":1}},{"line":36,"address":[6268508],"length":1,"stats":{"Line":2}},{"line":37,"address":[6271541],"length":1,"stats":{"Line":1}},{"line":38,"address":[6271551],"length":1,"stats":{"Line":0}},{"line":39,"address":[6268640,6268579,6268523],"length":1,"stats":{"Line":2}},{"line":40,"address":[6268614,6268543],"length":1,"stats":{"Line":2}},{"line":43,"address":[6268368],"length":1,"stats":{"Line":3}},{"line":45,"address":[6268372],"length":1,"stats":{"Line":1}},{"line":46,"address":[6271189],"length":1,"stats":{"Line":2}},{"line":49,"address":[6270000],"length":1,"stats":{"Line":3}},{"line":51,"address":[6270004],"length":1,"stats":{"Line":1}},{"line":52,"address":[6270096],"length":1,"stats":{"Line":2}},{"line":55,"address":[6268256],"length":1,"stats":{"Line":3}},{"line":57,"address":[6268260], ry {\n    WalEntry::new(\n        segment_id,\n        offset,\n        length,\n        HashOutput::from_bytes([0u8; 32]),\n    )\n}\n\n// ---------------------------------------------------------------------------\n// Basic append and replay\n// ---------------------------------------------------------------------------\n\n#[tokio::test]\nasync fn append_and_replay_roundtrip() {\n    let dir = tempfile::tempdir().unwrap();\n    let config = make_config(\u0026dir);\n\n    let writer = WalWriter::open(\u0026config).await.expect(\"failed to open writer\");\n\n    let seg_id = SegmentId::new();\n    let entry1 = make_entry(seg_id, 0, 100);\n    let entry2 = make_entry(seg_id, 100, 200);\n    let entry3 = make_entry(seg_id, 300, 150);\n\n    let pos1 = writer.append(entry1.clone()).await.unwrap();\n    let pos2 = writer.append(entry2.clone()).await.unwrap();\n    let pos3 = writer.append(entry3.clone()).await.unwrap();\n\n    // Positions should be sequential.\n    assert!(pos1 \u003c pos2);\n    assert!(pos2 \u003c pos3);\n\n    drop(writer);\n\n    // Replay all entries.\n    let reader = WalReader::open(\u0026config).expect(\"failed to open reader\");\n    let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e, _\u003e\u003e().unwrap();\n\n    assert_eq!(entries.len(), 3);\n    assert_eq!(entries[0].offset, 0);\n    assert_eq!(entries[1].offset, 100);\n    assert_eq!(entries[2].offset, 300);\n}\n\n// ---------------------------------------------------------------------------\n// Crash simulation: write without truncate, then replay\n// ---------------------------------------------------------------------------\n\n#[tokio::test]\nasync fn crash_simulation_replays_all_entries() {\n    let dir = tempfile::tempdir().unwrap();\n    let config = make_config(\u0026dir);\n\n    let seg_id = SegmentId::new();\n\n    // Write entries and drop the writer without truncating (simulating crash).\n    {\n        let writer = WalWriter::open(\u0026config).await.unwrap();\n        for i in 0..10 {\n            let entry = make_entry(seg_id, i * 64, 64);\n            writer.append(entry).await.unwrap();\n        }\n        // Drop without truncate — simulates crash.\n    }\n\n    // On restart, replay all entries.\n    let reader = WalReader::open(\u0026config).expect(\"failed to open reader\");\n    let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e, _\u003e\u003e().unwrap();\n\n    assert_eq!(entries.len(), 10, \"all 10 entries should be replayed after crash\");\n    for (i, entry) in entries.iter().enumerate() {\n        assert_eq!(entry.offset, i as u64 * 64);\n        assert_eq!(entry.length, 64);\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Truncation: truncate partial, verify only remaining entries replayed\n// ---------------------------------------------------------------------------\n\n#[tokio::test]\nasync fn truncate_removes_entries_after_position() {\n    let dir = tempfile::tempdir().unwrap();\n    let config = make_config(\u0026dir);\n\n    let seg_id = SegmentId::new();\n    let mut truncation_point: u64 = 0;\n\n    // Write entries.\n    {\n        let writer = WalWriter::open(\u0026config).await.unwrap();\n\n        for i in 0..5 {\n            let entry = make_entry(seg_id, i * 100, 100);\n            let pos = writer.append(entry).await.unwrap();\n            if i == 2 {\n                truncation_point = pos + WalEntry::serialized_size() as u64;\n            }\n        }\n\n        // Truncate after the third entry (keeping first 3).\n        writer.truncate(truncation_point).await.unwrap();\n    }\n\n    // Replay — only the first 3 entries should remain.\n    let reader = WalReader::open(\u0026config).expect(\"failed to open reader\");\n    let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e, _\u003e\u003e().unwrap();\n\n    assert_eq!(entries.len(), 3, \"only first 3 entries should remain after truncation\");\n}\n\n// ---------------------------------------------------------------------------\n// Sync\n// ---------------------------------------------------------------------------\n\n#[tokio::test]\nasync fn sync_does_not_error() {\n    let dir = tempfile::tempdir().unwrap();\n    let config = make_config(\u0026dir);\n\n    let writer = WalWriter::open(\u0026config).await.unwrap();\n    let seg_id = SegmentId::new();\n    let entry = make_entry(seg_id, 0, 42);\n\n    writer.append(entry).await.unwrap();\n    // Sync should succeed without error.\n    writer.sync().await.unwrap();\n}\n\n// ---------------------------------------------------------------------------\n// Empty WAL replay\n// ---------------------------------------------------------------------------\n\n#[tokio::test]\nasync fn replay_empty_directory_returns_no_entries() {\n    let dir = tempfile::tempdir().unwrap();\n    let config = make_config(\u0026dir);\n\n    // Create the WAL directory first (WalWriter::open creates it,\n    // but we need it to exist before WalReader::open can scan it).\n    {\n        let _writer = WalWriter::open(\u0026config).await.expect(\"failed to open writer\");\n        // Writer is dropped immediately — directory exists but has no entries.\n    }\n\n    let reader = WalReader::open(\u0026config).expect(\"failed to open reader\");\n    let entries: Vec\u003c_\u003e = reader.replay().collect::\u003cResult\u003cVec\u003c_\u003e, _\u003e\u003e().unwrap();\n\n    assert!(entries.is_empty());\n}\n\n// ---------------------------------------------------------------------------\n// WalEntry serialization round-trip\n// ---------------------------------------------------------------------------\n\n#[test]\nfn entry_roundtrip() {\n    let seg_id = SegmentId::new();\n    let entry = WalEntry::new(seg_id, 42, 256, HashOutput::from_bytes([0xAA; 32]));\n\n    let bytes = entry.to_bytes();\n    let restored = WalEntry::from_bytes(\u0026bytes).expect(\"failed to deserialize entry\");\n\n    assert_eq!(restored.offset, 42);\n    assert_eq!(restored.length, 256);\n}\n","traces":[{"line":1,"address":[6624013,6624000],"length":1,"stats":{"Line":2}},{"line":17,"address":[6623776,6623972,6623978],"length":1,"stats":{"Line":4}},{"line":18,"address":[6623877],"length":1,"stats":{"Line":5}},{"line":19,"address":[6623808],"length":1,"stats":{"Line":5}},{"line":20,"address":[6623920,6623841],"length":1,"stats":{"Line":5}},{"line":22,"address":[6623938],"length":1,"stats":{"Line":0}},{"line":23,"address":[6623915],"length":1,"stats":{"Line":5}},{"line":25,"address":[6623632],"length":1,"stats":{"Line":1}},{"line":26,"address":[6623722],"length":1,"stats":{"Line":1}},{"line":30,"address":[6623671],"length":1,"stats":{"Line":1}},{"line":32,"address":[6623763],"length":1,"stats":{"Line":1}},{"line":38,"address":[6609836,6610190,6609772,6613136,6609815,6610933,6609886,6609678,6609857,6609632],"length":1,"stats":{"Line":8}},{"line":39,"address":[6607712,6607730],"length":1,"stats":{"Line":3}},{"line":40,"address":[6609936,6609743],"length":1,"stats":{"Line":2}},{"line":41,"address":[6609966],"length":1,"stats":{"Line":1}},{"line":43,"address":[6654978],"length":1,"stats":{"Line":3}},{"line":45,"address":[6610533],"length":1,"stats":{"Line":1}},{"line":46,"address":[6610608],"length":1,"stats":{"Line":1}},{"line":47,"address":[6610663],"length":1,"stats":{"Line":1}},{"line":48,"address":[6610719],"length":1,"stats":{"Line":1}},{"line":50,"address":[6610947,6610775,6609823],"length":1,"stats":{"Line":2}},{"line":51,"address":[6611253,6609844,6611410],"length":1,"stats":{"Line":2}},{"line":52,"address":[6609865,6611701,6611858],"length":1,"stats":{"Line":2}},{"line":55,"address":[6612130],"length":1,"stats":{"Line":1}},{"line":56,"address":[6612189],"length":1,"stats":{"Line":1}},{"line":58,"address":[6612240],"length":1,"stats":{"Line":1}},{"line":61,"address":[6612298],"length":1,"stats":{"Line":1}},{"line":62,"add
