<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

            tracing_subscriber::EnvFilter::try_from_default_env()\n                .unwrap_or_else(|_| \"oceanfs=info\".into()),\n        )\n        .init();\n\n    tracing::info!(\"OceanFS v{} starting\", env!(\"CARGO_PKG_VERSION\"));\n    tracing::info!(\"Phase 0 scaffold — node startup not yet implemented\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-accel","src","cuda.rs"],"content":"#![cfg(feature = \"cuda\")]\n\n//! CUDA-accelerated erasure coding backend.\n//!\n//! Offloads batch GF(2^8) matrix multiplication to the GPU.\n//! Only compiled when the `cuda` feature is enabled.\n\n/// A CUDA-accelerated EC backend.\n///\n/// Implements `Encoder` and `Decoder` using GPU kernel launches\n/// for batched stripe operations.\npub struct CudaBackend {\n    _device_id: usize,\n}\n\n#[allow(dead_code)]\nimpl CudaBackend {\n    /// Creates a new CUDA backend.\n    ///\n    /// # Panics\n    ///\n    /// Panics if no CUDA device is available.\n    pub fn new(device_id: usize) -\u003e Self {\n        Self { _device_id: device_id }\n    }\n\n    /// Returns `true` if a CUDA device is available.\n    pub fn is_available(\u0026self) -\u003e bool {\n        true // stub: assume available when compiled with cuda feature\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-accel","src","dispatcher.rs"],"content":"//! Tiered acceleration dispatcher.\n//!\n//! Selects the best available EC codec backend at runtime based on\n//! configuration and hardware availability.\n\n/// Acceleration tier levels.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum AccelTier {\n    /// Automatically select the best available tier.\n    Auto,\n    /// CPU SIMD (always available).\n    CpuSimd,\n    /// Intel ISA-L optimized (x86 with AVX-512).\n    IsaL,\n    /// GPU / CUDA (requires CUDA hardware).\n    GpuCuda,\n}\n\n/// Dispatches EC operations to the best available backend.\npub struct AccelDispatcher {\n    active_tier: AccelTier,\n}\n\nimpl AccelDispatcher {\n    /// Creates a new dispatcher with the requested tier.\n    ///\n    /// Falls back to `CpuSimd` if the requested tier is unavailable.\n    pub fn new(requested: AccelTier) -\u003e Self {\n        let active_tier = match requested {\n            AccelTier::Auto | AccelTier::CpuSimd =\u003e AccelTier::CpuSimd,\n            #[cfg(feature = \"isa-l\")]\n            AccelTier::IsaL =\u003e AccelTier::IsaL,\n            #[cfg(not(feature = \"isa-l\"))]\n            AccelTier::IsaL =\u003e {\n                tracing::warn!(\"ISA-L not compiled; falling back to CPU SIMD\");\n                AccelTier::CpuSimd\n            }\n            #[cfg(feature = \"cuda\")]\n            AccelTier::GpuCuda =\u003e AccelTier::GpuCuda,\n            #[cfg(not(feature = \"cuda\"))]\n            AccelTier::GpuCuda =\u003e {\n                tracing::warn!(\"CUDA not compiled; falling back to CPU SIMD\");\n                AccelTier::CpuSimd\n            }\n        };\n\n        Self { active_tier }\n    }\n\n    /// Returns the currently active acceleration tier.\n    pub fn active_tier(\u0026self) -\u003e AccelTier {\n        self.active_tier\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn auto_resolves_to_cpu_simd() {\n        let dispatcher = AccelDispatcher::new(AccelTier::Auto);\n        assert_eq!(dispatcher.active_tier(), AccelTier::CpuSimd);\n    }\n\n    #[test]\n    fn cpu_simd_is_always_available() {\n        let dispatcher = AccelDispatcher::new(AccelTier::CpuSimd);\n        assert_eq!(dispatcher.active_tier(), AccelTier::CpuSimd);\n    }\n\n    #[test]\n    fn gpu_cuda_falls_back_without_feature() {\n        let dispatcher = AccelDispatcher::new(AccelTier::GpuCuda);\n        assert_eq!(dispatcher.active_tier(), AccelTier::CpuSimd);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-accel","src","lib.rs"],"content":"//! Hardware acceleration subsystem.\n//!\n//! Provides tiered acceleration for erasure coding and hashing:\n//!\n//! - **Tier 0:** CPU SIMD (portable)\n//! - **Tier 1:** ISA-L (x86, feature-gated)\n//! - **Tier 2:** GPU / CUDA (feature-gated)\n//!\n//! The [`AccelDispatcher`] selects the best available backend at runtime.\n//!\n//! # Unsafe Code\n//!\n//! This crate is permitted to use `unsafe` for GPU FFI and SIMD intrinsics.\n\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod dispatcher;\n\n#[cfg(feature = \"cuda\")]\nmod cuda;\n\npub use dispatcher::{AccelDispatcher, AccelTier};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-cache","src","l1_object.rs"],"content":"//! L1 Object Data Cache — in-memory LRU of hot blob payloads.\n//!\n//! Serves frequently accessed blobs with zero disk I/O. Bucket-scoped,\n//! TTL-based eviction, size-gated insertion. DashMap for concurrent access.\n\nuse std::{\n    sync::atomic::{AtomicU64, Ordering},\n    time::{Duration, Instant},\n};\n\nuse bytes::Bytes;\nuse dashmap::DashMap;\nuse oceanfs_core::{BucketId, ObjectKey};\n\n/// Statistics for the L1 object cache.\n#[derive(Debug, Default)]\npub struct ObjectCacheStats {\n    /// Number of cache hits.\n    pub hits: AtomicU64,\n    /// Number of cache misses.\n    pub misses: AtomicU64,\n    /// Number of evicted entries.\n    pub evictions: AtomicU64,\n    /// Current cache size in bytes (approximate).\n    pub size_bytes: AtomicU64,\n}\n\n/// Configuration for the L1 object cache.\n#[derive(Debug, Clone)]\npub struct ObjectCacheConfig {\n    /// Whether the cache is enabled.\n    pub enabled: bool,\n    /// Maximum cache size in bytes.\n    pub max_size_bytes: u64,\n    /// Time-to-live for cache entries in milliseconds (0 = no expiry).\n    pub ttl_ms: u64,\n    /// Maximum blob size to cache.\n    pub max_blob_size: u64,\n}\n\nimpl Default for ObjectCacheConfig {\n    fn default() -\u003e Self {\n        Self {\n            enabled: true,\n            max_size_bytes: 512 * 1024 * 1024,\n            ttl_ms: 60_000,\n            max_blob_size: 1024 * 1024,\n        }\n    }\n}\n\nstruct CacheEntry {\n    data: Bytes,\n    inserted_at: Instant,\n}\n\n/// L1 object data cache — bucket-scoped LRU of blob payloads.\npub struct ObjectCache {\n    config: ObjectCacheConfig,\n    entries: DashMap\u003c(BucketId, ObjectKey), CacheEntry\u003e,\n    stats: ObjectCacheStats,\n}\n\nimpl ObjectCache {\n    /// Creates a new object cache.\n    pub fn new(config: ObjectCacheConfig) -\u003e Self {\n        Self { config, entries: DashMap::new(), stats: ObjectCacheStats::default() }\n    }\n\n    /// Retrieves a blob from the cache.\n    ///\n    /// Returns `None` on miss or TTL expiry.\n    pub fn get(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e Option\u003cBytes\u003e {\n        if !self.config.enabled {\n            return None;\n        }\n\n        let lookup_key = (bucket.clone(), key.clone());\n        if let Some(entry) = self.entries.get(\u0026lookup_key) {\n            // Check TTL.\n            if self.config.ttl_ms \u003e 0 {\n                let age = entry.inserted_at.elapsed();\n                if age \u003e Duration::from_millis(self.config.ttl_ms) {\n                    drop(entry);\n                    self.entries.remove(\u0026lookup_key);\n                    self.stats.evictions.fetch_add(1, Ordering::Relaxed);\n                    self.stats.misses.fetch_add(1, Ordering::Relaxed);\n                    return None;\n                }\n            }\n            self.stats.hits.fetch_add(1, Ordering::Relaxed);\n            return Some(entry.data.clone());\n        }\n\n        self.stats.misses.fetch_add(1, Ordering::Relaxed);\n        None\n    }\n\n    /// Inserts a blob into the cache.\n    pub fn put(\u0026self, bucket: BucketId, key: ObjectKey, data: Bytes) {\n        if !self.config.enabled {\n            return;\n        }\n        if data.len() as u64 \u003e self.config.max_blob_size {\n            return;\n        }\n\n        let entry = CacheEntry { inserted_at: Instant::now(), data: data.clone() };\n\n        self.entries.insert((bucket, key), entry);\n        self.stats.size_bytes.fetch_add(data.len() as u64, Ordering::Relaxed);\n    }\n\n    /// Invalidates a cache entry.\n    pub fn invalidate(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) {\n        self.entries.remove(\u0026(bucket.clone(), key.clone()));\n    }\n\n    /// Returns cache statistics.\n    pub fn stats(\u0026self) -\u003e \u0026ObjectCacheStats {\n        \u0026self.stats\n    }\n\n    /// Returns the hit rate (0.0 to 1.0).\n    pub fn hit_rate(\u0026self) -\u003e f64 {\n        let hits = self.stats.hits.load(Ordering::Relaxed) as f64;\n        let misses = self.stats.misses.load(Ordering::Relaxed) as f64;\n        let total = hits + misses;\n        if total \u003e 0.0 {\n            hits / total\n        } else {\n            0.0\n        }\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn get_miss_returns_none() {\n        let cache = ObjectCache::new(ObjectCacheConfig::default());\n        assert!(cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).is_none());\n    }\n\n    #[test]\n    fn put_then_get_returns_data() {\n        let cache = ObjectCache::new(ObjectCacheConfig::default());\n        let data = Bytes::from_static(b\"hello\");\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), data.clone());\n\n        let got = cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).unwrap();\n        assert_eq!(got, data);\n    }\n\n    #[test]\n    fn invalidate_removes_entry() {\n        let cache = ObjectCache::new(ObjectCacheConfig::default());\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), Bytes::from_static(b\"data\"));\n        cache.invalidate(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\"));\n        assert!(cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).is_none());\n    }\n\n    #[test]\n    fn max_blob_size_gate() {\n        let config = ObjectCacheConfig { max_blob_size: 10, ..Default::default() };\n        let cache = ObjectCache::new(config);\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), Bytes::from(vec![0u8; 20]));\n        assert!(cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).is_none());\n    }\n\n    #[test]\n    fn hit_rate_computes_correctly() {\n        let cache = ObjectCache::new(ObjectCacheConfig::default());\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), Bytes::from_static(b\"x\"));\n        cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\"));\n        cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"nope\"));\n        let rate = cache.hit_rate();\n        assert!((rate - 0.5).abs() \u003c 0.01);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-cache","src","l2_metadata.rs"],"content":"//! L2 Metadata Cache — LRU of ObjectMetadata entries.\n//!\n//! Avoids RocksDB lookups for hot objects. For inline blobs, a metadata\n//! cache hit serves the blob directly from the cached metadata value.\n\nuse std::{\n    sync::{\n        atomic::{AtomicU64, Ordering},\n        Arc,\n    },\n    time::{Duration, Instant},\n};\n\nuse dashmap::DashMap;\nuse oceanfs_core::{BucketId, ObjectKey, ObjectMetadata};\n\n/// Statistics for the L2 metadata cache.\n#[derive(Debug, Default)]\npub struct MetadataCacheStats {\n    /// Metadata cache hits.\n    pub hits: AtomicU64,\n    /// Hits that served an inline blob directly.\n    pub inline_hits: AtomicU64,\n    /// Cache misses.\n    pub misses: AtomicU64,\n}\n\n/// Configuration for the L2 metadata cache.\n#[derive(Debug, Clone)]\npub struct MetadataCacheConfig {\n    /// Whether the cache is enabled.\n    pub enabled: bool,\n    /// Maximum cache size in bytes (approximate).\n    pub max_size_bytes: u64,\n    /// TTL in milliseconds (0 = no expiry).\n    pub ttl_ms: u64,\n}\n\nimpl Default for MetadataCacheConfig {\n    fn default() -\u003e Self {\n        Self { enabled: true, max_size_bytes: 1024 * 1024 * 1024, ttl_ms: 300_000 }\n    }\n}\n\nstruct MetadataEntry {\n    metadata: Arc\u003cObjectMetadata\u003e,\n    inserted_at: Instant,\n}\n\n/// L2 metadata cache — avoids RocksDB lookups.\npub struct MetadataCache {\n    config: MetadataCacheConfig,\n    entries: DashMap\u003c(BucketId, ObjectKey), MetadataEntry\u003e,\n    stats: MetadataCacheStats,\n}\n\nimpl MetadataCache {\n    /// Creates a new metadata cache.\n    pub fn new(config: MetadataCacheConfig) -\u003e Self {\n        Self { config, entries: DashMap::new(), stats: MetadataCacheStats::default() }\n    }\n\n    /// Retrieves cached metadata.\n    ///\n    /// Returns `None` on miss or TTL expiry.\n    pub fn get(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e Option\u003cArc\u003cObjectMetadata\u003e\u003e {\n        if !self.config.enabled {\n            return None;\n        }\n\n        let lookup = (bucket.clone(), key.clone());\n        if let Some(entry) = self.entries.get(\u0026lookup) {\n            if self.config.ttl_ms \u003e 0 {\n                let age = entry.inserted_at.elapsed();\n                if age \u003e Duration::from_millis(self.config.ttl_ms) {\n                    drop(entry);\n                    self.entries.remove(\u0026lookup);\n                    self.stats.misses.fetch_add(1, Ordering::Relaxed);\n                    return None;\n                }\n            }\n            if entry.metadata.is_inline() {\n                self.stats.inline_hits.fetch_add(1, Ordering::Relaxed);\n            }\n            self.stats.hits.fetch_add(1, Ordering::Relaxed);\n            return Some(entry.metadata.clone());\n        }\n\n        self.stats.misses.fetch_add(1, Ordering::Relaxed);\n        None\n    }\n\n    /// Inserts metadata into the cache.\n    pub fn put(\u0026self, bucket: BucketId, key: ObjectKey, metadata: ObjectMetadata) {\n        if !self.config.enabled {\n            return;\n        }\n        self.entries.insert(\n            (bucket, key),\n            MetadataEntry { metadata: Arc::new(metadata), inserted_at: Instant::now() },\n        );\n    }\n\n    /// Invalidates a cache entry.\n    pub fn invalidate(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) {\n        self.entries.remove(\u0026(bucket.clone(), key.clone()));\n    }\n\n    /// Returns cache statistics.\n    pub fn stats(\u0026self) -\u003e \u0026MetadataCacheStats {\n        \u0026self.stats\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use oceanfs_core::Hlc;\n\n    use super::*;\n\n    fn make_meta(key: \u0026str, inline: bool) -\u003e ObjectMetadata {\n        ObjectMetadata {\n            object_key: ObjectKey::new(key),\n            size: 100,\n            blake3_hash: None,\n            chunks: smallvec::SmallVec::new(),\n            inline_data: if inline { Some(bytes::Bytes::from_static(b\"data\")) } else { None },\n            created_at: 0,\n            hlc: Hlc::zero(),\n        }\n    }\n\n    #[test]\n    fn put_then_get_returns_metadata() {\n        let cache = MetadataCache::new(MetadataCacheConfig::default());\n        let meta = make_meta(\"k\", false);\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), meta);\n\n        let got = cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).unwrap();\n        assert_eq!(got.size, 100);\n    }\n\n    #[test]\n    fn inline_hit_increments_counter() {\n        let cache = MetadataCache::new(MetadataCacheConfig::default());\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), make_meta(\"k\", true));\n        cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\"));\n        assert_eq!(cache.stats().inline_hits.load(Ordering::Relaxed), 1);\n    }\n\n    #[test]\n    fn invalidate_removes_entry() {\n        let cache = MetadataCache::new(MetadataCacheConfig::default());\n        cache.put(BucketId::new(\"b\"), ObjectKey::new(\"k\"), make_meta(\"k\", false));\n        cache.invalidate(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\"));\n        assert!(cache.get(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")).is_none());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-cache","src","l3_negative.rs"],"content":"//! L3 Negative Cache — Bloom filter for non-existent keys.\n//!\n//! Answers \"does this key exist?\" without touching RocksDB. HEAD requests\n//! for non-existent objects return 404 in constant time.\n\nuse std::{\n    collections::hash_map::DefaultHasher,\n    hash::{Hash, Hasher},\n    sync::atomic::{AtomicU64, Ordering},\n};\n\nuse oceanfs_core::{BucketId, ObjectKey};\nuse parking_lot::RwLock;\n\n/// Configuration for the negative cache.\n#[derive(Debug, Clone)]\npub struct NegativeCacheConfig {\n    /// Whether the cache is enabled.\n    pub enabled: bool,\n    /// Size of the bloom filter in bytes.\n    pub size_bytes: usize,\n}\n\nimpl Default for NegativeCacheConfig {\n    fn default() -\u003e Self {\n        Self { enabled: true, size_bytes: 64 * 1024 * 1024 }\n    }\n}\n\n/// Statistics for the negative cache.\n#[derive(Debug, Default)]\npub struct NegativeCacheStats {\n    /// Correctly predicted missing keys.\n    pub hits: AtomicU64,\n    /// False positives (said \"maybe\" but key was absent).\n    pub false_positives: AtomicU64,\n    /// Number of rebuilds performed.\n    pub rebuilds: AtomicU64,\n}\n\n/// A simple Bloom-filter-based negative cache.\npub struct NegativeCache {\n    config: NegativeCacheConfig,\n    bits: RwLock\u003cVec\u003cu8\u003e\u003e,\n    stats: NegativeCacheStats,\n}\n\nimpl NegativeCache {\n    /// Creates a new negative cache.\n    pub fn new(config: NegativeCacheConfig) -\u003e Self {\n        let bit_count = config.size_bytes * 8;\n        let byte_count = bit_count.div_ceil(8);\n        Self {\n            config,\n            bits: RwLock::new(vec![0u8; byte_count]),\n            stats: NegativeCacheStats::default(),\n        }\n    }\n\n    /// Returns `true` if the key MAY exist (possible false positive).\n    /// Returns `false` if the key DEFINITELY does not exist.\n    pub fn contains(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e bool {\n        if !self.config.enabled {\n            // When disabled, always say \"maybe\" to force a real lookup.\n            return true;\n        }\n\n        let bits = self.bits.read();\n        let byte_count = bits.len();\n        if byte_count == 0 {\n            return true;\n        }\n\n        let (h1, h2) = Self::hash_key(bucket, key);\n        let bit_count = byte_count * 8;\n\n        let idx1 = (h1 as usize) % bit_count;\n        let idx2 = (h2 as usize) % bit_count;\n\n        let byte1 = bits[idx1 / 8];\n        let byte2 = bits[idx2 / 8];\n\n        let bit1 = (byte1 \u003e\u003e (idx1 % 8)) \u0026 1;\n        let bit2 = (byte2 \u003e\u003e (idx2 % 8)) \u0026 1;\n\n        bit1 == 1 \u0026\u0026 bit2 == 1\n    }\n\n    /// Inserts a key into the filter.\n    pub fn insert(\u0026self, bucket: \u0026BucketId, key: \u0026ObjectKey) {\n        if !self.config.enabled {\n            return;\n        }\n\n        let mut bits = self.bits.write();\n        let byte_count = bits.len();\n        if byte_count == 0 {\n            return;\n        }\n\n        let (h1, h2) = Self::hash_key(bucket, key);\n        let bit_count = byte_count * 8;\n\n        let idx1 = (h1 as usize) % bit_count;\n        let idx2 = (h2 as usize) % bit_count;\n\n        bits[idx1 / 8] |= 1 \u003c\u003c (idx1 % 8);\n        bits[idx2 / 8] |= 1 \u003c\u003c (idx2 % 8);\n    }\n\n    /// Rebuilds the filter from a set of existing keys.\n    pub fn rebuild\u003cI\u003e(\u0026self, keys: I)\n    where\n        I: IntoIterator\u003cItem = (BucketId, ObjectKey)\u003e,\n    {\n        let mut bits = self.bits.write();\n        bits.fill(0);\n\n        for (bucket, key) in keys {\n            let (h1, h2) = Self::hash_key(\u0026bucket, \u0026key);\n            let bit_count = bits.len() * 8;\n            bits[(h1 as usize % bit_count) / 8] |= 1 \u003c\u003c (h1 as usize % bit_count % 8);\n            bits[(h2 as usize % bit_count) / 8] |= 1 \u003c\u003c (h2 as usize % bit_count % 8);\n        }\n\n        self.stats.rebuilds.fetch_add(1, Ordering::Relaxed);\n    }\n\n    /// Returns cache statistics.\n    pub fn stats(\u0026self) -\u003e \u0026NegativeCacheStats {\n        \u0026self.stats\n    }\n\n    fn hash_key(bucket: \u0026BucketId, key: \u0026ObjectKey) -\u003e (u64, u64) {\n        let mut h1 = DefaultHasher::new();\n        bucket.as_str().hash(\u0026mut h1);\n        key.as_str().hash(\u0026mut h1);\n        let hash1 = h1.finish();\n\n        let mut h2 = DefaultHasher::new();\n        h2.write_u64(hash1);\n        let hash2 = h2.finish();\n\n        (hash1, hash2)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn empty_filter_returns_false() {\n        let cache = NegativeCache::new(NegativeCacheConfig { enabled: true, size_bytes: 1024 });\n        assert!(!cache.contains(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")));\n    }\n\n    #[test]\n    fn insert_then_contains_returns_true() {\n        let cache = NegativeCache::new(NegativeCacheConfig { enabled: true, size_bytes: 1024 });\n        cache.insert(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\"));\n        assert!(cache.contains(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k\")));\n    }\n\n    #[test]\n    fn different_key_returns_false() {\n        let cache = NegativeCache::new(NegativeCacheConfig { enabled: true, size_bytes: 1024 });\n        cache.insert(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k1\"));\n        assert!(!cache.contains(\u0026BucketId::new(\"b\"), \u0026ObjectKey::new(\"k2\")));\n    }\n}\n","traces":[{"line":116,"address":[],"length":0,"stats":{"Line":0}},{"line":117,"address":[],"length":0,"stats":{"Line":0}},{"line":119,"address":[],"length":0,"stats":{"Line":0}},{"line":120,"address":[],"length":0,"stats":{"Line":0}},{"line":121,"address":[],"length":0,"stats":{"Line":0}},{"line":122,"address":[],"length":0,"stats":{"Line":0}},{"line":123,"address":[],"length":0,"stats":{"Line":0}},{"line":126,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":8},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-cache","src","lib.rs"],"content":"//! Multi-layer caching subsystem.\n//!\n//! Three cache layers between the HTTP frontend and the storage engine:\n//!\n//! - **L1 Object Cache:** in-memory LRU of hot blob payloads (zero disk I/O)\n//! - **L2 Metadata Cache:** LRU of `ObjectMetadata` entries (avoids RocksDB)\n//! - **L3 Negative Cache:** Bloom filter for non-existent keys (constant-time 404)\n//!\n//! All caches are node-local and eventually consistent.\n\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n\nmod l1_object;\nmod l2_metadata;\nmod l3_negative;\nmod prefetch;\n\npub use l1_object::ObjectCache;\npub use l2_metadata::MetadataCache;\npub use l3_negative::NegativeCache;\npub use prefetch::PrefetchEngine;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-cache","src","prefetch.rs"],"content":"//! Prefetch engine — speculative cache warming.\n//!\n//! After LIST or GET operations, prefetches metadata for adjacent keys\n//! to warm the caches before the client requests them.\n\n/// Configuration for the prefetch engine.\n#[derive(Debug, Clone)]\npub struct PrefetchConfig {\n    /// Whether prefetching is enabled.\n    pub enabled: bool,\n    /// Number of objects to prefetch after a LIST.\n    pub after_list: usize,\n    /// Number of adjacent objects to prefetch after a GET.\n    pub after_get: usize,\n}\n\nimpl Default for PrefetchConfig {\n    fn default() -\u003e Self {\n        Self { enabled: false, after_list: 16, after_get: 4 }\n    }\n}\n\n/// Orchestrates speculative cache warming.\npub struct PrefetchEngine {\n    config: PrefetchConfig,\n}\n\nimpl PrefetchEngine {\n    /// Creates a new prefetch engine.\n    pub fn new(config: PrefetchConfig) -\u003e Self {\n        Self { config }\n    }\n\n    /// Returns whether prefetching is enabled.\n    pub fn is_enabled(\u0026self) -\u003e bool {\n        self.config.enabled\n    }\n\n    /// Returns the configuration.\n    pub fn config(\u0026self) -\u003e \u0026PrefetchConfig {\n        \u0026self.config\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn disabled_by_default() {\n        let engine = PrefetchEngine::new(PrefetchConfig::default());\n        assert!(!engine.is_enabled());\n    }\n\n    #[test]\n    fn can_be_enabled() {\n        let config = PrefetchConfig { enabled: true, ..Default::default() };\n        let engine = PrefetchEngine::new(config);\n        assert!(engine.is_enabled());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-core","src","config.rs"],"content":"//! OceanFS node configuration.\n//!\n//! Configuration is loaded from `oceanfs.toml` at startup. This module\n//! defines the root config struct and its sub-components. Per-bucket\n//! policy overrides are defined in `oceanfs-server` (Phase 5).\n\nuse std::path::PathBuf;\n\n/// Root configuration for an OceanFS node.\n///\n/// Loaded from `oceanfs.toml` on startup. All fields have sensible\n/// defaults so that a minimal config file is sufficient for development.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::NodeConfig;\n///\n/// let config = NodeConfig::default();\n/// assert_eq!(config.data_dir.to_str().unwrap(), \"/var/lib/oceanfs\");\n/// ```\n#[derive(Debug, Clone)]\npub struct NodeConfig {\n    /// Unique identifier for this node.\n    pub node_id: String,\n    /// Directory for all persistent data (RocksDB, WAL, segments).\n    pub data_dir: PathBuf,\n    /// Address the S3 HTTP API listens on.\n    pub listen_addr: String,\n    /// Address for internal gRPC node-to-node communication.\n    pub grpc_listen_addr: String,\n    /// Bootstrap nodes for cluster discovery.\n    pub seed_nodes: Vec\u003cString\u003e,\n    /// Log level: trace, debug, info, warn, error.\n    pub log_level: String,\n    /// Whether to enable the Prometheus metrics endpoint.\n    pub metrics_enabled: bool,\n    /// Address for the Prometheus metrics HTTP endpoint.\n    pub metrics_listen_addr: String,\n}\n\nimpl Default for NodeConfig {\n    fn default() -\u003e Self {\n        Self {\n            node_id: \"node-1\".into(),\n            data_dir: PathBuf::from(\"/var/lib/oceanfs\"),\n            listen_addr: \"0.0.0.0:9000\".into(),\n            grpc_listen_addr: \"0.0.0.0:9001\".into(),\n            seed_nodes: vec![],\n            log_level: \"info\".into(),\n            metrics_enabled: true,\n            metrics_listen_addr: \"0.0.0.0:9090\".into(),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn default_config_has_expected_listen_addr() {\n        let config = NodeConfig::default();\n        assert_eq!(config.listen_addr, \"0.0.0.0:9000\");\n    }\n\n    #[test]\n    fn default_config_seed_nodes_is_empty() {\n        let config = NodeConfig::default();\n        assert!(config.seed_nodes.is_empty());\n    }\n\n    #[test]\n    fn wal_config_defaults_are_sensible() {\n        let config = WalConfig::default();\n        assert_eq!(config.max_file_size_bytes, 64 * 1024 * 1024);\n        assert_eq!(config.fsync_batch_timeout_ms, 5);\n    }\n}\n\n// ---------------------------------------------------------------------------\n// WalConfig\n// ---------------------------------------------------------------------------\n\n/// Configuration for the Write-Ahead Log.\n///\n/// Controls WAL directory, file rotation, and fsync batching.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::WalConfig;\n///\n/// let config = WalConfig::default();\n/// assert_eq!(config.max_file_size_bytes, 64 * 1024 * 1024);\n/// ```\n#[derive(Debug, Clone)]\npub struct WalConfig {\n    /// Directory where WAL files are stored.\n    pub data_dir: PathBuf,\n    /// Maximum size of a single WAL file before rotation (default 64 MB).\n    pub max_file_size_bytes: u64,\n    /// Maximum time to wait before fsyncing a batch of WAL entries (default 5 ms).\n    ///\n    /// Shorter values reduce latency at the cost of more frequent fsyncs.\n    pub fsync_batch_timeout_ms: u64,\n}\n\nimpl Default for WalConfig {\n    fn default() -\u003e Self {\n        Self {\n            data_dir: PathBuf::from(\"/var/lib/oceanfs/wal\"),\n            max_file_size_bytes: 64 * 1024 * 1024,\n            fsync_batch_timeout_ms: 5,\n        }\n    }\n}\n\n// ---------------------------------------------------------------------------\n// RingConfig\n// ---------------------------------------------------------------------------\n\n/// Configuration for the consistent hashing ring.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::RingConfig;\n///\n/// let config = RingConfig::default();\n/// assert_eq!(config.vnodes_per_node, 256);\n/// assert_eq!(config.replication_factor, 3);\n/// ```\n#[derive(Debug, Clone)]\npub struct RingConfig {\n    /// Number of virtual nodes per physical node (default 256).\n    pub vnodes_per_node: u32,\n    /// Number of successors for each key (default 3).\n    pub replication_factor: u8,\n}\n\nimpl Default for RingConfig {\n    fn default() -\u003e Self {\n        Self { vnodes_per_node: 256, replication_factor: 3 }\n    }\n}\n\n/// Configuration for the RocksDB metadata store.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::MetadataConfig;\n///\n/// let config = MetadataConfig::default();\n/// assert_eq!(config.block_cache_size, 128 * 1024 * 1024);\n/// ```\n#[derive(Debug, Clone)]\npub struct MetadataConfig {\n    /// Directory for RocksDB data files.\n    pub data_dir: std::path::PathBuf,\n    /// Size of the RocksDB block cache in bytes (default 128 MB).\n    pub block_cache_size: usize,\n    /// Size of the RocksDB memtable in bytes (default 64 MB).\n    pub memtable_size: usize,\n}\n\nimpl Default for MetadataConfig {\n    fn default() -\u003e Self {\n        Self {\n            data_dir: std::path::PathBuf::from(\"/var/lib/oceanfs/metadata\"),\n            block_cache_size: 128 * 1024 * 1024,\n            memtable_size: 64 * 1024 * 1024,\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-core","src","error.rs"],"content":"//! OceanFS error types.\n//!\n//! Every OceanFS crate defines its own `Error` enum. This is the root\n//! error type for `oceanfs-core`. All other crates wrap or map into their\n//! own error types at crate boundaries.\n\n/// The root error type for `oceanfs-core`.\n///\n/// Variants are grouped by cause, not by API method:\n/// - Input validation: `InvalidConfig`\n/// - Not found: `BucketNotFound`\n/// - Internal: `Internal`\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::Error;\n///\n/// let err = Error::InvalidConfig(\"missing data_dir\".into());\n/// assert_eq!(err.to_string(), \"invalid config: missing data_dir\");\n/// ```\n#[derive(Debug, thiserror::Error)]\npub enum Error {\n    /// Configuration is invalid or incomplete.\n    #[error(\"invalid config: {0}\")]\n    InvalidConfig(String),\n\n    /// The requested bucket does not exist.\n    #[error(\"bucket not found: {0}\")]\n    BucketNotFound(String),\n\n    /// An internal error occurred.\n    #[error(\"internal error: {0}\")]\n    Internal(String),\n}\n\nimpl Error {\n    /// Returns `true` if this is an `InvalidConfig` error.\n    pub fn is_invalid_config(\u0026self) -\u003e bool {\n        matches!(self, Self::InvalidConfig(_))\n    }\n\n    /// Returns `true` if this is a `BucketNotFound` error.\n    pub fn is_bucket_not_found(\u0026self) -\u003e bool {\n        matches!(self, Self::BucketNotFound(_))\n    }\n}\n\n/// Convenience alias for `std::result::Result\u003cT, Error\u003e`.\npub type Result\u003cT, E = Error\u003e = std::result::Result\u003cT, E\u003e;\n\n#[cfg(test)]\nmod assertions {\n    use static_assertions::assert_impl_all;\n\n    use super::Error;\n\n    assert_impl_all!(Error: std::error::Error, Send, Sync);\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn invalid_config_to_string_includes_message() {\n        let err = Error::InvalidConfig(\"port must be \u003e 0\".into());\n        assert!(err.to_string().contains(\"port must be \u003e 0\"));\n    }\n\n    #[test]\n    fn is_invalid_config_returns_true_for_invalid_config() {\n        assert!(Error::InvalidConfig(\"bad\".into()).is_invalid_config());\n    }\n\n    #[test]\n    fn is_invalid_config_returns_false_for_bucket_not_found() {\n        assert!(!Error::BucketNotFound(\"b\".into()).is_invalid_config());\n    }\n\n    #[test]\n    fn display_output_contains_message() {\n        let err = Error::Internal(\"test\".into());\n        assert!(format!(\"{err}\").contains(\"test\"));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-core","src","hlc.rs"],"content":"//! Hybrid Logical Clock (HLC).\n//!\n//! HLC provides causally-consistent total ordering without requiring\n//! synchronized physical clocks. Each timestamp combines a wall-clock\n//! component (`wall_time`) with a logical counter to disambiguate\n//! events at the same physical time.\n\n/// A 96-bit Hybrid Logical Clock timestamp.\n///\n/// # Ordering\n///\n/// HLCs are totally ordered: first by `wall_time`, then by `logical`.\n/// This ordering is consistent with causal ordering: if event A\n/// happens-before event B, then `A.hlc \u003c B.hlc`.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::Hlc;\n///\n/// let t1 = Hlc::new(1000, 0);\n/// let t2 = Hlc::new(1000, 1);\n/// assert!(t1 \u003c t2);\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, serde::Serialize, serde::Deserialize)]\npub struct Hlc {\n    /// Physical wall-clock component (milliseconds since epoch).\n    pub wall_time: u64,\n    /// Logical counter for events at the same wall time.\n    pub logical: u32,\n}\n\nimpl Hlc {\n    /// Creates a new HLC with the given components.\n    pub fn new(wall_time: u64, logical: u32) -\u003e Self {\n        Self { wall_time, logical }\n    }\n\n    /// Creates a zero-valued HLC (earliest possible timestamp).\n    pub fn zero() -\u003e Self {\n        Self { wall_time: 0, logical: 0 }\n    }\n}\n\nimpl PartialOrd for Hlc {\n    fn partial_cmp(\u0026self, other: \u0026Self) -\u003e Option\u003cstd::cmp::Ordering\u003e {\n        Some(self.cmp(other))\n    }\n}\n\nimpl Ord for Hlc {\n    fn cmp(\u0026self, other: \u0026Self) -\u003e std::cmp::Ordering {\n        self.wall_time.cmp(\u0026other.wall_time).then_with(|| self.logical.cmp(\u0026other.logical))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn newer_wall_time_is_greater() {\n        let a = Hlc::new(1000, 5);\n        let b = Hlc::new(2000, 0);\n        assert!(a \u003c b);\n    }\n\n    #[test]\n    fn same_wall_higher_logical_is_greater() {\n        let a = Hlc::new(1000, 0);\n        let b = Hlc::new(1000, 1);\n        assert!(a \u003c b);\n    }\n\n    #[test]\n    fn identical_hlcs_are_equal_and_not_less() {\n        let a = Hlc::new(1000, 3);\n        let b = Hlc::new(1000, 3);\n        assert_eq!(a, b);\n        assert!(a \u003e= b);\n        assert!(b \u003e= a);\n    }\n\n    #[test]\n    fn zero_is_smallest() {\n        let zero = Hlc::zero();\n        let t = Hlc::new(0, 1);\n        assert!(zero \u003c t);\n    }\n}\n","traces":[{"line":35,"address":[21893216],"length":1,"stats":{"Line":2}},{"line":40,"address":[20732208],"length":1,"stats":{"Line":1}},{"line":46,"address":[20738112],"length":1,"stats":{"Line":0}},{"line":47,"address":[21660686],"length":1,"stats":{"Line":0}},{"line":52,"address":[20732288],"length":1,"stats":{"Line":0}},{"line":53,"address":[21707040,21707054],"length":1,"stats":{"Line":0}}],"covered":2,"coverable":6},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-core","src","lib.rs"],"content":"//! OceanFS core types and traits.\n//!\n//! `oceanfs-core` is the foundation crate — it has zero internal dependencies.\n//! It provides shared types (`SegmentId`, `NodeId`, `BucketId`), the HLC\n//! clock, error types, and configuration structs used by every other crate.\n//!\n//! # Crate Purity\n//!\n//! This crate must never depend on any other `oceanfs-*` crate. CI enforces\n//! this via `cargo tree --edges normal -p oceanfs-core | grep oceanfs-`\n//! which must produce no output.\n\n// ---------------------------------------------------------------------------\n// Lint attributes\n// ---------------------------------------------------------------------------\n#![forbid(unsafe_code)]\n#![deny(\n    clippy::unwrap_used,\n    clippy::expect_used,\n    clippy::wildcard_imports,\n    clippy::undocumented_unsafe_blocks,\n    clippy::missing_errors_doc,\n    clippy::missing_panics_doc,\n    missing_docs\n)]\n// ---------------------------------------------------------------------------\n\nmod config;\nmod error;\nmod hlc;\nmod types;\n\npub use config::{MetadataConfig, NodeConfig, RingConfig, WalConfig};\npub use error::{Error, Result};\npub use hlc::Hlc;\npub use types::{\n    BucketId, ChunkRef, CodecConfig, CodecType, EncodingPlan, GossipConfig, HashOutput, NodeId,\n    NodeState, ObjectKey, ObjectMetadata, SegmentId, SegmentIndexEntry, SegmentMetadata,\n    SegmentSizeConfig, SizeTier, StorageLocation, Tombstone, VnodeRange, WriteAck, WriteResult,\n};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-core","src","types.rs"],"content":"//! Shared types used across all OceanFS crates.\n//!\n//! These are the fundamental domain types — identifiers, hashes, and\n//! keys — that every subsystem references.\n\nuse std::fmt;\n\nuse crate::Hlc;\n\n/// A time-sortable segment identifier (UUIDv7).\n///\n/// Segment IDs are generated when a new active segment is created.\n/// They are used as keys in the `segments` RocksDB column family and\n/// as references in `ObjectMetadata.chunks`.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::SegmentId;\n///\n/// let id = SegmentId::new();\n/// let as_uuid = id.as_uuid();\n/// ```\n#[derive(\n    Debug, Clone, Copy, PartialEq, Eq, Hash, PartialOrd, Ord, serde::Serialize, serde::Deserialize,\n)]\npub struct SegmentId(uuid::Uuid);\n\nimpl SegmentId {\n    /// Creates a new time-sortable segment ID (UUIDv7).\n    pub fn new() -\u003e Self {\n        Self(uuid::Uuid::now_v7())\n    }\n\n    /// Returns the underlying [`uuid::Uuid`].\n    pub fn as_uuid(\u0026self) -\u003e uuid::Uuid {\n        self.0\n    }\n\n    /// Creates a `SegmentId` from a 16-byte UUID byte array.\n    pub fn from_uuid_bytes(bytes: [u8; 16]) -\u003e Self {\n        Self(uuid::Uuid::from_bytes(bytes))\n    }\n}\n\nimpl Default for SegmentId {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl fmt::Display for SegmentId {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        self.0.fmt(f)\n    }\n}\n\n// ---------------------------------------------------------------------------\n// NodeId\n// ---------------------------------------------------------------------------\n\n/// A unique identifier for a node in the OceanFS cluster.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::NodeId;\n///\n/// let node = NodeId::new(\"node-1\");\n/// assert_eq!(node.as_str(), \"node-1\");\n/// ```\n#[derive(\n    Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord, serde::Serialize, serde::Deserialize,\n)]\npub struct NodeId(String);\n\nimpl NodeId {\n    /// Creates a new `NodeId` from a string identifier.\n    pub fn new(id: impl Into\u003cString\u003e) -\u003e Self {\n        Self(id.into())\n    }\n\n    /// Returns the node ID as a string slice.\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\nimpl fmt::Display for NodeId {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        self.0.fmt(f)\n    }\n}\n\nimpl From\u003c\u0026str\u003e for NodeId {\n    fn from(s: \u0026str) -\u003e Self {\n        Self::new(s)\n    }\n}\n\nimpl From\u003cString\u003e for NodeId {\n    fn from(s: String) -\u003e Self {\n        Self(s)\n    }\n}\n\n// ---------------------------------------------------------------------------\n// BucketId\n// ---------------------------------------------------------------------------\n\n/// A bucket identifier.\n///\n/// Bucket names must follow S3 naming conventions: 3–63 characters,\n/// lowercase letters, numbers, hyphens, and periods.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::BucketId;\n///\n/// let bucket = BucketId::new(\"my-photos\");\n/// assert_eq!(bucket.as_str(), \"my-photos\");\n/// ```\n#[derive(\n    Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord, serde::Serialize, serde::Deserialize,\n)]\npub struct BucketId(String);\n\nimpl BucketId {\n    /// Creates a new `BucketId` from a string identifier.\n    ///\n    /// # Panics\n    ///\n    /// Only in debug builds: panics if the name is empty or contains\n    /// uppercase characters to catch configuration errors early.\n    pub fn new(name: impl Into\u003cString\u003e) -\u003e Self {\n        let name = name.into();\n        debug_assert!(!name.is_empty(), \"bucket name must not be empty\");\n        Self(name)\n    }\n\n    /// Returns the bucket name as a string slice.\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\nimpl fmt::Display for BucketId {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        self.0.fmt(f)\n    }\n}\n\nimpl From\u003c\u0026str\u003e for BucketId {\n    fn from(s: \u0026str) -\u003e Self {\n        Self::new(s)\n    }\n}\n\nimpl From\u003cString\u003e for BucketId {\n    fn from(s: String) -\u003e Self {\n        Self(s)\n    }\n}\n\n// ---------------------------------------------------------------------------\n// ObjectKey\n// ---------------------------------------------------------------------------\n\n/// An object key within a bucket.\n///\n/// Object keys are UTF-8 strings that may include `/` delimiters for\n/// hierarchical namespacing (e.g., `photos/2026/vacation/img_001.jpg`).\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::ObjectKey;\n///\n/// let key = ObjectKey::new(\"photos/cat.jpg\");\n/// assert_eq!(key.as_str(), \"photos/cat.jpg\");\n/// ```\n#[derive(\n    Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord, serde::Serialize, serde::Deserialize,\n)]\npub struct ObjectKey(String);\n\nimpl ObjectKey {\n    /// Creates a new `ObjectKey`.\n    pub fn new(key: impl Into\u003cString\u003e) -\u003e Self {\n        Self(key.into())\n    }\n\n    /// Returns the key as a string slice.\n    pub fn as_str(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\nimpl fmt::Display for ObjectKey {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        self.0.fmt(f)\n    }\n}\n\nimpl From\u003c\u0026str\u003e for ObjectKey {\n    fn from(s: \u0026str) -\u003e Self {\n        Self::new(s)\n    }\n}\n\nimpl From\u003cString\u003e for ObjectKey {\n    fn from(s: String) -\u003e Self {\n        Self(s)\n    }\n}\n\n// ---------------------------------------------------------------------------\n// HashOutput\n// ---------------------------------------------------------------------------\n\n/// A 256-bit BLAKE3 hash output (32 bytes).\n///\n/// Used as the object-content checksum, segment checksum, and Merkle tree\n/// node hash throughout the system.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::HashOutput;\n///\n/// let hash = HashOutput::from_bytes([0u8; 32]);\n/// let hex = hash.to_hex();\n/// assert_eq!(hex.len(), 64);\n/// ```\n#[derive(\n    Debug, Clone, Copy, PartialEq, Eq, Hash, PartialOrd, Ord, serde::Serialize, serde::Deserialize,\n)]\npub struct HashOutput([u8; 32]);\n\nimpl HashOutput {\n    /// Creates a `HashOutput` from raw bytes.\n    pub fn from_bytes(bytes: [u8; 32]) -\u003e Self {\n        Self(bytes)\n    }\n\n    /// Returns the hash as a byte slice.\n    pub fn as_bytes(\u0026self) -\u003e \u0026[u8; 32] {\n        \u0026self.0\n    }\n\n    /// Returns the hash as a lowercase hexadecimal string.\n    pub fn to_hex(\u0026self) -\u003e String {\n        hex::encode(self.0)\n    }\n}\n\nimpl fmt::Display for HashOutput {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"{}\", self.to_hex())\n    }\n}\n\n// Minimal hex encoding — avoids an external dependency for a single function.\n// ---------------------------------------------------------------------------\n// SizeTier\n// ---------------------------------------------------------------------------\n\n/// The segment tier for a blob, based on its size.\n///\n/// Determines how the blob is stored: inline in metadata, packed into\n/// a small segment, one blob per standard segment, or split across\n/// multiple segments.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::{SizeTier, SegmentSizeConfig};\n///\n/// let config = SegmentSizeConfig::default();\n/// assert_eq!(config.classify(1024), SizeTier::Inline);\n/// assert_eq!(config.classify(65536), SizeTier::Small);\n/// assert_eq!(config.classify(1048576), SizeTier::Standard);\n/// assert_eq!(config.classify(10485760), SizeTier::Multi);\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, serde::Serialize, serde::Deserialize)]\n#[non_exhaustive]\npub enum SizeTier {\n    /// Blob stored inline in metadata (≤ `inline_threshold_bytes`).\n    Inline,\n    /// Blob packed into a small segment (≤ `small_threshold_bytes`).\n    Small,\n    /// One blob per standard segment (≤ `default_target_size`).\n    Standard,\n    /// Blob split across multiple segments (\u003e `default_target_size`).\n    Multi,\n}\n\n// ---------------------------------------------------------------------------\n// SegmentSizeConfig\n// ---------------------------------------------------------------------------\n\n/// Configuration for tiered segment sizing.\n///\n/// Controls the four-tier storage strategy defined in ADR-0001:\n/// inline, small segment, standard segment, and multi-segment.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::SegmentSizeConfig;\n///\n/// let config = SegmentSizeConfig::default();\n/// assert_eq!(config.inline_threshold_bytes, 4096);\n/// assert_eq!(config.small_threshold_bytes, 262144);\n/// ```\n#[derive(Debug, Clone)]\npub struct SegmentSizeConfig {\n    /// Maximum blob size for inline storage (default 4 KB).\n    pub inline_threshold_bytes: u64,\n    /// Maximum blob size for small segment packing (default 256 KB).\n    pub small_threshold_bytes: u64,\n    /// Target total size for a small segment (default 64 KB).\n    pub small_target_size: u64,\n    /// Target total size for a standard segment (default 4 MB).\n    pub default_target_size: u64,\n}\n\nimpl Default for SegmentSizeConfig {\n    fn default() -\u003e Self {\n        Self {\n            inline_threshold_bytes: 4096,\n            small_threshold_bytes: 262144,\n            small_target_size: 65536,\n            default_target_size: 4194304,\n        }\n    }\n}\n\nimpl SegmentSizeConfig {\n    /// Classifies a blob size into its appropriate storage tier.\n    ///\n    /// # Panics\n    ///\n    /// In debug builds: panics if `blob_size` is zero.\n    pub fn classify(\u0026self, blob_size: u64) -\u003e SizeTier {\n        debug_assert!(blob_size \u003e 0, \"blob size must be \u003e 0\");\n        if blob_size \u003c= self.inline_threshold_bytes {\n            SizeTier::Inline\n        } else if blob_size \u003c= self.small_threshold_bytes {\n            SizeTier::Small\n        } else if blob_size \u003c= self.default_target_size {\n            SizeTier::Standard\n        } else {\n            SizeTier::Multi\n        }\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Hex encoding helper\n// ---------------------------------------------------------------------------\n\n/// Hex encoding for HashOutput.\nmod hex {\n    pub(super) const CHARS: \u0026[u8; 16] = b\"0123456789abcdef\";\n\n    pub(super) fn encode(bytes: [u8; 32]) -\u003e String {\n        let mut out = String::with_capacity(64);\n        for byte in bytes {\n            out.push(CHARS[(byte \u003e\u003e 4) as usize] as char);\n            out.push(CHARS[(byte \u0026 0x0f) as usize] as char);\n        }\n        out\n    }\n}\n\n// ---------------------------------------------------------------------------\n// ChunkRef\n// ---------------------------------------------------------------------------\n\n/// A reference to a blob chunk within a segment.\n///\n/// Each blob's data is stored as one or more chunks within segments.\n/// For inline blobs, `chunks` is empty and `inline_data` in\n/// [`ObjectMetadata`] holds the payload.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::{ChunkRef, SegmentId};\n///\n/// let chunk = ChunkRef {\n///     segment_id: SegmentId::new(),\n///     offset: 0,\n///     length: 1024,\n/// };\n/// assert_eq!(chunk.length, 1024);\n/// ```\n#[derive(Debug, Clone, Copy, PartialEq, Eq, serde::Serialize, serde::Deserialize)]\npub struct ChunkRef {\n    /// The segment containing this chunk.\n    pub segment_id: SegmentId,\n    /// Byte offset of the chunk within the segment.\n    pub offset: u64,\n    /// Length of the chunk in bytes.\n    pub length: u32,\n}\n\n// ---------------------------------------------------------------------------\n// ObjectMetadata\n// ---------------------------------------------------------------------------\n\n/// Metadata for a stored object.\n///\n/// Stored in the `objects` RocksDB column family. For inline blobs\n/// (size ≤ `inline_threshold_bytes`), the payload is stored directly\n/// in `inline_data` and `chunks` is empty.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::{BucketId, ObjectKey, ObjectMetadata, Hlc};\n///\n/// let meta = ObjectMetadata {\n///     object_key: ObjectKey::new(\"photo.jpg\"),\n///     size: 1024,\n///     blake3_hash: None,\n///     chunks: smallvec::SmallVec::new(),\n///     inline_data: Some(bytes::Bytes::from_static(b\"hello\")),\n///     created_at: 0,\n///     hlc: Hlc::zero(),\n/// };\n/// assert!(meta.is_inline());\n/// ```\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\npub struct ObjectMetadata {\n    /// The object's key within its bucket.\n    pub object_key: ObjectKey,\n    /// Total size of the object in bytes.\n    pub size: u64,\n    /// BLAKE3 hash of the object content (None if not yet computed).\n    pub blake3_hash: Option\u003cHashOutput\u003e,\n    /// References to the segments holding this object's data.\n    /// Empty for inline blobs.\n    pub chunks: smallvec::SmallVec\u003c[ChunkRef; 4]\u003e,\n    /// Inline payload for small objects (None for segment-stored blobs).\n    pub inline_data: Option\u003cbytes::Bytes\u003e,\n    /// Unix timestamp when the object was created (milliseconds since epoch).\n    pub created_at: i64,\n    /// HLC timestamp for conflict resolution.\n    pub hlc: Hlc,\n}\n\nimpl ObjectMetadata {\n    /// Returns `true` if this object is stored inline (payload in metadata).\n    pub fn is_inline(\u0026self) -\u003e bool {\n        self.inline_data.is_some()\n    }\n\n    /// Returns `true` if this object is stored in one or more segments.\n    pub fn is_segment_stored(\u0026self) -\u003e bool {\n        !self.chunks.is_empty()\n    }\n}\n\n// ---------------------------------------------------------------------------\n// SegmentMetadata\n// ---------------------------------------------------------------------------\n\n/// Metadata for a sealed segment.\n///\n/// Stored in the `segments` RocksDB column family. Tracks EC parameters,\n/// storage locations, and the Merkle root for integrity verification.\n///\n/// # Examples\n///\n/// ```\n/// use oceanfs_core::{SegmentMetadata, SegmentId, SizeTier};\n///\n/// let meta = SegmentMetadata {\n///     segment_id: SegmentId::new(),\n///     ec_k: 4,\n///     ec_m: 2,\n///     size_tier: SizeTier::Standard,\n///     merkle_root: None,\n///     storage_locations: smallvec::SmallVec::new(),\n///     sealed_at: Some(1700000000000),\n/// };\n/// assert!(meta.is_sealed());\n/// ```\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\npub struct SegmentMetadata {\n    /// The segment's unique identifier.\n    pub segment_id: SegmentId,\n    /// Number of data shards (k) used for this segment.\n    pub ec_k: u8,\n    /// Number of parity shards (m) used for this segment.\n    pub ec_m: u8,\n    /// Storage tier of this segment.\n    pub size_tier: SizeTier,\n    /// Merkle tree root hash (None until computed post-seal).\n    pub merkle_root: Option\u003cHashOutput\u003e,\n    /// Node IDs holding this segment's shards.\n    pub storage_locations: smallvec::SmallVec\u003c[NodeId; 16]\u003e,\n    /// Timestamp when the segment was sealed (milliseconds since epoch).\n    pub sealed_at: Option\u003ci64\u003e,\n}\n\nimpl SegmentMetadata {\n    /// Returns `true` if the segment has been sealed.\n    pub fn is_sealed(\u0026self) -\u003e bool {\n        self.sealed_at.is_some()\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Tombstone\n// ---------------------------------------------------------------------------\n\n/// A deletion marker for a soft-deleted object.\n///\n/// Stored in the `deletions` RocksDB column family. Objects with a\n/// tombstone are considered deleted even if their data still exists\n/// in segments (until GC compaction reclaims the space).\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\npub struct Tombstone {\n    /// When the deletion occurred (milliseconds since epoch).\n    pub deletion_time: i64,\n    /// HLC timestamp for conflict resolution.\n    pub hlc: Hlc,\n}\n\n// ---------------------------------------------------------------------------\n// SegmentIndexEntry and SegmentIndex\n// ---------------------------------------------------------------------------\n\n/// An entry in a segment's blob index.\n///\n/// Maps a blob's position within the segment to its key hash for O(log n) lookup.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, serde::Serialize, serde::Deserialize)]\npub struct SegmentIndexEntry {\n    /// Byte offset of the blob within the segment.\n    pub offset: u64,\n    /// Length of the blob in bytes.\n    pub length: u32,\n    /// SHA-256 hash of the blob's object key for identity verification.\n    pub blob_key_hash: [u8; 32],\n}\n\n// ---------------------------------------------------------------------------\n// VnodeRange\n// ---------------------------------------------------------------------------\n\n/// A key range affected by a ring topology change.\n///\n/// When a node is added or removed from the ring, the affected key range\n/// identifies which keys need data migration.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct VnodeRange {\n    /// Start of the affected key range (inclusive).\n    pub start: [u8; 32],\n    /// End of the affected key range (exclusive).\n    pub end: [u8; 32],\n}\n\n// ---------------------------------------------------------------------------\n// NodeState\n// ---------------------------------------------------------------------------\n\n/// The state of a node in the cluster membership.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum NodeState {\n    /// Node is healthy and participating.\n    Alive,\n    /// Node is suspected down (unreachable via direct or indirect ping).\n    Suspect,\n    /// Node is confirmed dead.\n    Dead,\n    /// Node is gracefully leaving the cluster.\n    Leaving,\n    /// Node has left the cluster.\n    Left,\n}\n\n// ---------------------------------------------------------------------------\n// GossipConfig\n// ---------------------------------------------------------------------------\n\n/// Configuration for the SWIM gossip membership protocol.\n#[derive(Debug, Clone)]\npub struct GossipConfig {\n    /// Interval between gossip rounds in milliseconds.\n    pub interval_ms: u64,\n    /// Time in SUSPECT state before declaring DEAD.\n    pub suspicion_timeout_ms: u64,\n    /// Total time before declaring DEAD.\n    pub failure_timeout_ms: u64,\n    /// Number of peers to route indirect pings through.\n    pub indirect_ping_count: u8,\n}\n\nimpl Default for GossipConfig {\n    fn default() -\u003e Self {\n        Self {\n            interval_ms: 1000,\n            suspicion_timeout_ms: 5000,\n            failure_timeout_ms: 15000,\n            indirect_ping_count: 3,\n        }\n    }\n}\n\n// ---------------------------------------------------------------------------\n// WriteResult / WriteAck\n// ---------------------------------------------------------------------------\n\n/// Result of a successful write operation.\n#[derive(Debug, Clone)]\npub struct WriteResult {\n    /// The object key that was written.\n    pub object_key: ObjectKey,\n    /// The chunks referencing the object's data in segments.\n    pub chunks: smallvec::SmallVec\u003c[ChunkRef; 4]\u003e,\n    /// Total size of the object in bytes.\n    pub size: u64,\n    /// BLAKE3 hash of the object content.\n    pub blake3_hash: Option\u003cHashOutput\u003e,\n}\n\n/// Acknowledgment from a replica node for a write.\n#[derive(Debug, Clone)]\npub struct WriteAck {\n    /// The node that acknowledged.\n    pub node_id: NodeId,\n    /// WAL position on that node.\n    pub wal_position: u64,\n    /// HLC timestamp of the write.\n    pub hlc: Hlc,\n}\n\n/// A storage location — a node holding a segment shard.\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\npub struct StorageLocation {\n    /// The node holding this shard.\n    pub node_id: NodeId,\n    /// Index of the shard (0..k for data, k..k+m-1 for parity).\n    pub shard_index: u8,\n}\n\n// ---------------------------------------------------------------------------\n// CodecType / CodecConfig\n// ---------------------------------------------------------------------------\n\n/// Supported erasure coding codecs.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n#[non_exhaustive]\npub enum CodecType {\n    /// Cauchy Reed-Solomon over GF(2^8).\n    CauchyRs,\n}\n\n/// Configuration for an erasure coding codec.\n#[derive(Debug, Clone)]\npub struct CodecConfig {\n    /// The codec to use.\n    pub codec_type: CodecType,\n    /// Number of data shards (k).\n    pub data_shards: u8,\n    /// Number of parity shards (m).\n    pub parity_shards: u8,\n    /// Size of each shard in bytes.\n    pub strip_size_bytes: usize,\n}\n\nimpl Default for CodecConfig {\n    fn default() -\u003e Self {\n        Self {\n            codec_type: CodecType::CauchyRs,\n            data_shards: 4,\n            parity_shards: 2,\n            strip_size_bytes: 65536,\n        }\n    }\n}\n\n// ---------------------------------------------------------------------------\n// EncodingPlan\n// ---------------------------------------------------------------------------\n\n/// A pre-computed plan for encoding a segment.\n#[derive(Debug, Clone)]\npub struct EncodingPlan {\n    /// Number of stripes in the segment.\n    pub stripe_count: usize,\n    /// Total size after padding.\n    pub padded_size: u64,\n    /// Size of each individual shard.\n    pub shard_size: usize,\n}\n\n// ---------------------------------------------------------------------------\n// Tests\n// ---------------------------------------------------------------------------\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    // -- SegmentId --\n\n    #[test]\n    fn segment_id_new_generates_unique_ids() {\n        let a = SegmentId::new();\n        let b = SegmentId::new();\n        assert_ne!(a, b);\n    }\n\n    #[test]\n    fn segment_id_display_is_uuid_string() {\n        let id = SegmentId::new();\n        let s = id.to_string();\n        // UUIDv7 format: 36 chars with 4 hyphens\n        assert_eq!(s.len(), 36);\n        assert_eq!(s.chars().filter(|c| *c == '-').count(), 4);\n    }\n\n    // -- NodeId --\n\n    #[test]\n    fn node_id_from_str_and_display_roundtrip() {\n        let id = NodeId::from(\"node-7\");\n        assert_eq!(id.as_str(), \"node-7\");\n        assert_eq!(id.to_string(), \"node-7\");\n    }\n\n    // -- BucketId --\n\n    #[test]\n    fn bucket_id_as_str_returns_name() {\n        let bucket = BucketId::new(\"archive\");\n        assert_eq!(bucket.as_str(), \"archive\");\n    }\n\n    // -- ObjectKey --\n\n    #[test]\n    fn object_key_preserves_slashes() {\n        let key = ObjectKey::new(\"a/b/c\");\n        assert_eq!(key.as_str(), \"a/b/c\");\n    }\n\n    // -- HashOutput --\n\n    #[test]\n    fn hash_output_to_hex_is_64_chars() {\n        let hash = HashOutput::from_bytes([0xabu8; 32]);\n        let hex = hash.to_hex();\n        assert_eq!(hex.len(), 64);\n        assert!(hex.chars().all(|c| c.is_ascii_hexdigit()));\n    }\n\n    #[test]\n    fn hash_output_to_hex_is_lowercase() {\n        let hash = HashOutput::from_bytes([0xFFu8; 32]);\n        let hex = hash.to_hex();\n        assert_eq!(hex, \"ff\".repeat(32));\n    }\n\n    // -- SizeTier / SegmentSizeConfig --\n\n    #[test]\n    fn classify_1kb_is_inline() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(1024), SizeTier::Inline);\n    }\n\n    #[test]\n    fn classify_4096_is_inline_boundary() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(4096), SizeTier::Inline);\n    }\n\n    #[test]\n    fn classify_4097_is_small() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(4097), SizeTier::Small);\n    }\n\n    #[test]\n    fn classify_256kb_is_small_boundary() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(262144), SizeTier::Small);\n    }\n\n    #[test]\n    fn classify_256kb_plus_one_is_standard() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(262145), SizeTier::Standard);\n    }\n\n    #[test]\n    fn classify_4mb_is_standard_boundary() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(4194304), SizeTier::Standard);\n    }\n\n    #[test]\n    fn classify_4mb_plus_one_is_multi() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(4194305), SizeTier::Multi);\n    }\n\n    #[test]\n    fn classify_10mb_is_multi() {\n        let config = SegmentSizeConfig::default();\n        assert_eq!(config.classify(10485760), SizeTier::Multi);\n    }\n\n    #[test]\n    #[should_panic]\n    fn classify_zero_panics_in_debug() {\n        let config = SegmentSizeConfig::default();\n        config.classify(0);\n    }\n}\n","traces":[{"line":31,"address":[21680048],"length":1,"stats":{"Line":10}},{"line":32,"address":[20708734],"length":1,"stats":{"Line":10}},{"line":36,"address":[20703344],"length":1,"stats":{"Line":4}},{"line":37,"address":[21631352],"length":1,"stats":{"Line":4}},{"line":41,"address":[21864224],"length":1,"stats":{"Line":2}},{"line":42,"address":[20708654],"length":1,"stats":{"Line":2}},{"line":47,"address":[20717440],"length":1,"stats":{"Line":0}},{"line":48,"address":[21688776],"length":1,"stats":{"Line":0}},{"line":53,"address":[21632592],"length":1,"stats":{"Line":1}},{"line":54,"address":[20704606],"length":1,"stats":{"Line":1}},{"line":79,"address":[21689760],"length":1,"stats":{"Line":1}},{"line":80,"address":[20713015],"length":1,"stats":{"Line":1}},{"line":84,"address":[21680144],"length":1,"stats":{"Line":0}},{"line":85,"address":[20703381],"length":1,"stats":{"Line":0}},{"line":90,"address":[21872016],"length":1,"stats":{"Line":0}},{"line":91,"address":[21639006],"length":1,"stats":{"Line":0}},{"line":96,"address":[21687792],"length":1,"stats":{"Line":0}},{"line":97,"address":[21872069],"length":1,"stats":{"Line":0}},{"line":102,"address":[20716512],"length":1,"stats":{"Line":0}},{"line":103,"address":[20711075],"length":1,"stats":{"Line":0}},{"line":136,"address":[21690106,21690112,21689856],"length":1,"stats":{"Line":2}},{"line":137,"address":[21874139],"length":1,"stats":{"Line":3}},{"line":138,"address":[21690047,21689914,21689967],"length":1,"stats":{"Line":6}},{"line":139,"address":[21874239],"length":1,"stats":{"Line":3}},{"line":143,"address":[21680160],"length":1,"stats":{"Line":4}},{"line":144,"address":[21680165],"length":1,"stats":{"Line":2}},{"line":149,"address":[21687872],"length":1,"stats":{"Line":0}},{"line":150,"address":[21639118],"length":1,"stats":{"Line":0}},{"line":155,"address":[21687904],"length":1,"stats":{"Line":0}},{"line":156,"address":[21639157],"length":1,"stats":{"Line":0}},{"line":161,"address": length":1,"stats":{"Line":0}},{"line":370,"address":[21894012,21893922,21893834],"length":1,"stats":{"Line":0}},{"line":371,"address":[21661109,21661043],"length":1,"stats":{"Line":0}},{"line":372,"address":[20738628],"length":1,"stats":{"Line":0}},{"line":374,"address":[20733071],"length":1,"stats":{"Line":0}},{"line":457,"address":[21631760],"length":1,"stats":{"Line":2}},{"line":458,"address":[21631765],"length":1,"stats":{"Line":2}},{"line":462,"address":[20703728],"length":1,"stats":{"Line":1}},{"line":463,"address":[21864757],"length":1,"stats":{"Line":1}},{"line":512,"address":[20709232],"length":1,"stats":{"Line":2}},{"line":513,"address":[21864821],"length":1,"stats":{"Line":2}},{"line":604,"address":[20712416],"length":1,"stats":{"Line":0}},{"line":677,"address":[20712448],"length":1,"stats":{"Line":0}}],"covered":39,"coverable":73},{"path":["/","home","ndy0","workspace","ocean-fs","crates","oceanfs-ec","src","cauchy.rs"],"content":"//! Cauchy Reed-Solomon erasure coding over GF(2^8).\n//!\n//! Uses Cauchy matrices for efficient encoding and decoding. The\n//! generator matrix is [I_k | C^T] where C is the Cauchy matrix.\n\n#![allow(clippy::needless_range_loop)]\n\nuse oceanfs_core::CodecConfig;\n\nuse crate::{\n    error::{Error, Result},\n    gf,\n    traits::{Decoder, Encoder},\n};\n\n/// A Cauchy Reed-Solomon encoder/decoder.\n///\n/// # Examples\n///\n/// ```ignore\n/// use oceanfs_core::CodecConfig;\n/// use oceanfs_ec::CauchyEncoder;\n/// use oceanfs_ec::{Encoder, Decoder};\n///\n/// let config = CodecConfig { data_shards: 4, parity_shards: 2, ..Default::default() };\n/// let codec = CauchyEncoder::new(config);\n///\n/// let data = [\u0026b\"aaaa\"[..], \u0026b\"bbbb\"[..], \u0026b\"cccc\"[..], \u0026b\"dddd\"[..]];\n/// let parity = codec.encode(\u0026data, 2).unwrap();\n/// assert_eq!(parity.len(), 2);\n/// ```\npub struct CauchyEncoder {\n    k: u8,\n    m: u8,\n}\n\nimpl CauchyEncoder {\n    /// Creates a new Cauchy encoder with the given configuration.\n    pub fn new(config: CodecConfig) -\u003e Self {\n        Self { k: config.data_shards, m: config.parity_shards }\n    }\n\n    /// Returns the number of data shards (k).\n    pub fn data_shards(\u0026self) -\u003e u8 {\n        self.k\n    }\n\n    /// Returns the number of parity shards (m).\n    pub fn parity_shards(\u0026self) -\u003e u8 {\n        self.m\n    }\n\n    /// Generates the Cauchy matrix for (k, m).\n    fn cauchy_matrix(k: u8, m: u8) -\u003e Vec\u003cVec\u003cgf::Gf8\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n\n        // Distinct elements for Cauchy construction: X = [1..k], Y = [k+1..k+m]\n        let mut matrix = vec![vec![0u8; ki]; mi];\n        for i in 0..mi {\n            for j in 0..ki {\n                let x = (j + 1) as u8;\n                let y = (ki + i + 1) as u8;\n                matrix[i][j] = gf::gf_inv(gf::gf_add(x, y));\n            }\n        }\n        matrix\n    }\n\n    /// Builds the generator matrix G (k+m)×k.\n    /// Top k rows: identity. Bottom m rows: Cauchy matrix.\n    fn generator_matrix(k: u8, m: u8) -\u003e Vec\u003cVec\u003cgf::Gf8\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n        let cauchy = Self::cauchy_matrix(k, m);\n\n        let mut g = vec![vec![0u8; ki]; ki + mi];\n\n        // Identity block (top k rows).\n        for i in 0..ki {\n            g[i][i] = 1;\n        }\n\n        // Cauchy block (bottom m rows).\n        for i in 0..mi {\n            for j in 0..ki {\n                g[ki + i][j] = cauchy[i][j];\n            }\n        }\n\n        g\n    }\n\n    /// Encodes data shards into parity shards using the Cauchy matrix.\n    fn encode_cauchy(k: u8, m: u8, data_shards: \u0026[\u0026[u8]]) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        let ki = k as usize;\n        let mi = m as usize;\n        let cm = Self::cauchy_matrix(k, m);\n        let shard_size = data_shards[0].len();\n\n        let mut parity: Vec\u003cVec\u003cu8\u003e\u003e = (0..mi).map(|_| vec![0u8; shard_size]).collect();\n\n        for i in 0..mi {\n            for byte_idx in 0..shard_size {\n                let mut sum: gf::Gf8 = 0;\n                for j in 0..ki {\n                    sum = gf::gf_add(sum, gf::gf_mul(cm[i][j], data_shards[j][byte_idx]));\n                }\n                parity[i][byte_idx] = sum;\n            }\n        }\n\n        Ok(parity)\n    }\n\n    /// Inverts a square matrix over GF(2^8) using Gauss-Jordan elimination.\n    fn invert_matrix(matrix: \u0026[Vec\u003cgf::Gf8\u003e]) -\u003e Option\u003cVec\u003cVec\u003cgf::Gf8\u003e\u003e\u003e {\n        let n = matrix.len();\n        // Augmented matrix [A | I].\n        let mut aug: Vec\u003cVec\u003cgf::Gf8\u003e\u003e = vec![vec![0u8; 2 * n]; n];\n        for i in 0..n {\n            for j in 0..n {\n                aug[i][j] = matrix[i][j];\n            }\n            aug[i][n + i] = 1;\n        }\n\n        // Forward elimination.\n        for col in 0..n {\n            // Find pivot.\n            let mut pivot_row = col;\n            while pivot_row \u003c n \u0026\u0026 aug[pivot_row][col] == 0 {\n                pivot_row += 1;\n            }\n            if pivot_row == n {\n                return None; // singular\n            }\n            aug.swap(col, pivot_row);\n\n            // Normalize pivot row.\n            let inv = gf::gf_inv(aug[col][col]);\n            for j in 0..2 * n {\n                aug[col][j] = gf::gf_mul(aug[col][j], inv);\n            }\n\n            // Eliminate other rows.\n            for row in 0..n {\n                if row == col {\n                    continue;\n                }\n                let factor = aug[row][col];\n                if factor != 0 {\n                    for j in 0..2 * n {\n                        aug[row][j] = gf::gf_add(aug[row][j], gf::gf_mul(factor, aug[col][j]));\n                    }\n                }\n            }\n        }\n\n        // Extract right half.\n        let mut inv = vec![vec![0u8; n]; n];\n        for i in 0..n {\n            for j in 0..n {\n                inv[i][j] = aug[i][n + j];\n            }\n        }\n        Some(inv)\n    }\n}\n\nimpl Encoder for CauchyEncoder {\n    fn encode(\u0026self, data_shards: \u0026[\u0026[u8]], parity_count: u8) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        if data_shards.len() != self.k as usize {\n            return Err(Error::InvalidConfig(format!(\n                \"expected {} data shards, got {}\",\n                self.k,\n                data_shards.len()\n            )));\n        }\n        if data_shards.is_empty() {\n            return Ok(Vec::new());\n        }\n\n        let shard_size = data_shards[0].len();\n        for shard in data_shards.iter() {\n            if shard.len() != shard_size {\n                return Err(Error::ShardSizeMismatch { expected: shard_size, actual: shard.len() });\n            }\n        }\n\n        Self::encode_cauchy(self.k, parity_count, data_shards)\n    }\n}\n\nimpl Decoder for CauchyEncoder {\n    fn decode(\n        \u0026self,\n        available_shards: \u0026[Option\u003c\u0026[u8]\u003e],\n        data_count: u8,\n        parity_count: u8,\n    ) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e\u003e {\n        let k = data_count as usize;\n        let m = parity_count as usize;\n        let total = k + m;\n\n        if available_shards.len() != total {\n            return Err(Error::InvalidConfig(format!(\n                \"expected {} available shards, got {}\",\n                total,\n                available_shards.len()\n            )));\n        }\n\n        // Count available shards and identify which ones.\n        let present: Vec\u003cusize\u003e = (0..total).filter(|\u0026i| available_shards[i].is_some()).collect();\n        if present.len() \u003c k {\n            return Err(Error::NotEnoughShards { needed: k, available: present.len() });\n        }\n\n        // Determine shard size from first available shard.\n        let first_shard = available_shards[present[0]]\n            .ok_or_else(|| Error::InvalidConfig(\"first shard is None\".into()))?;\n        let shard_size = first_shard.len();\n\n        // Build generator matrix G.\n        let gen = Self::generator_matrix(data_count, parity_count);\n\n        // Extract surviving rows of G corresponding to available shards.\n        let mut sub_matrix: Vec\u003cVec\u003cgf::Gf8\u003e\u003e = Vec::with_capacity(k);\n        let mut sub_data: Vec\u003c\u0026[u8]\u003e = Vec::with_capacity(k);\n        let mut selected_indices = Vec::with_capacity(k);\n\n        for \u0026idx in present.iter().take(k) {\n            sub_matrix.push(gen[idx].clone());\n            let shard = available_shards[idx]\n                .ok_or_else(|| Error::InvalidConfig(format!(\"shard {idx} is None\")))?;\n            sub_data.push(shard);\n            selected_indices.push(idx);\n        }\n\n        // Invert sub-matrix.\n        let inv = Self::invert_matrix(\u0026sub_matrix)\n            .ok_or_else(|| Error::DecodingFailed(\"matrix is singular\".into()))?;\n\n        // Reconstruct data shards: data[i] = sum_j inv[i][j] * sub_data[j].\n        let mut recovered: Vec\u003cVec\u003cu8\u003e\u003e = (0..k).map(|_| vec![0u8; shard_size]).collect();\n\n        for i in 0..k {\n            for byte_idx in 0..shard_size {\n                let mut sum: gf::Gf8 = 0;\n                for j in 0..k {\n                    sum = gf::gf_add(sum, gf::gf_mul(inv[i][j], sub_data[j][byte_idx]));\n                }\n                recovered[i][byte_idx] = sum;\n            }\n        }\n\n        // Recovered data is the original k data shards in order.\n        Ok(recovered)\n    }\n}\n\n#[cfg(test)]\n#[allow(clippy::unwrap_used)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn encode_decode_roundtrip_k4_m2() {\n        let codec = CauchyEncoder::new(CodecConfig {\n            data_sh
