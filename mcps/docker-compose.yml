services:
  dgraph-zero:
    image: dgraph/dgraph:v24.0.4
    container_name: cgraph-zero
    restart: unless-stopped
    command: dgraph zero --my=dgraph-zero:5080
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph-zero-data:/dgraph
    networks:
      - cgraph-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dgraph-alpha:
    image: dgraph/dgraph:v24.0.4
    container_name: cgraph-alpha
    restart: unless-stopped
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=0.0.0.0/0
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph-alpha-data:/dgraph
    networks:
      - cgraph-net
    depends_on:
      dgraph-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  qdrant:
    # Pin to a specific version for reproducibility; bump deliberately.
    # Check https://hub.docker.com/r/qdrant/qdrant/tags for the current stable tag.
    image: qdrant/qdrant:latest
    container_name: doc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    # No healthcheck: the qdrant image is distroless (no shell/wget/curl to run a
    # probe with). Readiness is handled app-side — the MCP server waits for
    # Qdrant on startup (see app/server.py).

  doc-mcp:
    build: ./doc-mcp
    container_name: doc-mcp
    restart: unless-stopped
    depends_on:
      - qdrant   # waits for the container to start; the server then polls until
                 # Qdrant actually accepts connections before creating anything.
    ports:
      - "8000:8000"   # MCP streamable-http endpoint: http://localhost:8000/mcp
    environment:
      QDRANT_URL: "http://qdrant:6333"
      COLLECTION: "pipeline_docs"
      EMBED_MODEL: "BAAI/bge-small-en-v1.5"
      VECTOR_SIZE: "384"
      REPO_PATH: "/repo"          # the project git repo, mounted below
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    volumes:
      # Mount YOUR project's git repo read-only. The server reads files and
      # resolves historical blobs via `git cat-file`; it never writes here.
      # Set REPO_HOST_PATH in your shell or a .env file (see .env.example).
      - "${REPO_HOST_PATH:?set REPO_HOST_PATH to your project repo path}:/repo:ro"
  code-graph-mcp:
    build:
      context: ./code-graph-mcp
      dockerfile: Dockerfile
      args:
        # Set LANGUAGE in .env to control which LSP server is installed
        LANGUAGE: ${CG_LANG:-rust}
    container_name: code-graph-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      DGRAPH_URL: "http://dgraph-alpha:8080"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8765"
      LOG_LEVEL: "INFO"
      CODE_LANGUAGE: "${CG_LANG:-rust}"
      LSP_INIT_TIMEOUT: "${LSP_INIT_TIMEOUT:-90}"
      # Java-specific (ignored for other languages)
      JDTLS_HOME: "/opt/jdtls"
      JDTLS_DATA: "/tmp/jdtls-workspace-data"
      # Python-specific
      PYTHON_LSP: "${PYTHON_LSP:-pylsp}"
    volumes:
      - "${REPO_HOST_PATH}:/workspace:rw"
    networks:
      - cgraph-net
    depends_on:
      dgraph-alpha:
        condition: service_healthy
  prometheus:
    # Persistent laptop-side Prometheus ("Solution B"): the SUT's Prometheus
    # is ephemeral (destroyed with the VM), so this service federates every
    # run's metrics through the observe.sh tunnel and keeps them for
    # 365 days. Grafana and the agents (vm-metrics skill) read from HERE,
    # not from the tunnel — history survives VM teardown.
    #
    # Data flow:
    #   SUT Prometheus :9090  --observe.sh tunnel-->  localhost:9090 (host)
    #     -> this container scrapes /federate (15s)  ->  prometheus-storage volume
    #     -> Grafana datasource http://127.0.0.1:9091
    #
    # network_mode: host is REQUIRED (Linux): the observe.sh tunnel binds
    # 127.0.0.1 only (loopback termination by design), and a bridge-mode
    # container reaching host.docker.internal (the Docker bridge gateway)
    # CANNOT reach a loopback-bound listener. With host networking the
    # container shares the host network stack: it targets localhost:9090
    # (the tunnel) directly and listens on 127.0.0.1:9091 — no LAN
    # exposure. Docker Desktop (macOS/Windows) does not support host
    # networking reliably; on those platforms run this service in bridge
    # mode and bind the tunnel on the gateway instead.
    #
    # Bring-up order:
    #   1. ./scripts/observe.sh                    (tunnel SUT:9090 -> localhost:9090)
    #   2. docker compose -f mcps/docker-compose.yml up -d prometheus grafana
    #   3. open http://localhost:3000  -> dashboard "OceanFS Load Test"
    #
    # Host port is 9091, NOT 9090 — localhost:9090 belongs to the tunnel.
    # Pin to the same version the SUT setup script installs.
    image: prom/prometheus:v2.52.0
    container_name: oceanfs-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - prometheus-storage:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      - --web.listen-address=127.0.0.1:9091
      # Admin API (loopback-only): enables the TSDB snapshot endpoint used
      # by scripts/backup-observability.sh.
      - --web.enable-admin-api
  grafana:
    # Laptop-side Grafana for the OceanFS load-test observability stack
    # (ADR-0019 Decision 5). The datasource is the persistent laptop
    # Prometheus (host networking: http://127.0.0.1:9091), NOT the SUT
    # tunnel directly — so dashboards keep showing historical runs even
    # after the SUT VM is destroyed.
    #
    # network_mode: host for the same reason as prometheus above (the
    # datasource is loopback-bound on the host network stack).
    #
    # Bring-up order:
    #   1. ./scripts/observe.sh                    (tunnel SUT:9090 -> localhost:9090)
    #   2. docker compose -f mcps/docker-compose.yml up -d prometheus grafana
    #   3. open http://localhost:3000  -> dashboard "OceanFS Load Test"
    #
    # Pin to a specific version for reproducibility; bump deliberately.
    image: grafana/grafana:11.4.0
    container_name: oceanfs-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      # Local-only credentials (default admin/admin). Override in .env:
      #   GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
    volumes:
      - grafana-storage:/var/lib/grafana
      # Datasource (persistent Prometheus service) + dashboard providers —
      # auto-provisioned on first start.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Single source of truth for the dashboard JSON lives in the repo
      # (scripts/dashboards/load-test.json); mount it read-only instead of
      # copying, so dashboard edits never drift from the provisioning input.
      - ../scripts/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  qdrant_storage:
  dgraph-zero-data:
  dgraph-alpha-data:
  # ⚠ DESTRUCTIVE COMMAND WARNING ⚠
  # `docker compose down --volumes` (or `-v`) DELETES the volumes below.
  # grafana-storage and prometheus-storage hold precious data (every
  # archived load-test run, 365 days of metrics). To reset ONE service's
  # data safely, stop the service and remove only its volume, e.g.:
  #   docker compose -f mcps/docker-compose.yml stop grafana
  #   docker volume rm mcps_grafana-storage
  # And back up first: ./scripts/backup-observability.sh
  grafana-storage:
  prometheus-storage:

networks:
  cgraph-net:
    driver: bridge