[workspace]
members = [
    "crates/oceanfs-core",
    "crates/oceanfs-hash",
    "crates/oceanfs-ec",
    "crates/oceanfs-accel",
    "crates/oceanfs-storage-api",
    "crates/oceanfs-storage",
    "crates/oceanfs-durability",
    "crates/oceanfs-routing",
    "crates/oceanfs-membership",
    "crates/oceanfs-network",
    "crates/oceanfs-cache",
    "crates/oceanfs-server",
    "crates/oceanfs-node",
    "crates/oceanfs",
    "benches",
    "e2e",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ocean-fs/ocean-fs"
rust-version = "1.80"

[workspace.dependencies]
# --- Internal ---
oceanfs-core     = { path = "crates/oceanfs-core" }
oceanfs-hash     = { path = "crates/oceanfs-hash" }
oceanfs-ec       = { path = "crates/oceanfs-ec" }
oceanfs-accel    = { path = "crates/oceanfs-accel" }
oceanfs-storage-api = { path = "crates/oceanfs-storage-api" }
oceanfs-storage  = { path = "crates/oceanfs-storage" }
oceanfs-durability = { path = "crates/oceanfs-durability" }
oceanfs-routing  = { path = "crates/oceanfs-routing" }
oceanfs-membership = { path = "crates/oceanfs-membership" }
oceanfs-network  = { path = "crates/oceanfs-network" }
oceanfs-cache    = { path = "crates/oceanfs-cache" }
oceanfs-server   = { path = "crates/oceanfs-server" }
oceanfs-node     = { path = "crates/oceanfs-node" }

# --- Async Runtime ---
tokio            = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util", "signal"] }
tokio-stream     = "0.1"
tokio-util       = "0.7"

# --- Data ---
bytes            = { version = "1", features = ["serde"] }
smallvec         = { version = "1", features = ["serde"] }
uuid             = { version = "1", features = ["v7", "serde"] }

# --- Zero-Copy ---
bytemuck         = "1"

# --- Serialization ---
serde            = { version = "1", features = ["derive"] }
bincode          = "1"
serde_json       = "1"
toml             = "0.8"
prost            = "0.13"

# --- Concurrency ---
mimalloc         = "0.1"
parking_lot      = "0.12"
dashmap          = "6"
arc-swap         = "1"
rayon            = "1"

# --- Storage ---
rocksdb = "0.22"
num_cpus = "1"

# --- Hashing ---
blake3           = "1"
sha2             = "0.10"

# --- Error Handling ---
thiserror        = "2"

# --- Observability ---
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus       = "0.13"

# --- HTTP Server ---
axum             = { version = "0.8", features = ["http2", "macros"] }
tower            = "0.5"
tower-http       = { version = "0.6", features = ["cors"] }
http             = "1"
mime_guess       = "2"
hmac             = "0.12"

# --- GPU ---
cudarc = "0.12"

# --- Testing ---
criterion = { version = "0.5", features = ["html_reports"] }
proptest          = "1"
static_assertions = "1"

# --- Build ---
tonic            = "0.12"
tonic-build      = "0.12"

[workspace.lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
wildcard_imports = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[profile.release]
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = "symbols"
opt-level       = 3

[profile.dev]
opt-level       = 0

[profile.bench]
lto             = "fat"
codegen-units   = 1
debug           = false
